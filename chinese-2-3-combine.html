<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>貓咪小巷散步・國語二年級第三課〈走過小巷〉（第 17 回）</title>
<style>:root{
  --sky1:#7fd6ff;--sky2:#c9f0ff;--grass:#7ddc6a;--grass2:#4fbf4a;--sun:#ffd84d;--sun2:#ffb703;
  --coral:#ff6b6b;--coral2:#e04848;--blue:#3b9cff;--blue2:#1f78e0;--green:#3ecf72;--green2:#22a653;
  --purple:#9b6bff;--purple2:#7647e0;--ink:#2b3a55;--ink2:#5a6b8c;--card:#ffffff;--line:#d8e6f7;
  --bg:#e8f6ff;--shadow:0 .35rem 0 rgba(30,60,110,.18);--fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(clamp(14px,calc(.6vw + 1.2vh + 6px),32px)*var(--fs));height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;font-weight:700;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:.22rem solid var(--purple);outline-offset:.15rem}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:scr .25s ease}
@keyframes scr{from{opacity:0;transform:translateY(.6rem)}to{opacity:1;transform:none}}
ruby{ruby-position:over}
rt{font-size:.46em;font-weight:700;color:#d0301f;letter-spacing:0;user-select:none}
.zy-off rt{display:none}
.zy-on ruby{ruby-align:center}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:3rem;padding:.55rem 1.3rem;border-radius:1.1rem;
  background:var(--sun);color:#5a3b00;font-size:1.15rem;font-weight:900;box-shadow:0 .3rem 0 var(--sun2);position:relative;top:0;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(.28rem);box-shadow:0 .02rem 0 var(--sun2)}
.btn.g{background:var(--green);color:#fff;box-shadow:0 .3rem 0 var(--green2)}
.btn.g:active:not(:disabled){box-shadow:0 .02rem 0 var(--green2)}
.btn.b{background:var(--blue);color:#fff;box-shadow:0 .3rem 0 var(--blue2)}
.btn.b:active:not(:disabled){box-shadow:0 .02rem 0 var(--blue2)}
.btn.r{background:var(--coral);color:#fff;box-shadow:0 .3rem 0 var(--coral2)}
.btn.r:active:not(:disabled){box-shadow:0 .02rem 0 var(--coral2)}
.btn.p{background:var(--purple);color:#fff;box-shadow:0 .3rem 0 var(--purple2)}
.btn.w{background:#fff;color:var(--ink);box-shadow:0 .3rem 0 #b9cde6}
.btn.w:active:not(:disabled){box-shadow:0 .02rem 0 #b9cde6}
.btn.big{font-size:1.3rem;min-height:3.6rem;padding:.6rem 1.3rem;border-radius:1.3rem}
.btn.sm{min-height:2.4rem;padding:.3rem .8rem;font-size:.95rem;border-radius:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ibtn{width:2.8rem;height:2.8rem;border-radius:50%;background:#fff;box-shadow:0 .22rem 0 #b9cde6;font-size:1.3rem;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ibtn:active{transform:translateY(.2rem);box-shadow:none}
.ibtn.on{background:var(--sun);box-shadow:0 .22rem 0 var(--sun2)}
/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:.5rem;padding:.55rem .7rem;flex:none;flex-wrap:wrap;background:linear-gradient(#fff,#eaf6ff);border-bottom:.2rem solid var(--line);z-index:5}
.hud .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .75rem;border-radius:999px;background:#fff;border:.15rem solid var(--line);font-size:1rem;font-weight:900;white-space:nowrap}
.pill.lv{background:var(--purple);color:#fff;border-color:var(--purple2)}
.pill.coin{background:#fff6cc;border-color:#ffe07a}
.pill.net{background:#dcfbe6;border-color:#9fe6b6}
.xpbar{width:5.5rem;height:.7rem;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden;display:inline-block}
.xpbar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}
.hearts{display:inline-flex;gap:.15rem;font-size:1.3rem}
.hearts .lost{filter:grayscale(1);opacity:.35}
.title-h{font-size:1.25rem;font-weight:900;display:flex;align-items:center;gap:.4rem}
/* ---------- title screen ---------- */
.title-scr{background:linear-gradient(#7fd6ff 0%,#c9f0ff 55%,#bff3c0 55%,#7ddc6a 100%);align-items:center;text-align:center;padding:1rem;overflow:auto}
.title-scr>div{position:relative;z-index:1}
.title-scr .logo{font-size:min(3.4rem,11vw);font-weight:900;color:#fff;text-shadow:0 .25rem 0 var(--blue2),0 .5rem 0 rgba(0,0,0,.12);line-height:1.15;letter-spacing:.05em}
.title-scr .sub{display:inline-block;margin:.4rem 0 .8rem;padding:.3rem 1rem;background:var(--sun);border-radius:99px;color:#5a3b00;font-weight:900;box-shadow:0 .2rem 0 var(--sun2)}
.title-card{background:#fff;border-radius:1.6rem;padding:1rem 1.2rem;box-shadow:var(--shadow);max-width:34rem;width:100%}
.avatars{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:.5rem 0}
.avatars button{width:3.1rem;height:3.1rem;border-radius:1rem;font-size:1.8rem;background:#f0f7ff;border:.2rem solid transparent}
.avatars button.sel{border-color:var(--purple);background:#efe6ff;transform:scale(1.1)}
.nameinp{width:100%;font:inherit;font-size:1.3rem;padding:.6rem 1rem;border-radius:1rem;border:.2rem solid var(--line);text-align:center;font-weight:800;color:var(--ink);background:#fff;user-select:text}
.nameinp:focus{outline:none;border-color:var(--blue)}
.cloud{pointer-events:none;z-index:0;position:absolute;font-size:3rem;opacity:.9;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
/* ---------- hub map ---------- */
.hub{background:linear-gradient(#8fdcff 0%,#d9f4ff 38%,#c4f2b8 38%,#8be07a 100%)}
.mapwrap{flex:1;position:relative;overflow:auto;min-height:0}
.map{position:relative;width:100%;height:100%;min-height:56rem;min-width:min(100%,60rem);margin:0 auto}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.deco{position:absolute;font-size:2.4rem;pointer-events:none;opacity:.95}
.node{background:none;border:0;padding:0;font:inherit;color:inherit;position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.15rem;width:6.9rem;z-index:2}
.node .orb{width:4.6rem;height:4.6rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;
  background:radial-gradient(circle at 30% 25%,#fff8c8,var(--sun) 55%,var(--sun2));border:.28rem solid #fff;box-shadow:0 .4rem 0 rgba(30,60,110,.25);transition:transform .15s}
.node:hover .orb{transform:scale(1.08)}
.node:active .orb{transform:scale(.95)}
.node.cur .orb{animation:bob 1.1s ease-in-out infinite;box-shadow:0 0 0 .35rem rgba(255,255,255,.7),0 .4rem 0 rgba(30,60,110,.25)}
.node.lock .orb{background:radial-gradient(circle at 30% 25%,#eee,#bbb 60%,#999);filter:grayscale(.4)}
.node.boss .orb{width:5.6rem;height:5.6rem;font-size:3rem;background:radial-gradient(circle at 30% 25%,#ffd0d0,var(--coral) 60%,var(--coral2))}
.node .nm{background:#fff;border-radius:.8rem;padding:.1rem .6rem;font-size:.95rem;font-weight:900;box-shadow:0 .15rem 0 rgba(30,60,110,.18);text-align:center;line-height:1.25}
.node .sk{font-size:.72rem;color:var(--ink2);font-weight:800;text-align:center;line-height:1.1;background:rgba(255,255,255,.8);border-radius:.5rem;padding:0 .3rem}
.stars{font-size:1.05rem;letter-spacing:.05rem;filter:drop-shadow(0 .08rem 0 rgba(0,0,0,.2))}
.stars .off{filter:grayscale(1);opacity:.35}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.45rem)}}
.netty{position:absolute;z-index:3;display:flex;align-items:flex-end;gap:.4rem;pointer-events:none}
.netty .bubble{background:#fff;border-radius:1rem;padding:.45rem .8rem;font-size:.95rem;max-width:15rem;box-shadow:var(--shadow);position:relative;pointer-events:auto}
.netty svg{width:4.6rem;height:4.6rem;animation:bob 2.2s ease-in-out infinite;flex:none}
.dock{display:flex;gap:.5rem;padding:.55rem .6rem;justify-content:center;flex-wrap:wrap;flex:none;background:linear-gradient(#fff,#eaf6ff);border-top:.2rem solid var(--line)}
.dock .btn{flex:1;max-width:10rem;min-width:5.5rem;padding:.4rem .5rem;font-size:1rem}
/* ---------- generic page ---------- */
.page{flex:1;overflow:auto;padding:.9rem;min-height:0}
.wrap{max-width:60rem;margin:0 auto;width:100%}
.card{background:var(--card);border-radius:1.2rem;padding:.9rem 1rem;box-shadow:var(--shadow);margin-bottom:.8rem}
.card h3{margin:.1rem 0 .4rem;font-size:1.15rem}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.7rem}
.tab{padding:.45rem 1rem;border-radius:99px;background:#fff;border:.15rem solid var(--line);font-weight:900;font-size:1rem}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue2)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.sw{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.55rem .2rem;border-bottom:.1rem dashed var(--line)}
.sw:last-child{border:0}
.sw small{display:block;font-size:.8rem;color:var(--ink2);font-weight:700}
.toggle{width:3.6rem;height:2rem;border-radius:99px;background:#c9d6e8;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.6rem;height:1.6rem;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 .1rem .2rem rgba(0,0,0,.25)}
.toggle.on{background:var(--green)}
.toggle.on::after{left:1.8rem}
.seg{display:inline-flex;border-radius:.9rem;overflow:hidden;border:.15rem solid var(--line)}
.seg button{padding:.35rem .8rem;background:#fff;font-weight:900}
.seg button.on{background:var(--blue);color:#fff}
.hint{font-size:.9rem;color:var(--ink2);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{padding:.25rem .7rem;border-radius:99px;background:#eef5ff;border:.12rem solid var(--line);font-size:.95rem;font-weight:800}
/* ---------- stage screen ---------- */
.stage{background:linear-gradient(#e9f7ff,#f6fff0)}
.stagebody{flex:1;position:relative;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:.7rem .8rem .9rem;gap:.6rem;align-items:stretch}
.inst{background:#fff;border-radius:1rem;padding:.4rem .8rem;font-size:1rem;box-shadow:0 .2rem 0 rgba(30,60,110,.12);display:flex;align-items:center;gap:.5rem;flex:none}
.inst .em{font-size:1.6rem}
.prog{height:.8rem;background:#d6e6f7;border-radius:99px;overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#9be564);border-radius:99px;transition:width .4s}
/* MCQ */
.qcard{background:#fff;border-radius:1.3rem;padding:1rem 1.1rem;box-shadow:var(--shadow);font-size:1.35rem;line-height:2.3;display:flex;gap:.6rem;align-items:flex-start}
.qcard .qt{flex:1;min-width:0;overflow-wrap:anywhere}
.qcard .sp{flex:none}
.opts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.7rem}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{background:#fff;border-radius:1.1rem;padding:.7rem .9rem;text-align:left;font-size:1.2rem;line-height:1.9;box-shadow:0 .3rem 0 #b9cde6;border:.18rem solid transparent;display:flex;gap:.6rem;align-items:center;min-height:3.4rem;transition:transform .08s}
.opt:active:not(:disabled){transform:translateY(.25rem);box-shadow:0 .03rem 0 #b9cde6}
.opt .k{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:900}
.opt.ok{background:#d9f9e3;border-color:var(--green);box-shadow:0 .3rem 0 var(--green2)}
.opt.ok .k{background:var(--green)}
.opt.bad{background:#ffe0e0;border-color:var(--coral);box-shadow:0 .3rem 0 var(--coral2);animation:shake .35s}
.opt.bad .k{background:var(--coral)}
.opt.gone{opacity:.25;pointer-events:none}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-.4rem)}75%{transform:translateX(.4rem)}}
@media(max-width:34rem){.opts{grid-template-columns:minmax(0,1fr)}}
.skilltag{display:inline-block;font-size:.8rem;background:#efe6ff;color:var(--purple2);border-radius:99px;padding:.05rem .6rem;font-weight:900;margin-right:.4rem;vertical-align:middle}
.mark{background:#fff0a8;border-radius:.4rem;padding:0 .15rem}
.blank{display:inline-block;min-width:2.4em;border-bottom:.18rem solid var(--ink);text-align:center;color:var(--purple2)}
/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(20,40,80,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:46rem;background:#fff;border-radius:1.6rem 1.6rem 0 0;padding:1rem 1.2rem 1.1rem;box-shadow:0 -.4rem 1.2rem rgba(0,0,0,.2);animation:up .28s cubic-bezier(.2,1.3,.5,1);max-height:80%;overflow:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .hd{display:flex;align-items:center;gap:.6rem;font-size:1.5rem;font-weight:900;margin-bottom:.3rem}
.sheet.ok .hd{color:var(--green2)}
.sheet.bad .hd{color:var(--coral2)}
.sheet .body{font-size:1.15rem;line-height:2.2;margin:.2rem 0 .7rem}
.sheet .ans{background:#f0f7ff;border-radius:.9rem;padding:.4rem .8rem;margin:.3rem 0;font-size:1.1rem;line-height:2.1}
.modalbg{position:fixed;inset:0;background:rgba(20,40,80,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:1rem;animation:fade .2s}
.modal{background:#fff;border-radius:1.5rem;padding:1.1rem 1.3rem;max-width:30rem;width:100%;box-shadow:var(--shadow);text-align:center;max-height:92%;overflow:auto}
.modal h2{margin:.2rem 0 .4rem;font-size:1.5rem}
.modal .row{justify-content:center;margin-top:.8rem}
.toast{position:fixed;left:50%;top:5rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.5rem 1.1rem;border-radius:99px;font-size:1.05rem;z-index:70;animation:toast 2.2s forwards;pointer-events:none;text-align:center;max-width:90vw}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-.8rem)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.pop{position:fixed;z-index:65;pointer-events:none;font-weight:900;font-size:1.6rem;color:var(--sun2);text-shadow:0 .1rem 0 #fff,0 0 .3rem #fff;animation:popup .9s forwards}
@keyframes popup{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-3rem) scale(1.3)}}
.conf{position:fixed;top:-2rem;font-size:1.8rem;z-index:80;pointer-events:none;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
/* result */
.result{align-items:center;justify-content:center;text-align:center;padding:1rem;background:linear-gradient(#fff7d1,#e6f7ff);overflow:auto}
.result>.big{font-size:3.2rem;margin:.2rem 0}
.result .stars{font-size:3rem}
.result .rows{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin:.6rem 0}
.result .rows .pill{font-size:1.15rem;padding:.4rem 1rem}
/* ---------- Boss ---------- */
.bosshead{display:flex;align-items:center;gap:.8rem;background:linear-gradient(#ffd6d6,#ffeaea);border-radius:1.2rem;padding:.5rem .9rem;box-shadow:var(--shadow);flex:none}
.bosshead .bossface{font-size:3.2rem}
.powers{display:flex;gap:.5rem;flex:none}
/* ---------- class mode ---------- */
.race{background:linear-gradient(#bfe9ff,#e5f8ff);border-radius:1.2rem;padding:.6rem .8rem;box-shadow:var(--shadow);flex:none}
.rtrack{display:flex;align-items:center;gap:.6rem;margin:.3rem 0}
.rtrack .tn{width:6rem;font-size:1rem;font-weight:900;flex:none;text-align:right;color:var(--ink)}
.rtrack .lane2{flex:1;height:2.4rem;background:rgba(255,255,255,.7);border-radius:99px;position:relative}
.rtrack .bal{position:absolute;top:-.5rem;font-size:2.4rem;transform:translateX(-50%);transition:left .8s cubic-bezier(.3,1.4,.5,1)}
.tpill{padding:.35rem .9rem;border-radius:99px;color:#fff;font-weight:900;font-size:1.2rem;display:inline-block}
.timerbar{height:.9rem;border-radius:99px;background:#d6e6f7;overflow:hidden;flex:none}
.timerbar i{display:block;height:100%;background:var(--green);transition:background .3s}
.teamcfg{display:flex;gap:.5rem;flex-wrap:wrap}
.teamcfg input{font:inherit;font-weight:800;padding:.4rem .7rem;border-radius:.8rem;border:.15rem solid var(--line);width:9rem;user-select:text}
/* ---------- misc ---------- */
.village{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.6rem,1fr));gap:.5rem;background:linear-gradient(#bfe9ff,#bff3b0);border-radius:1.2rem;padding:.8rem;min-height:12rem}
.hut{font-size:2.4rem;text-align:center;line-height:1;position:relative;animation:scr .4s}
.hut::after{content:"";position:absolute;left:50%;top:-.2rem;transform:translateX(-50%);font-size:1.5rem;opacity:.85}
.cert{width:100%;max-width:40rem;border-radius:1rem;box-shadow:var(--shadow);display:block;margin:0 auto}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.6rem}
.badge{background:#fff;border-radius:1rem;padding:.6rem .4rem;text-align:center;box-shadow:0 .2rem 0 #cfdcee;font-size:.85rem;line-height:1.4}
.badge .e{font-size:2.3rem;display:block}
.badge.no{opacity:.4;filter:grayscale(1)}
.bar2{display:flex;align-items:center;gap:.5rem;margin:.3rem 0;font-size:.95rem}
.bar2 .nm{width:7.5rem;flex:none}
.bar2 .tr{flex:1;height:1.2rem;background:#e3eefb;border-radius:99px;overflow:hidden}
.bar2 .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:99px}
.bar2 .v{width:4.5rem;text-align:right;flex:none;font-size:.85rem;color:var(--ink2)}
.wb{background:#fff;border-radius:1rem;padding:.7rem .9rem;box-shadow:0 .2rem 0 #cfdcee;margin-bottom:.6rem;font-size:1.05rem;line-height:2.1}
.idcard{background:linear-gradient(#fff,#fff7dc);border:.18rem solid #ffe07a;border-radius:1rem;padding:.6rem .8rem;line-height:1.9}
.idcard b{font-size:1.4rem;color:var(--coral2)}
.idcard.no{opacity:.45;filter:grayscale(1);border-style:dashed}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.reduce *{animation-duration:.01s!important;transition-duration:.01s!important}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
@media print{body{overflow:visible}#app{position:static}.hud,.dock,.btn,.tabs{display:none}}

#zyBtn{position:fixed;top:.5rem;right:.6rem;z-index:90;min-width:3.5rem;height:3rem;border-radius:1rem;background:#fff;border:.15rem solid var(--line);box-shadow:0 .25rem 0 #b9cde6;font-weight:900;font-size:.9rem;line-height:1.1;padding:.1rem .5rem;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center}
#zyBtn small{font-size:.62rem;letter-spacing:.02rem;color:#d0301f}
#zyBtn.on{background:var(--sun);color:#5a3b00;box-shadow:0 .25rem 0 var(--sun2);border-color:#fff}
#zyBtn:active{transform:translateY(.2rem);box-shadow:none}
.hud,.title-scr{padding-right:4.8rem}
.zy-on .qcard,.zy-on .opt,.zy-on .speech,.zy-on .sheet .body,.zy-on .sheet .ans,.zy-on .inst,.zy-on .sense,.zy-on .brick,.zy-on .ordi,.zy-on .wb,.zy-on .enemy .say,.zy-on .runq,.zy-on .gate .g,.zy-on .sorti,.zy-on .cardc,.zy-on .wtile,.zy-on .idcard,.zy-on .hint{line-height:2.7}
.zy-on .chtile{line-height:2.4;min-width:2.8rem}
.zy-on .pchar,.zy-on .slot{line-height:2.2}
.zy-on .node .nm,.zy-on .node .sk{line-height:2}
.brick .mark{color:#2b3a55}

#go{padding:.7rem .5rem;white-space:nowrap}

.inst>span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
.inst>span:last-child,.opt>span:last-child,.ordi>span:last-child,.speech>div>div{min-width:0}

.zy-on .gate .g{font-size:1rem;line-height:2.5;padding:.3rem 0}.zy-on .gate .g rt{font-size:.4em}

.opt,.sense,.cardc,.ordi,.brick{overflow-wrap:anywhere;max-width:100%}

.btn{white-space:nowrap}.lanebtns .btn{white-space:normal}

.wtile.zt{font-size:1.1rem}
.wtile.sel{outline:3px solid #ffb300;background:#fff8e1}
.wtile.popped.zt{opacity:.5}

1"], "sk": "zy", "s": "今天下午，我走進小⟪巷⟫，", "src": "一.4（短文分句）"}, {"id": "z_b2", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "看見一隻可愛的小花⟪貓⟫在紅磚⟪牆⟫上散步，", "src": "一.4（短文分句）"}, {"id": "z_b3", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "接著輕輕跳上了⟪屋⟫頂。", "src": "一.4（短文分句）"}, {"id": "z_b4", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "回到家時，發現住我們隔壁的林⟪叔⟫⟪叔⟫看起來好⟪忙⟫碌，", "src": "一.4（短文分句）"}, {"id": "z_b5", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "他手裡拿著⟪捧⟫花，笑得好開心。", "src": "一.4（短文分句）"}, {"id": "z_b6", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "原來他今天要⟪娶⟫新⟪娘⟫啦！", "src": "一.4（短文分句）"}, {"id": "z_b7", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "他們家的花園裡，好多⟪蝴⟫⟪蝶⟫飛來飛去，似乎在幫他慶祝呢！", "src": "一.4（短文分句）"}, {"id": "zp_b", "sec": "一", "no": "4", "k": "zp", "st": ["S2"], "sk": "zy", "s": "今天下午，我走進小⟪巷⟫，看見一隻可愛的小花⟪貓⟫在紅磚⟪牆⟫上散步，接著輕輕跳上了⟪屋⟫頂。\n回到家時，發現住我們隔壁的林⟪叔⟫⟪叔⟫看起來好⟪忙⟫碌，他手裡拿著⟪捧⟫花，笑得好開心。原來他今天要⟪娶⟫新⟪娘⟫啦！他們家的花園裡，好多⟪蝴⟫⟪蝶⟫飛來飛去，似乎在幫他慶祝呢！", "title": "林叔叔娶新娘", "qs": [], "src": "一.4（短文）"}, {"id": "z_c1", "sec": "一", "no": "12", "k": "zy", "st": ["S1"], "sk": "zy", "s": "假日早晨，⟪叔⟫⟪叔⟫喜歡沿著紅磚⟪牆⟫，走過小⟪巷⟫子到公園散步。", "src": "一.12（短文分句）"}, {"id": "z_c2", "sec": "一", "no": "12", "k": "zy", "st": ["S1"], "sk": "zy", "s": "那裡有⟪貓⟫咪躺在地上晒太陽，⟪模⟫⟪樣⟫十分可愛。", "src": "一.12（短文分句）"}, {"id": "z_c3", "sec": "一", "no": "12", "k": "zy", "st": ["S1"], "sk": "zy", "s": "還有在花間飛舞的⟪蝴⟫⟪蝶⟫，好像⟪忙⟫著⟪娶⟫新⟪娘⟫，", "src": "一.12（短文分句）"}, {"id": "z_c4", "sec": "一", "no": "12", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪黃⟫色的花朵是⟪美⟫⟪麗⟫的⟪捧⟫花。", "src": "一.12（短文分句）"}, {"id": "z_c5", "sec": "一", "no": "12", "k": "zy", "st": ["S1"], "sk": "zy", "s": "公園旁的木⟪屋⟫咖啡館前面，", "src": "一.12（短文分句）"}, {"id": "z_c6", "sec": "一", "no": "12", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪越⟫來⟪越⟫多精心⟪打⟫⟪扮⟫的遊客會在這裡拍照，", "src": "一.12（短文分句）"}, {"id": "z_c7", "sec": "一", "no": "12", "k": "zy", "st": ["S1"], "sk": "zy", "s": "或是用⟪筆⟫把景色畫下來作紀念。", "src": "一.12（短文分句）"}, {"id": "zp_c", "sec": "一", "no": "12", "k": "zp", "st": ["S2"], "sk": "zy", "s": "假日早晨，⟪叔⟫⟪叔⟫喜歡沿著紅磚⟪牆⟫，走過小⟪巷⟫子到公園散步。那裡有⟪貓⟫咪躺在地上晒太陽，⟪模⟫⟪樣⟫十分可愛。還有在花間飛舞的⟪蝴⟫⟪蝶⟫，好像⟪忙⟫著⟪娶⟫新⟪娘⟫，⟪黃⟫色的花朵是⟪美⟫⟪麗⟫的⟪捧⟫花。\n公園旁的木⟪屋⟫咖啡館前面，⟪越⟫來⟪越⟫多精心⟪打⟫⟪扮⟫的遊客會在這裡拍照，或是用⟪筆⟫把景色畫下來作紀念。", "title": "假日的小巷", "qs": [], "src": "一.12（短文）"}, {"id": "zk_t11", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "我靜靜的走過小⟪巷⟫，王⟪叔⟫⟪叔⟫家的⟪牆⟫上，多了一隻小花⟪貓⟫，", "src": "課本（課文）"}, {"id": "zpk_t1", "sec": "課本", "no": "課文", "k": "zp", "st": ["S2"], "sk": "zy", "s": "我靜靜的走過小⟪巷⟫，王⟪叔⟫⟪叔⟫家的⟪牆⟫上，多了一隻小花⟪貓⟫，正在享受溫暖的陽光。", "title": "課文第一段：小花貓", "qs": [], "src": "課本（課文）"}, {"id": "zk_t21", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "我輕輕的走過小⟪巷⟫，張媽媽⟪屋⟫前的樹上，", "src": "課本（課文）"}, {"id": "zk_t22", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "紅紅的花朵是⟪捧⟫花，⟪蝴⟫⟪蝶⟫⟪忙⟫著⟪娶⟫新⟪娘⟫。", "src": "課本（課文）"}, {"id": "zpk_t2", "sec": "課本", "no": "課文", "k": "zp", "st": ["S2"], "sk": "zy", "s": "我輕輕的走過小⟪巷⟫，張媽媽⟪屋⟫前的樹上，紅紅的花朵是⟪捧⟫花，⟪蝴⟫⟪蝶⟫⟪忙⟫著⟪娶⟫新⟪娘⟫。", "title": "課文第二段：捧花與蝴蝶", "qs": [], "src": "課本（課文）"}, {"id": "zk_t31", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "我慢慢的走過小⟪巷⟫，秋風也很⟪忙⟫，拿著紅⟪黃⟫彩⟪筆⟫跑上跑下，", "src": "課本（課文）"}, {"id": "zk_t32", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "要為⟪巷⟫子⟪打⟫⟪扮⟫新的⟪模⟫⟪樣⟫。", "src": "課本（課文）"}, {"id": "zpk_t3", "sec": "課本", "no": "課文", "k": "zp", "st": ["S2"], "sk": "zy", "s": "我慢慢的走過小⟪巷⟫，秋風也很⟪忙⟫，拿著紅⟪黃⟫彩⟪筆⟫跑上跑下，要為⟪巷⟫子⟪打⟫⟪扮⟫新的⟪模⟫⟪樣⟫。", "title": "課文第三段：秋風", "qs": [], "src": "課本（課文）"}, {"id": "zk_t41", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "我慢慢的走過小⟪巷⟫，輕輕的、靜靜的。", "src": "課本（課文）"}, {"id": "zk_t42", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "一天比一天，我⟪越⟫來⟪越⟫喜歡這個⟪美⟫⟪麗⟫的地方。", "src": "課本（課文）"}, {"id": "zpk_t4", "sec": "課本", "no": "課文", "k": "zp", "st": ["S2"], "sk": "zy", "s": "我慢慢的走過小⟪巷⟫，輕輕的、靜靜的。\n每天每天，都會有一點點不一樣。一天比一天，我⟪越⟫來⟪越⟫喜歡這個⟪美⟫⟪麗⟫的地方。", "title": "課文第四段：美麗的地方", "qs": [], "src": "課本（課文）"}, { s": 2, "why": "兔子、鳥、魚、松鼠和鴨子，一共五種動物。", "src": "十.2（１）", "bk": "b5"}, {"id": "b5q2", "sec": "十", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "兔子為了學什麼技能而跌斷了腿？", "opts": ["學游泳", "學飛", "學挖土", "學爬樹"], "ans": 1, "why": "文章說：兔子為了學飛，而跌斷了腿。", "src": "十.2（２）", "bk": "b5"}, {"id": "b5q3", "sec": "十", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "這個故事告訴我們什麼道理？", "opts": ["每種動物都有自己的才能。", "動物該學會所有的技能。", "大家要多幫助別人。", "人人要愛護動物。"], "ans": 0, "why": "故事最後說：每一種動物都有屬於自己特別的才能，不可能樣樣都會，也不能勉強。", "src": "十.2（３）", "bk": "b5"}, {"id": "b6q1", "sec": "十一", "no": "1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "「黃粱一夢」是比喻什麼？", "opts": ["黃粱飯很難煮熟", "在煮黃粱飯時會作夢", "榮華富貴的生活很快樂", "榮華富貴像是一場夢"], "ans": 3, "why": "書生醒來，發覺榮華富貴只是一場夢，所以「黃粱一夢」比喻榮華富貴像一場夢。", "src": "十一（１）", "bk": "b6"}, {"id": "b6q2", "sec": "十一", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "「黃粱」是指什麼？", "opts": ["一個城市名", "一條路名", "一種穀物", "一種文具"], "ans": 2, "why": "旅店老闆正在煮黃粱飯，所以「黃粱」是一種穀物。", "src": "十一（２）", "bk": "b6"}, {"id": "b6q3", "sec": "十一", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "書生在夢中過著怎樣的生活？", "opts": ["榮華富貴", "窮苦潦倒", "東逃西躲", "農耕度日"], "ans": 0, "why": "夢裡他娶了高官的女兒，當了宰相，生活富裕又幸福，是榮華富貴。", "src": "十一（３）", "bk": "b6"}, {"id": "b6q4", "sec": "十一", "no": "4", "k": "mc", "st": ["S10"], "sk": "read", "stem": "有關這個故事的內容，下面哪一個說法錯誤？", "opts": ["書生和道士在旅店相遇。", "道士向書生說出自己不幸的遭遇。", "書生靠著枕頭睡著了。", "書生作了一個美夢。"], "ans": 1, "why": "是書生向道士說出自己的不幸遭遇，不是道士向書生說，所以第二個說法是錯的。", "src": "十一（４）", "bk": "b6"}, {"id": "b7q1", "sec": "補充", "no": "1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "小花貓每天早上在哪裡曬太陽？", "opts": ["紅磚牆上", "草地上", "屋子裡"], "ans": 0, "why": "短文說：小花貓每天早上，都會在紅磚牆上曬太陽。", "src": "補充（短文）", "bk": "b7", "gen": 1}, {"id": "b7q2", "sec": "補充", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "中午，小花貓跳到哪裡？", "opts": ["屋頂", "樹下", "河邊"], "ans": 0, "why": "短文說：中午，牠跳到屋頂。", "src": "補充（短文）", "bk": "b7", "gen": 1}, {"id": "b7q3", "sec": "補充", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", " "], "sk": "tf", "stem": "「好熱鬧哇！」句尾用驚嘆號是對的。", "ans": 1, "why": "表示很驚喜、很讚嘆，句尾可以用驚嘆號。", "src": "是非題（依試卷內容改編）"}, {"id": "tf096", "sec": "補充", "no": "96", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「商店裡有蘋果、番茄、香蕉和西瓜。」標點符號用對了。", "ans": 1, "why": "蘋果、番茄、香蕉是同類的詞語，中間用頓號隔開。", "src": "是非題（依試卷內容改編）"}, {"id": "tf097", "sec": "補充", "no": "97", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「商店裡有蘋果。番茄。香蕉和西瓜。」標點符號用對了。", "ans": 0, "why": "蘋果、番茄、香蕉是同類的詞語，中間要用頓號，不能用句號。", "src": "是非題（依試卷內容改編）"}, {"id": "tf098", "sec": "補充", "no": "98", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「小朋友在公園裡盪秋千、玩翹翹板和跑步。」標點符號用對了。", "ans": 1, "why": "盪秋千、玩翹翹板、跑步，是同類的動作，用頓號隔開。", "src": "是非題（依試卷內容改編）"}, {"id": "tf099", "sec": "補充", "no": "99", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「手忙腳亂」是說做事慌張，不知如何是好。", "ans": 1, "why": "「手忙腳亂」，是形容做事慌張，不知如何是好。", "src": "是非題（依試卷內容改編）"}, {"id": "tf100", "sec": "補充", "no": "100", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「不慌不忙」是說做事很慌張。", "ans": 0, "why": "「不慌不忙」是動作從容，沒有慌張的樣子。", "src": "是非題（依試卷內容改編）"}, {"id": "tf101", "sec": "補充", "no": "101", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「十全十美」是說非常完美，沒有缺點。", "ans": 1, "why": "「十全十美」，是形容事物非常完美，沒有缺點。", "src": "是非題（依試卷內容改編）"}, {"id": "tf102", "sec": "補充", "no": "102", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「明知故犯」是說明明知道不對，卻故意去做。", "ans": 1, "why": "「明知故犯」，是明明知道不對，卻故意去做。", "src": "是非題（依試卷內容改編）"}, {"id": "tf103", "sec": "補充", "no": "103", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「裝模作樣」是說故意做作，假裝出某種樣子。", "ans": 1, "why": "「裝模作樣」，是故意做作，假裝出某種樣子。", "src": "是非題（依試卷內容改編）"}, {"id": "tf104", "sec": "補充", "no": "104", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "課文說，我輕輕的走過小巷。", "ans": 1, "why": "課文第二段說：我輕輕的走過小巷。", "src": "是非題（依試卷內容改編）"}, {"id": "tf105", "sec": "補充", "no": "105", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "課文說，我很快的跑過小巷。", "ans": 0, "why": "課文說的是「靜靜的、輕輕的、慢慢的」走過小巷，不是很快的跑過。", "src": "是非題（依試卷內容改編）"}, {"id": "tf106", "sec": "補充", "no": "106", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "課文說，王叔叔家的牆上，多了一隻小 opts": ["越過", "越雨", "越桌"], "ans": 0, "why": "「越過」是一個詞語。", "src": "二.7"}, {"id": "q3_1", "sec": "三", "no": "1", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "將注音寫成國字後，哪一組的字完全正確？\n①⟪叔⟫父正⟪捧⟫腹大笑（寫成：淑、捧）\n②用鉛⟪筆⟫勾勒出模⟪樣⟫（寫成：筆、樣）\n③⟪巷⟫弄裡有好多⟪蝴⟫蝶（寫成：卷、蝴）\n④姐姐⟪忙⟫著幫自己打⟪扮⟫（寫成：忙、粉）", "opts": ["第①組", "第②組", "第③組", "第④組"], "ans": 1, "why": "第②組「筆、樣」完全正確。第①組的「叔」寫成了「淑」，第③組的「巷」寫成了「卷」，第④組的「扮」寫成了「粉」。", "src": "三.1", "pO": 1, "say": "將注音寫成國字後，哪一組的字完全正確？第一組，淑、捧。第二組，筆、樣。第三組，卷、蝴。第四組，忙、粉。"}, {"id": "q3_2", "sec": "三", "no": "2", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "他在⟪屋⟫外種了很多花。\n看注音，選出對的字。", "opts": ["室", "握", "屋", "至"], "ans": 2, "why": "「屋外」的「屋」，是這個字。", "src": "三.2", "pO": 1, "say": "他在屋外種了很多花。看注音，選出對的字。"}, {"id": "q3_3", "sec": "三", "no": "3", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "「扌＋奉」可以組成什麼字？", "opts": ["俸", "棒", "捧", "推"], "ans": 2, "why": "「扌」加上「奉」，合起來是「捧」。", "src": "三.3", "pO": 1, "say": "扌加奉，可以組成什麼字？"}, {"id": "q3_4", "sec": "三", "no": "4", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "「這棟老舊的房握檣上布滿裂痕，看起來不太安全的漾子，讓人擔心。」\n句子中的錯別字有哪些？", "opts": ["棟，檣，擔", "棟，檣，裂", "握，檣，漾", "握，痕，漾"], "ans": 2, "why": "正確的寫法是「房屋」「牆」「樣子」，所以錯別字是「握」「檣」「漾」。", "src": "三.4", "pO": 1, "say": "這棟老舊的房握，檣上布滿裂痕，看起來不太安全的漾子，讓人擔心。句子中的錯別字有哪些？"}, {"id": "q3_5", "sec": "三", "no": "5", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "走出這條小⟪巷⟫子後，就可以看到大馬路。\n看注音，選出對的字。", "opts": ["巷", "港", "卷", "危"], "ans": 0, "why": "「小巷子」的「巷」，是這個字。", "src": "三.5", "pO": 1, "say": "走出這條小巷子後，就可以看到大馬路。看注音，選出對的字。"}, {"id": "q4_1a", "sec": "四", "no": "1", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "「⟬美⟭」的部首是什麼？", "opts": ["羊", "大", "王"], "ans": 0, "why": "「美」的部首是「羊」。", "src": "四.1", "pO": 1}, {"id": "q4_1b", "sec": "四", "no": "1", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「美」可以組成哪一個詞語？", "opts": ["美德", "美雨", "美鞋"], "ans": 0, "why": "「美德」是一個詞語，是指好的品德。", "src": "四.1", "pO": 1}, {"id": "q4_2", "sec": "四", "no": "2", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「捧」可以組成哪一個詞語？", "opts": ["捧場", "捧雨", "捧鞋"], "ans": 0, "why": "「捧場」是一個詞語，是指去支持、鼓勵別人。", "src": "四.2", "pO": 1}, {"id": "q4_3a", "sec": "四", "no": "3", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "數一數筆畫。\n「⟬黃⟭」一共有幾畫？", "opts": ["12 畫", "8 畫", "10 畫"], "ans": 0, "why": "「黃」一共有 12 畫。", "src": "四.3", "pO": 1}, {"id": "q4_3b", "sec": "四", "no": "3", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「黃」可以組成哪一個詞語？", "opts": ["黃色", "黃雨", "黃鞋"], "ans": 0, "why": "「黃色」是一個詞語。", "src": "四.3", "pO": 1}, {"id": "q4_4", "sec": "四", "no": "4", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「打」可以組成哪一個詞語？", "opts": ["拍打", "打雲", "打桌"], "ans": 0, "why": "「拍打」是一個詞語。", "src": "四.4", "pO": 1}, {"id": "q6_1", "sec": "六", "no": "1", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "下面哪個情況適合用「手忙腳亂」來形容？", "opts": ["演員一邊化妝一邊聊天，上臺表演前也完全不緊張。", "那位服務生個性沉穩，面對突發狀況都能冷靜處理。", "哥哥上課快遲到了，他一邊穿衣服，一邊收拾書包。", "考生仔細整理文具，很有信心的踏入考場。"], "ans": 2, "why": "「手忙腳亂」，是形容做事慌張，不知如何是好。哥哥快遲到了，一邊穿衣服，一邊收拾書包，就是手忙腳亂。", "src": "六.1"}, {"id": "q6_2", "sec": "六", "no": "2", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「這篇文章並不是□□□□，仍有改進的空間。」\n空格中應該填入哪個詞語？", "opts": ["手忙腳亂", "十全十美", "裝模作樣", "不慌不忙"], "ans": 1, "why": "「十全十美」，是形容事物非常完美，沒有缺點。文章還有改進的空間，所以說「並不是十全十美」。", "src": "六.2"}, {"id": "q6_3", "sec": "六", "no": "3", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「明天一早就要出門了，現在先把需要的東西準備好，免得到時候□□□□。」\n空格中應該填入哪個詞語？", "opts": ["手忙腳亂", "十全十美", "明知故犯", "不慌不忙"], "ans": 0, "why": "「手忙腳亂」，是做事慌張，不知如何是好。先準備好東西，就不會到時候手忙腳亂。", "src": "六.3"}, {"id": "q6x_1", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「看見老師突然走進教室，他嚇得□□□□，書本都掉到地上了。」\n空格要填哪一個成語？", "opts": ["手忙腳亂", "不慌不忙", "十全十美", "明知故犯"], "ans": 0, "why": "「手忙腳亂」，是形容做事慌張，不知如何是好。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_2", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「這件事他做得□□□□，一點缺點也找不到。」\n空格要填哪一個成語？", "opts": ["十全十美", "手忙腳亂", "裝模作樣", "明知故犯"], "ans": 0, "why": "「十全十美」，是形容事物非常完美，沒有缺點。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_3", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「他其實不會游泳，卻在朋友面前□□□□，結果出了醜。」\n空格要填哪一個成語？", "opts": ["裝模作樣", "不慌不忙", "十全十美", "一模一樣"], "ans": 0, "why": "「裝模作樣」，是故意做作，假裝出某種樣子。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_4", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「遇到緊急的事情，他總是□□□□，一件一件慢慢處理。」\n空格要填哪一個成語？", "opts": ["不慌不忙", "手忙腳亂", "明知故犯", "裝模作樣"], "ans": 0, "why": "「不慌不忙」，是形容動作從容，沒有慌張的樣子。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_5", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「他知道不可以闖紅燈，卻還是闖了，真是□□□□。」\n空格要填哪一個成語？", "opts": ["明知故犯", "不慌不忙", "十全十美", "五顏六色"], "ans": 0, "why": "「明知故犯」，是明明知道不對，卻故意去做。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_6", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「這對雙胞胎長得□□□□，連老師也分不出來。」\n空格要填哪一個成語？", "opts": ["一模一樣", "五顏六色", "無精打采", "手忙腳亂"], "ans": 0, "why": "「一模一樣」，是形容兩樣東西完全相同。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_7", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「花園裡開著□□□□的小花，真好看。」\n空格要填哪一個成語？", "opts": ["五顏六色", "一模一樣", "無精打采", "不慌不忙"], "ans": 0, "why": "「五顏六色」，是形容顏色很多。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_8", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「他昨晚沒睡好，今天上課□□□□。」\n空格要填哪一個成語？", "opts": ["無精打采", "興高采烈", "十全十美", "五顏六色"], "ans": 0, "why": "「無精打采」，是沒有精神。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_9", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「同學們得到第一名，個個□□□□。」\n空格要填哪一個成語？", "opts": ["興高采烈", "無精打采", "手忙腳亂", "明知故犯"], "ans": 0, "why": "「興高采烈」，是形容心情高興、精神很好。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_10", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「雨後的小巷，花朵上掛著水珠，景色□□□□。」\n空格要填哪一個成語？", "opts": ["美不勝收", "無精打采", "手忙腳亂", "明知故犯"], "ans": 0, "why": "「美不勝收」，是美好的東西太多，看都看不完。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_11", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「手忙腳亂」是什麼意思？", "opts": ["做事慌張，不知如何是好", "動作從容，一點也不急", "沒有精神，想睡覺"], "a why": "「屋頂」是房屋最上面的部分。那棟有白色屋頂的房子，就是老師的家。", "src": "課本（習作二：填寫適當的詞語）", "pO": 1, "say": "選出對的詞語，放進空格。那棟有白色，空格，的房子，就是老師的家。"}, {"id": "ck_2", "sec": "課本", "no": "填詞", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "選出對的詞語，放進空格。\n參加活動的同學，請盡快到會場（　　）。", "opts": ["報到", "屋頂", "室內"], "ans": 0, "why": "「報到」，是到達一個地方，向負責人說明自己來了。", "src": "課本（習作二：填寫適當的詞語）", "pO": 1, "say": "選出對的詞語，放進空格。參加活動的同學，請盡快到會場，空格。"}, {"id": "ck_3", "sec": "課本", "no": "填詞", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "選出對的詞語，放進空格。\n我一進門就把窗戶打開，保持（　　）空氣流通。", "opts": ["室內", "屋頂", "報到"], "ans": 0, "why": "「室內」是房間裡面，保持室內空氣流通，要把窗戶打開。", "src": "課本（習作二：填寫適當的詞語）", "pO": 1, "say": "選出對的詞語，放進空格。我一進門就把窗戶打開，保持，空格，空氣流通。"}, {"id": "ck_4", "sec": "課本", "no": "填詞", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "選出對的詞語，放進空格。\n每（　　）週末，爸爸會帶著我到室外走走。", "opts": ["到", "室", "屋"], "ans": 0, "why": "「每到週末」的「到」，是這個字。", "src": "課本（我會認字：至字家族）", "pO": 1, "say": "選出對的詞語，放進空格。每，空格，週末，爸爸會帶著我到室外走走。"}, {"id": "ck_5", "sec": "課本", "no": "填詞", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "選出對的字，放進空格。\n我們常在木（　　）前的草地放風箏。", "opts": ["屋", "室", "到"], "ans": 0, "why": "「木屋」的「屋」，是這個字。", "src": "課本（我會認字：至字家族）", "pO": 1, "say": "選出對的字，放進空格。我們常在木，空格，前的草地放風箏。"}, {"id": "cq_1", "sec": "課本", "no": "看圖", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "選出適當的詞語，放進空格。\n當愛麗絲（　　）在樹下看書時，看到一隻兔子匆匆的跑進樹洞。", "opts": ["靜靜的", "匆匆的"], "ans": 0, "why": "愛麗絲坐在樹下看書，要用「靜靜的」；兔子急著趕時間，才是「匆匆的」。", "src": "課本（習作三：看圖選出適當的答案）", "pO": 1, "say": "選出適當的詞語，放進空格。當愛麗絲，空格，在樹下看書時，看到一隻兔子匆匆的跑進樹洞。"}, {"id": "cq_2", "sec": "課本", "no": "看圖", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "選出適當的詞語，放進空格。\n看到一隻兔子（　　）跑進樹洞，還大喊著：「來不及了！」", "opts": ["匆匆的", "靜靜的"], "ans": 0, "why": "兔子大喊「來不及了」，是急急忙忙的樣子，要用「匆匆的」。", "src": "課本（習作三：看圖選出適當的答案）", "pO": 1, "say": "選出適當的詞語，放進空格。看到一隻兔子，空格，跑進樹洞，還大喊著：來不及了！"}, {"id": "cq_3", "sec": "課本", "no": "看圖", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "選出適當的詞語，放進空格。\n太陽（　　）升起，天漸漸亮了。", "opts": ["慢慢的", "輕輕的"], "ans": 0, "why": "太陽升起很慢，天漸漸亮了，要用「慢慢的」。", "src": "課本（習作三：看圖選出適當的答案）", "pO": 1, "say": "選出適當的詞語，放進空格。太陽，空格，升起，天漸漸亮了。"}, {"id": "cq_4", "sec": "課本", "no": "看圖", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "選出適當的詞語，放進空格。\n皇后在王子耳邊（　　）說：「起床了！」", "opts": ["輕輕的", "慢慢的"], "ans": 0, "why": "在耳邊小聲叫人起床，要用「輕輕的」，才不會嚇到他。", "src": "課本（習作三：看圖選出適當的答案）", "pO": 1, "say": "選出適當的詞語，放進空格。皇后在王子耳邊，空格，說：起床了！"}, {"id": "cs_1", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "這一課的作者是誰？", "opts": ["馮輝岳", "林良", "王淑芬"], "ans": 0, "why": "課文旁寫著：馮輝岳。", "src": "課本（課文）"}, {"id": "cs_2", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「我靜靜的走過小巷」，「靜靜的」是在說什麼？", "opts": ["走路很安靜的樣子", "走路很快的樣子", "走路很累的樣子"], "ans": 0, "why": "「靜靜的」，是形容走路很安靜的樣子。", "src": "課本（課文）"}, {"id": "cs_3", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「紅紅的花朵是捧花」，「捧花」是什麼？", "opts": ["新娘手裡拿的一束花", "種在地上的花", "畫在牆上的花"], "ans": 0, "why": "「捧花」，是新娘手裡拿的一束花。", "src": "課本（課文）"}, {"id": "cs_4", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「蝴蝶忙著娶新娘」，「娶」是什麼意思？", "opts": ["結婚時，把新娘接進家門", "搬到新房子", "參加生日會"], "ans": 0, "why": "「娶」，是結婚時，把新娘接進家門。", "src": "課本（課文）"}, {"id": "cs_5", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「秋風也很忙」，「忙」是什麼意思？", "opts": ["事情很多，沒有空閒", "很安靜，不說話", "很快樂，一直笑"], "ans": 0, "why": "「忙」，是事情很多，沒有空閒。", "src": "課本（課文）"}, {"id": "cs_6", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「拿著紅黃彩筆跑上跑下」，是說秋風怎麼做？", "opts": ["像拿著彩筆，把樹葉染成紅色和黃色", "真的拿著筆在牆上畫畫", "在地上撿紅色黃色的筆"], "ans": 0, "why": "秋天到了，秋風像拿著彩筆，把樹葉染成紅色和黃色，所以說拿著紅黃彩筆跑上跑下。", "src": "課本（課文）"}, {"id": "cs_7", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「要為巷子打扮新的模樣」，「打扮」是什麼意思？", "opts": ["把東西弄得漂亮", "把東西打破", "把東西丟掉"], "ans": 0, "why": "「打扮」，是把人或東西弄得漂亮。", "src": "課本（課文）"}, {"id": "cs_8", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「一天比一天，我越來越喜歡這個美麗的地方」，「越來越」是什麼意思？", "opts": ["喜歡的程度，一點一點增加", "喜歡的程度，一點一點減少", "一點也不喜歡"], "ans": 0, "why": "「越來越」，是說程度一點一點增加。", "src": "課本（課文）"}, {"id": "cs_9", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「每天每天，都會有一點點不一樣」，是說小巷怎麼樣？", "opts": ["每天都有一點點變化", "每天都完全一樣", "每天都變得很髒"], "ans": 0, "why": "「每天都會有一點點不一樣」，是說小巷每天都有一點點變化。", "src": "課本（課文）"}, {"id": "cs_10", "sec": "課本", "no": "課文", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「走過小巷」一共有幾段？", "opts": ["四段", "三段", "五段"], "ans": 0, "why": "課文一共有四段。", "src": "課本（課文）"}, {"id": "cr_1", "sec": "課本", "no": "認字", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「刂」加上「至」，是哪一個字？", "opts": ["到", "室", "屋"], "ans": 0, "why": "「刂」加上「至」，是「到」。", "src": "課本（我會認字：至字家族）"}, {"id": "cr_2", "sec": "課本", "no": "認字", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「宀」加上「至」，是哪一個字？", "opts": ["室", "到", "屋"], "ans": 0, "why": "「宀」加上「至」，是「室」。", "src": "課本（我會認字：至字家族）"}, {"id": "cr_3", "sec": "課本", "no": "認字", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「尸」加上「至」，是哪一個字？", "opts": ["屋", "室", "到"], "ans": 0, "why": "「尸」加上「至」，是「屋」。", "src": "課本（我會認字：至字家族）"}, {"id": "cr_4", "sec": "課本", "no": "認字", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「到」可以組成哪一個詞語？", "opts": ["到處", "到雲", "到桌"], "ans": 0, "why": "「到處」，是每一個地方。", "src": "課本（我會認字：至字家族）"}, {"id": "cr_5", "sec": "課本", "no": "認字", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「室」可以組成哪一個詞語？", "opts": ["室外", "室雲", "室桌"], "ans": 0, "why": "「室外」，是房間外面。", "src": "課本（我會認字：至字家族）"}, {"id": "cr_6", "sec": "課本", "no": "認字", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「屋」可以組成哪一個詞語？", "opts": ["房屋", "房雨", "房桌"], "ans": 0, "why": "「房屋」，是人住的屋子。", "src": "課本（我會認字：至字家族）"}, {"id": "cr_7", "sec": "課本", "no": "認字", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「到、室、屋」都有哪一個部件？", "opts": ["至", "主", "玉"], "ans": 0, "why": "「到、室、屋」都有「至」，是「至」字家族。", "src": "課本（我會認字：至字家族）"}, {"id": "cr_8", "sec": "課本", "no": "認字", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「室」的部首是什麼？", "opts": ["宀（寶蓋頭）", "尸", "刀"], "ans": 0, "why": "「室」的上面是寶蓋頭，部首是「宀」。", "src": "課本（我會認字：至字家族）"}, {"id": "cr_9", "sec": "課本", "no": "認字", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「直到太陽下山才回家」，「直到」是什麼意思？", "opts": ["一直到某個時候", "馬上就", "從來不"], "ans": 0, "why": "「直到」，是一直到某個時候。", "src": "課本（我會認字：至字家族）"}, {"id": "cr_10", "sec": "課本", "no": "認字", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「室內」的相反詞是什麼？", "opts": ["室外", "教室", "屋頂"], "ans": 0, "why": "「室內」是房間裡面，「室外」是房間外面，意思相反。", "src": "課本（我會認字：至字家族）"}, {"id": "cf_1", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「靜靜的、輕輕的、慢慢的」，都是強調什麼的詞語？", "opts": ["動作", "顏色", "數量"], "ans": 0, "why": "靜靜的、輕輕的、慢慢的，都是強調動作的詞語。", "src": "課本（習作三：認識詞語）"}, {"id": "cf_2", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "哪一個詞語，加在「唱著兒歌」前面，會讓動作更生動？", "opts": ["輕輕的", "藍藍的", "三個"], "ans": 0, "why": "「輕輕的唱著兒歌」，加上「輕輕的」，動作更生動。", "src": "課本（習作三：認識詞語）"}, {"id": "cf_3", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「慢慢的走進教室」，加上「慢慢的」，讓人知道什麼？", "opts": ["走進教室的樣子", "教室的大小", "教室的顏色"], "ans": 0, "why": "「慢慢的」是在說走進教室的樣子。", "src": "課本（習作三：認識詞語）"}, {"id": "cf_4", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「正在」是什麼意思？", "opts": ["事情現在進行中", "事情已經結束", "事情還沒開始"], "ans": 0, "why": "「正在」，是說事情現在進行中。", "src": "課本（習作四：正在）"}, {"id": "cf_5", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "哪一句用對了「正在」？", "opts": ["小花貓正在享受溫暖的陽光。", "小花貓昨天正在睡覺了。", "正在小花貓的陽光。"], "ans": 0, "why": "「小花貓正在享受溫暖的陽光。」先說誰，再說正在，最後說做什麼，用對了。", "src": "課本（習作四：正在）"}, {"id": "cf_6", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「現在是晚上六點鐘，媽媽正在煮晚餐。」媽媽現在在做什麼？", "opts": ["煮晚餐", "看電視", "睡覺"], "ans": 0, "why": "「正在煮晚餐」，是說媽媽現在正在煮晚餐。", "src": "課本（習作四：正在）"}, {"id": "cf_7", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「紅的、黃的、藍的和白的」，顏色詞語中間要用什麼標點符號隔開？", "opts": ["頓號", "逗號", "句號"], "ans": 0, "why": "顏色詞語是同類的詞語，中間要用頓號「、」隔開，不是逗號。", "src": "課本（我會找出句子的錯誤：頓號）"}, {"id": "cf_8", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「他忙著畫什麼呢？」句尾要用什麼標點符號？", "opts": ["問號", "驚嘆號", "句號"], "ans": 0, "why": "這是一句問句，心中有疑問時，要用問號，不是驚嘆號。", "src": "課本（我會找出句子的錯誤：問號）"}, {"id": "cf_9", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「好熱鬧哇！」句尾的「！」叫什麼？", "opts": ["驚嘆號", "問號", "頓號"], "ans": 0, "why": "「！」叫做驚嘆號，表示很驚喜、很讚嘆。", "src": "課本（我會找出句子的錯誤：驚嘆號）"}, {"id": "cf_10", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「商店裡有蘋果、番茄、香蕉和西瓜。」蘋果、番茄、香蕉是什麼樣的詞語？", "opts": ["同類的詞語", "不同意思的動作", "同樣的字"], "ans": 0, "why": "蘋果、番茄、香蕉，都是水果，是同類的詞語，中間用頓號隔開。", "src": "課本（習作五：標點符號）"}, {"id": "g3_1", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "小花貓在哪裡散步？", "opts": ["紅磚牆上", "屋頂上", "公園裡"], "ans": 0, "why": "短文說：小花貓在紅磚牆上散步。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "今天下午，小花貓在紅磚牆上散步。"}, {"id": "g3_2", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "林叔叔手裡拿著什麼？", "opts": ["捧花", "彩筆", "小魚乾"], "ans": 0, "why": "短文說：林叔叔手裡拿著一束捧花。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "林叔叔手裡拿著一束紅色的捧花，笑得好開心。"}, {"id": "g3_3", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "蝴蝶好像在做什麼？", "opts": ["幫新娘慶祝", "找東西吃", "睡午覺"], "ans": 0, "why": "短文說：蝴蝶好像在幫新娘慶祝。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "小巷裡的蝴蝶飛來飛去，好像在幫新娘慶祝。"}, {"id": "g3_4", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "樹葉被染成什麼顏色？", "opts": ["紅色和黃色", "藍色和紫色", "黑色和白色"], "ans": 0, "why": "短文說：樹葉被染成了紅色和黃色。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "秋風拿著紅黃彩筆跑上跑下，把樹葉染成了紅色和黃色。"}, {"id": "g3_5", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "小花貓正在做什麼？", "opts": ["享受陽光", "抓老鼠", "洗澡"], "ans": 0, "why": "短文說：小花貓正在享受溫暖的陽光。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "小花貓趴在屋前，正在享受溫暖的陽光。"}, {"id": "g3_6", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "我是怎麼走過小巷的？", "opts": ["靜靜的", "跑跑跳跳的", "唱著歌"], "ans": 0, "why": "短文說：我靜靜的走過那條長長的小巷。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "每天放學，我都靜靜的走過那條長長的小巷。"}, {"id": "g3_7", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "蜜蜂忙著做什麼？", "opts": ["採花蜜", "睡覺", "游泳"], "ans": 0, "why": "短文說：蜜蜂忙著在花園裡採花蜜。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "蜜蜂忙著在花園裡採花蜜，一刻也不休息。"}, {"id": "g3_8", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "媽媽正在做什麼？", "opts": ["煮飯", "寫功課", "看電視"], "ans": 0, "why": "短文說：媽媽正在廚房煮飯。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "媽媽正在廚房煮飯，我在客廳寫功課。"}, {"id": "g3_9", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "春天像什麼？", "opts": ["愛畫畫的小女孩", "愛唱歌的小鳥", "愛睡覺的小熊"], "ans": 0, "why": "短文說：春天像愛畫畫的小女孩。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "春天像愛畫畫的小女孩，用彩色筆畫出一朵朵小花。"}, {"id": "g3_10", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "我對小巷的感覺是什麼？", "opts": ["越來越喜歡", "越來越害怕", "越來越討厭"], "ans": 0, "why": "短文說：我越來越喜歡這條小巷。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "這條小巷一天比一天漂亮，我越來越喜歡它。"}], "books": [{"id": "b0", "title": "走過小巷（課文）", "src": "課本 第三課", "e": "🐱", "paras": ["我靜靜的走過小巷，王叔叔家的牆上，多了一隻小花貓，正在享受溫暖的陽光。", "我輕輕的走過小巷，張媽媽屋前的樹上，紅紅的花朵是捧花，蝴蝶忙著娶新娘。", "我慢慢的走過小巷，秋風也很忙，拿著紅黃彩筆跑上跑下，要為巷子打扮新的模樣。", "我慢慢的走過小巷，輕輕的、靜靜的。每天每天，都會有一點點不一樣。一天比一天，我越來越喜歡這個美麗的地方。"], "notes": []}, {"id": "b1", "title": "春天像什麼", "src": "一.3（閱讀）", "e": "🌸", "paras": ["春天像愛畫畫的小女孩，用彩筆在草地上畫出粉色、黃色、紫色等各種顏色的小花。這些花朵一下子就有了生命，每朵花都忙著打扮自己，有的像鈴鐺，有的像星星，各種模樣都有。", "春天看著這片美麗的景色，覺得越來越開心，又繼續畫出小樹苗、小動物等，讓大地充滿生機。"], "notes": []}, {"id": "b2", "title": "林叔叔娶新娘", "src": "一.4（閱讀）", "e": "💐", "paras": ["今天下午，我走進小巷，看見一隻可愛的小花貓在紅磚牆上散步，接著輕輕跳上了屋頂。", "回到家時，發現住我們隔壁的林叔叔看起來好忙碌，他手裡拿著捧花，笑得好開心。原來他今天要娶新娘啦！他們家的花園裡，好多蝴蝶飛來飛去，似乎在幫他慶祝呢！"], "notes": []}, {"id": "b3", "title": "假日的小巷", "src": "一.12（閱讀）", "e": "📷", "paras": ["假日早晨，叔叔喜歡沿著紅磚牆，走過小巷子到公園散步。那裡有貓咪躺在地上晒太陽，模樣十分可愛。還有在花間飛舞的蝴蝶，好像忙著娶新娘，黃色的花朵是美麗的捧花。", "公園旁的木屋咖啡館前面，越來越多精心打扮的遊客會在這裡拍照，或是用筆把景色畫下來作紀念。"], "notes": []}, {"id": "b4", "title": "貪睡的小兔子", "src": "十.1（閱讀）", "e": "🐰", "paras": ["貪睡的小兔子每天都覺得自己睡不飽，他常常祈求天神讓天不要亮，好讓他睡個夠。天神終於聽到了他的祈禱①，讓黑夜變得很長很長。小兔子終於可以安穩②的睡在兔屋裡，感覺真是美好！", "沒想到黑夜變長，方便小偷活動。這天夜裡，一個小偷看見農莊裡可愛的兔屋，便把小兔子拖出來，搬走了兔屋。", "由於天沒亮，氣溫比較低，小兔子沒有屋子可以避寒，冷得直發抖。他又想起天神，於是再一次祈禱：天神哪！我不要長長的黑夜了，請讓天空亮起來吧！", "不久，天慢慢的亮了，小兔子開心聽著公雞的啼叫聲，因為在他耳裡聽來，現在已不再是吵人的雞啼了。"], "notes": ["祈禱：禱告求福。", "安穩：安全穩當。"]}, {"id": "b5", "title": "動物學校", "src": "十.2（閱讀）", "e": "🏫", "paras": ["有一天，兔子、鳥、魚、松鼠和鴨子一起開會，他們決定要創辦一所動物學校，讓每種動物具備各種才能。", "大家討論著要安排什麼課程。", "兔子說：「跑步很重要，要列入課程。」", "魚說：「游泳很重要，要列入課程。」", "小鳥說：「飛翔很重要，要列入課程。」", "松鼠說：「挖土更重要，要列入課程。」", "所以，他們把這些技能都列入課程裡。兔子是跑步高手，但是為了學飛，而跌斷了腿。小鳥很會飛，但為了挖土而折傷翅膀，還啄斷了鳥嘴。小松鼠會爬樹，也會挖地洞，但為了學游泳，差點兒溺水。魚在水中自由自在①，一離開水，差點兒一命嗚呼②。鴨子游泳的技術很棒，挖土時，也啄斷鴨嘴，傷痕累累③。", "最後，大家終於明白，每一種動物都有屬於自己特別的才能，不可能樣樣都會，也不能勉強。"], "notes": ["自由自在：形容不受任何拘束，隨心所欲，安詳悠閒。", "一命嗚呼：「嗚呼」是悲哀的感嘆詞。「一命嗚呼」指死亡。", "傷痕累累：形容受傷後所留下的傷痕很多。"]}, {"id": "b6", "title": "黃粱一夢", "src": "十一（閱讀）", "e": "🛏️", "paras": ["一個窮書生在一家旅店中，對偶然遇到的道士說出自己的不幸遭遇。", "不久，書生覺得有些疲累，道士便從背包中拿出枕頭給書生。這時旅店老闆正在煮黃粱飯，離吃飯還有一段時間，書生就靠著枕頭躺下，立刻睡著作起夢來。", "在夢裡，他娶了高官的女兒，生活富裕且幸福。第二年，他考中進士，後來步步高升，最後還當了宰相。他的五個兒子都在朝廷做官，孫子們也個個出類拔萃①。他的人生已達到子孫滿堂、幸福美滿的境界。", "不久，書生醒來，發覺原來只是一場夢。道士還在身邊，而老闆的黃粱飯還沒有煮熟呢！書生說起夢中的一切，覺得十分感慨②。道士笑著說：「人生所追求的，不就像是一場夢嗎？」"], "notes": ["出類拔萃：形容才能特出，超越眾人。", "感慨：有所感觸而發出嘆息。"]}, {"id": "b7", "title": "小花貓的一天", "src": "補充", "e": "🐈", "paras": ["小花貓每天早上，都會在紅磚牆上曬太陽。", "中午，牠跳到屋頂，看著天空飛過的小鳥。", "傍晚，牠慢慢走回家，張阿姨拿出小魚乾給牠吃。", "小花貓吃飽了，就在窗邊睡著了。"], "notes": []}, {"id": "b8", "title": "雨後的小巷", "src": "補充", "e": "🌂", "paras": ["昨晚下了一場大雨，今天早上，小巷裡的地面濕濕的。", "我撐著小花傘，慢慢的走過小巷。", "牆邊的小花上，掛著亮晶晶的水珠，一隻蝴蝶停在花上休息。", "雨後的小巷，空氣真清新，我越來越喜歡這個地方了。"], "notes": []}], "img": {}, "cover": [["一", "國字注音（詞語與句子 10 題、短文 3 篇）", ["z3_1", "z3_2", "z3_5", "z3_6", "z3_7", "z3_8", "z3_9", "z3_10", "z3_11", "z3_13", "z_a1", "z_a2", "z_a3", "z_a4", "zp_a", "z_b1", "z_b2", "z_b3", "z_b4", "z_b5", "z_b6", "z_b7", "zp_b", "z_c1", "z_c2", "z_c3", "z_c4", "z_c5", "z_c6", "z_c7", "zp_c"]], ["一", "閱讀測驗：春天像什麼、林叔叔娶新娘、假日的小巷（完整短文）", ["b1q1", "b1q2", "b2q1", "b2q2", "b3q1", "b3q2", "b3q3"]], ["二", "造詞（黃、貓、巷、娘、樣、麗、越；改成選出正確的詞語，共 7 題）", ["q2_1", "q2_2", "q2_3", "q2_4", "q2_5", "q2_6", "q2_7"]], ["三", "選擇題：「扌＋奉」可 function zyArr(str){const a=[];for(const ch of str)a.push(isCJK(ch)?(ZYC[ch]||''):null);
  for(const [sub,off,zy] of ZYS){let i=-1;while((i=str.indexOf(sub,i+1))>=0)if(a[i+off]!==undefined&&a[i+off]!==null)a[i+off]=zy}
  if(str==='子')a[0]='ㄗˇ';
  const tone=z=>!z?0:/ˊ$/.test(z)?2:/ˇ$/.test(z)?3:/ˋ$/.test(z)?4:/˙$/.test(z)?5:1;
  const ch=[...str];
  for(let i=0;i<ch.length;i++){const c=ch[i];if(c!=='一'&&c!=='不')continue;if(a[i]===null)continue;
    const nx=ch[i+1];if(!nx||!isCJK(nx))continue;const pv=ch[i-1];
    let tn=tone(a[i+1]);if(nx==='個')tn=4;
    if(c==='不'){if(tn===4)a[i]='ㄅㄨˊ';continue}
    if(pv&&'第十唯統單之週期星'.includes(pv))continue;
    if(pv&&pv===nx){a[i]='ㄧ˙';continue}
    if(tn===4)a[i]='ㄧˊ';else if(tn>=1&&tn<=3)a[i]='ㄧˋ'}
  return a}
/* T：把字串轉成帶注音的 HTML。特殊標記：⟦ ⟧ 螢光標記；「（　　）」→ 空格底線；⟪ㄅㄆㄇ⟫ → 空白格＋永遠顯示注音（要寫國字）；⟬字⟭ → 不帶注音的框字（要寫注音） */
function zyArr2(str){if(!/[⟬⟭]/.test(str))return zyArr(str);const zc=zyArr(str.replace(/[⟬⟭]/g,'')),o=[];let k=0;for(const ch of str){if(ch==='⟬'||ch==='⟭')o.push(null);else o.push(zc[k++])}return o}
function T(str,opt){str=String(str==null?'':str);const zs=zyArr2(str);let out='',i=0;
  while(i<str.length){
    if(str[i]==='（'){let j=i+1;while(j<str.length&&str[j]==='　')j++;if(j>i+1&&str[j]==='）'){out+='<span class="blank">　　</span>';i=j+1;continue}}
    const ch=str[i];
    if(ch==='⟪'){const j=str.indexOf('⟫',i);if(j>i){out+=`<ruby class="zb"><span class="zbx">　</span><rt>${esc(str.slice(i+1,j))}</rt></ruby>`;i=j+1;continue}}
    if(ch==='⟬'){const j=str.indexOf('⟭',i);if(j>i){out+=`<span class="zq">${esc(str.slice(i+1,j))}</span>`;i=j+1;continue}}
    if(ch==='⟦'){out+='<span class="mark">';i++;continue}
    if(ch==='⟧'){out+='</span>';i++;continue}
    if(ch==='\n'){out+='<br>';i++;continue}
    if(zs[i]!==null&&zs[i]!==undefined&&zs[i]!==''){out+=`<ruby>${ch}<rt>${zs[i]}</rt></ruby>`}else out+=esc(ch);
    i++}
  return IM(out)}

let AC=null;function getAC(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f,d,delay=0,type='sine',v=.13){if(!S.sfx)return;try{if(!getAC())return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime+delay);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+delay+d);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+delay);o.stop(AC.currentTime+delay+d+.02)}catch(e){}}
function chime(f,d=.7,delay=0,v=.16){if(!S.sfx)return;try{if(!getAC())return;const t=AC.currentTime+delay;[[1,1],[2.01,.28],[3.02,.1]].forEach(([m,a])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v*a,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+d/(m>1?1.6:1));o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)})}catch(e){}}
function sfx(k){if(!S.sfx)return;
  if(k==='ok'){[784,988,1319].forEach((f,i)=>chime(f,i==2?.9:.28,i*.075,.3))}
  else if(k==='bad'){beep(220,.18,0,'triangle',.09);beep(180,.22,.1,'triangle',.08)}
  else if(k==='win'){[523,659,784,1047,1319].forEach((f,i)=>chime(f,.8,i*.12,.26))}
  else if(k==='pop'){beep(660,.07,0,'square',.05);beep(990,.08,.05,'square',.05)}
  else if(k==='whack'){beep(180,.09,0,'sawtooth',.08);beep(90,.12,.04,'sine',.1)}
  else if(k==='coin'){beep(1320,.08,0,'square',.05);beep(1760,.14,.07,'square',.05)}
  else if(k==='lvl'){[523,659,784,988,1175,1568].forEach((f,i)=>chime(f,.5,i*.09,.22))}
  else if(k==='tick'){beep(900,.04,0,'square',.03)}

function pickVoice(){if(MOBILE)return null;const vs=zhVoices();if(!vs.length)return null;
  if(S&&S.voice){const h=vs.find(v=>v.name===S.voice);if(h)return h}

function ttsChunks(raw){const s=zyVoice(MOBILE?plain(raw):ttsFix(plain(raw))).replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\uFE0F]/gu,'').replace(/\s+/g,' ').trim();if(!s)return[];
  const sent=s.match(/[^。！？；\n]+[。！？；]?/g)||[s];const out=[];
  sent.forEach(x=>{x=x.trim();if(!x)return;if(x.length<=34){out.push(x);return}
    const sub=x.match(/[^，、：]+[，、：]?/g)||[x];let cur='';sub.forEach(y=>{if((cur+y).length>26&&cur){out.push(cur);cur=y}else cur+=y});if(cur)out.push(cur)});

function say(t,onEnd,force){const fin=()=>{if(onEnd)onEnd()};
  if((!S.tts&&!force)||!('speechSynthesis'in window)||!t){fin();return}
  try{const tok=++SAYTOK;const parts=ttsChunks(t);if(!parts.length){fin();return}

    setTimeout(()=>{if(tok!==SAYTOK){fin();return}let i=0;
      const next=()=>{if(tok!==SAYTOK){fin();return}if(i>=parts.length){fin();return}
        const txt=parts[i++];const u=new SpeechSynthesisUtterance(txt);u.lang='zh-TW';u.rate=sayRate();
        const v=CVD?CV:ensureVoice();if(v)u.voice=v;
        if(speechSynthesis.paused)speechSynthesis.resume();
        let did=false;const once=()=>{if(did)return;did=true;clearTimeout(wd);next()};u.onend=once;u.onerror=once;

const ZINI={ㄓ:'ㄗ',ㄗ:'ㄓ',ㄔ:'ㄘ',ㄘ:'ㄔ',ㄕ:'ㄙ',ㄙ:'ㄕ',ㄋ:'ㄌ',ㄌ:'ㄋ',ㄈ:'ㄏ',ㄏ:'ㄈ',ㄅ:'ㄆ',ㄆ:'ㄅ',ㄉ:'ㄊ',ㄊ:'ㄉ',ㄐ:'ㄑ',ㄑ:'ㄐ',ㄍ:'ㄎ',ㄎ:'ㄍ'};
let VALIDZ=null;
function zyVariants(z,n){if(!VALIDZ){VALIDZ=new Set(Object.values(ZYC));ZYS.forEach(r=>VALIDZ.add(r[2]))}
  const m=z.match(/^([ㄅ-ㄩ]+)([ˊˇˋ˙]?)$/);if(!m)return[];const base=m[1],tone=m[2];let tv=[],iv=[],fv=[];
  ['','ˊ','ˇ','ˋ'].forEach(t=>{if(t!==tone)tv.push(base+t)});
  if(ZINI[base[0]])iv.push(ZINI[base[0]]+base.slice(1)+tone);
  const last=base[base.length-1];if(last==='ㄣ')fv.push(base.slice(0,-1)+'ㄥ'+tone);else if(last==='ㄥ')fv.push(base.slice(0,-1)+'ㄣ'+tone);
  const ok=x=>VALIDZ.has(x);const all0=tv.concat(iv,fv);tv=tv.filter(ok);iv=iv.filter(ok);fv=fv.filter(ok);
  const out=[];[tv,iv,fv].forEach(g=>{if(g.length)out.push(one(g))});
  const r1=shuffle(tv.concat(iv,fv).filter(x=>!out.includes(x)&&x!==z)),r2=shuffle(all0.filter(x=>!out.includes(x)&&!r1.includes(x)&&x!==z));const rest=r2.concat(r1);while(out.length<n&&rest.length)out.push(rest.pop());return out.slice(0,n)}
/* ====== 國字注音題：解析標記 ====== */
function zyToks(it){const s=it.s,t=[];for(let i=0;i<s.length;i++){const ch=s[i];
  if(ch==='⟪'){const j=s.indexOf('⟫',i);t.push({t:'c',c:s.slice(i+1,j)});i=j}
  else if(ch==='«'){const j=s.indexOf('»',i);t.push({t:'z',c:s.slice(i+1,j)});i=j}
  else if(ch==='　'||ch==='\n')continue;else t.push({t:'x',c:ch})}return t}
/* 每個空格 → 它所在的那一句 */
function zyBlanks(it){const t=zyToks(it),out=[];let st=0;
  for(let i=0;i<t.length;i++){const end=t[i].t==='x'&&'。！？'.includes(t[i].c);if(end||i===t.length-1){const seg=t.slice(st,i+1);seg.forEach((k,x)=>{if(k.t!=='x')out.push({it,seg,x,mode:k.t,c:k.c})});st=i+1}}return out}
function zyStem(b,showAns){const plainS=b.seg.map(k=>k.c).join(''),zs=zyArr(plainS);const zh=zs[b.x]||ZYC[b.c]||'';
  let s='';b.seg.forEach((k,i)=>{if(i===b.x&&!showAns)s+=b.mode==='c'?'⟪'+zh+'⟫':'⟬'+k.c+'⟭';else if(i===b.x)s+='⟦'+k.c+'⟧';else s+=k.c});return {s,zh}}
function zyOpts(b,n){const {zh}=zyStem(b);if(b.mode==='c'){const o=[b.c].concat(xchars(b.c,n-1));return {opts:o,right:b.c,zh}}
  return {opts:[zh].concat(zyVariants(zh,n-1)),right:zh,zh}}

function MQ(stem,opts,ans,why,ex,keep){const o=keep?opts.map((t,i)=>({t,i})):shuffle(opts.map((t,i)=>({t,i})));return Object.assign({stem,opts:o.map(x=>x.t),ans:o.findIndex(x=>x.i===ans),why},ex||{})}

function wordsOf(c,pos){const L=pos===0?D.oka[c]:D.okb[c];return [...(L||'')].map(x=>pos===0?c+x:x+c)}
function badWords(c,pos){const L=pos===0?D.bad[c]:D.badb[c];return [...(L||'')].map(x=>pos===0?c+x:x+c)}
function wordOK(c,x,pos){pos=pos||0;return pos===0?(D.oka[c]||'').includes(x):(D.okb[c]||'').includes(x)}
const NOEMO=l=>!/^[\u{1F300}-\u{1FAFF}☀-➿]+$/u.test(l)&&!/^\[\[\w+\]\]$/.test(l);

    q=MQ((it.pic&&it.les&&it.les!=='zhu'?it.pic+' ':'')+stem,it.opts,it.ans,it.why,{pO:it.pO?1:0,pS:it.pS?1:0,ctx,tip:it.tip,say:it.say,nospk:0});break}
  case 'zy':case 'zp':{const bs=zyBlanks(it);const b=one(bs);const st=zyStem(b);const o=zyOpts(b,3);

    else if(md==='char')q=MQ(`選出「${p[0]}」拼起來的字。`,[p[1]].concat(bd),0,`「${p[0]}」合起來是「${p[1]}」。`,{pO:1});
    else if(md==='word')q=MQ(`找出可以和「${p[0]}」連成詞語的字。`,[p[1]].concat(bd),0,`「${p[0]}${p[1]}」是一個詞語。`,{pO:1});
    else q=MQ(`找出和「${p[0]}」組成方式一樣的短語。`,[p[1]].concat(bd),0,`「${p[0]}」和「${p[1]}」，組成方式一樣。`,{pO:0});break}

  case 'punct':{const sl=it.ans.map((a,k)=>({a,k})).filter(x=>x.a.length===1);if(!sl.length)return null;const x=one(sl);
    const stem=it.parts[x.k]+'（　　）'+(it.parts[x.k+1]||'');const right=x.a[0];

function addXP(n){const b=lvOf(S.xp);S.xp+=n;if(SES)SES.xp+=n;const a=lvOf(S.xp);if(a>b){sfx('lvl');toast('🎉 升級了！現在是 Lv.'+a);confetti(18)}}

function record(id,ok,el){const sk=skOfId(id)||'read';S.stat.ans++;const ss=S.stat.sk[sk]||(S.stat.sk[sk]={a:0,r:0});ss.a++;
  const m=S.mast[id]||(S.mast[id]={r:0,w:0,s:0});
  if(ok){S.stat.ok++;ss.r++;m.r++;m.s++;S.streak++;if(S.streak>S.maxStreak)S.maxStreak=S.streak;
    if(S.wrong[id]&&m.s>=2){delete S.wrong[id];S.cleared++}
    addXP(10);addCoins(1,el);if(SES){SES.ok++;SES.total++;SES.combo++}}
  else{m.w++;m.s=0;S.streak=0;S.wrong[id]={n:(S.wrong[id]?S.wrong[id].n:0)+1,t:NOW()};addXP(2);if(SES){SES.bad++;SES.total++;SES.combo=0}}
  save();checkBadges()}

    if(!moved){moved=true;ghost=el.cloneNode(true);ghost.className+=' ghost';ghost.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;margin:0;z-index:99;pointer-events:none;transform:scale(1.12) rotate(-4deg);opacity:.95`;document.body.appendChild(ghost);el.classList.add('dragging')}

      const sx=sr.left+sr.width/2-ra.left,sy=sr.top+sr.height/2-ra.top,tx=rr.left+rr.width/2-ra.left,ty=rr.top+rr.height/2-ra.top,dx=tx-sx,dy=ty-sy;
      const l=document.createElement('div');l.className='laser';l.style.cssText=`left:${sx}px;top:${sy}px;width:${Math.hypot(dx,dy)}px;transform:rotate(${Math.atan2(dy,dx)*180/Math.PI}deg)`;ar.appendChild(l);setTimeout(()=>l.remove(),420);
      }
    $$('.rock',sb).forEach(r=>r.onclick=()=>{if(over||r.classList.contains('bad')||r.classList.contains('boom'))return;
      if(r.dataset.c===right){over=true;fire(r);sfx('whack');setTimeout(()=>{r.classList.add('boom');r.querySelector('.rk').textContent='⭐';sfx('ok');popEl(r,'嘩啦！');$$('.rock',sb).forEach(x=>{if(x!==r)x.classList.add('gone')});onHit(r)},300)}
      else{wrongs++;sfx('bad');r.classList.add('bad');toast('不是這個，再找找看。');onMiss(wrongs);
        if(wrongs>=2){const rr=$$('.rock',sb).find(x=>x.dataset.c===right);if(rr)rr.classList.add('hint')}}})}
  function roundZy(id,done){const it=IT[id],b=one_(zyBlanks(it)),st=zyStem(b),o=zyOpts(b,nopt),sentP=b.seg.map(k=>k.c).join('');

      $$('.key',sb).forEach(kb=>kb.onclick=()=>{if(kb.disabled)return;const b2=chosen[cur];
        if(kb.dataset.c===b2.c){const h=holes.find(x=>+x.dataset.b===cur);h.classList.add('okh');h.classList.remove('act');h.innerHTML=`<ruby>${esc(b2.c)}<rt>${zs[b2.pi]}</rt></ruby>`;sfx('pop');popEl(h,'⭐');$('#sg'+cur,sb).classList.add('on');
          record(pid,!b2.bad,h);done++;setProg(done,total);setPB(done/total);b2.done=1;if(b2.bad)failedAny=true;

function gSpy(){const all=POOL.S8,ex=all.filter(i=>IT[i].marks.some(m=>m.extra)),lg=all.filter(i=>/^ty_/.test(i)),sh=all.filter(i=>!ex.includes(i)&&!lg.includes(i));

      function showFix(i){const m=it.marks.find(x=>x.i===i);cur=m;tilesEl.forEach(t=>t.classList.toggle('sus',+t.dataset.i===i));

        else if(m)showFix(i);

/* ====== S10 小巷圖書館：閱讀測驗 ====== */
function noteMark(i){return String.fromCharCode(0xE000+i)}
function bookHTML(b){const mk=['①','②','③','④','⑤'];
  const para=s=>{let t=s;mk.forEach((m,i)=>{t=t.split(m).join(noteMark(i))});let h=T(t);h=h.replace(/[\ue000-\ue004]/g,c=>`<button class="nt" data-n="${c.charCodeAt(0)-0xE000}" aria-label="注釋">${mk[c.charCodeAt(0)-0xE000]}</button>`);const say=t.replace(/[-]/g,'').replace(/[\n　]+/g,'，');return`<p>${h}<button class="ibtn sp pbtn" data-say="${esc(say)}" aria-label="讀這一段">🔊</button></p>`};
  const title=T(b.title)+(b.titleNote?`<button class="nt" data-n="0">①</button>`:'');
  return `<h3 class="btitle">${title}</h3>${b.paras.map(para).join('')}<div class="notes hint lt2">${b.notes.map((n,i)=>`<div>${mk[i]} ${T(n)}</div>`).join('')}</div>`}
function bookSay(b){return [b.title].concat(b.paras).join('。').replace(/[①②③④⑤]/g,'').replace(/[　]+/g,'，')}
function gLib(){S.books=S.books||{};const {sb}=stageShell('S10',4);

      setProg(i,qids.length);const q=mcq(qids[i]);q.ctx=null;q.say=(q.say||q.stem.replace(/\n/g,'，'))+optSay(q);window.CURID=qids[i];

/* ====== 排序造句共用：S6 小貓排排隊 ====== */
const CODES=['①','②','③','④','⑤','⑥'];
function orderRound(sb,ids,id,it,done){const ch=it.chunks;let placed=[],failed=false;window.TGI={id,ord:it.ord};
  /* 每次把詞打亂擺放，而且順序一定和答案不同；格子上的①②③也照擺放位置編 */
  let disp=ch.map((c,i)=>i);for(let t=0;t<40;t++){disp=shuffle(ch.map((c,i)=>i));if(ch.length<2||!disp.every((x,k)=>x===it.ord[k]))if(ch.length<3||!disp.every((x,k)=>x===k))break}
  const pos=i=>disp.indexOf(i);
  const em='🌸',cn='花朵',first='第一個';
  const instT='點下面的詞，排成一句話。',instS='先點第一個詞，再點下一個詞，排成一句話。';
  function orderStep(){
    const draw=()=>{sb.innerHTML=progBar()+inst(em,instT,instS)+(it.intro?`<div class="introq">${T(it.intro)} ${spk(it.intro)}</div>`:'')+(it.prefix?`<div class="target">${T(it.prefix)}（　　　）${it.end||'。'}</div>`:'')
      +`<div class="station lily"><div class="slotsr">${ch.map((c,i)=>`<button class="slotb ${placed[i]!=null?'full':''}" data-p="${i}"><small>第 ${i+1} 個</small>${placed[i]!=null?`<span>${T(ch[placed[i]])}</span>`:'<span class="q">？</span>'}</button>`).join('')}</div></div><div class="hint lt" style="text-align:center">點一個詞，它就放到下一個位置。點上面的詞，可以拿回來。</div><div class="sbricks tiles">${disp.map((i,k)=>`<button class="sbrick tile" data-i="${i}" ${placed.includes(i)?'disabled':''} style="--c:${GCOL[k%6]}"><b class="cd">${CODES[k]}</b>${T(ch[i])}</button>`).join('')}</div>`;
      setPB(ids.indexOf(id)/ids.length);
      $$('.tile',sb).forEach(t=>t.onclick=()=>{if(t.disabled)return;placed.push(+t.dataset.i);sfx('pop');if(placed.length===ch.length)check();else draw()});
      $$('.slotb',sb).forEach(sl=>sl.onclick=()=>{const p=+sl.dataset.p;if(placed[p]==null)return;placed=placed.slice(0,p);sfx('tick');draw()})};
    const check=()=>{draw();const ok=placed.every((x,i)=>x===it.ord[i]);
      if(ok){sfx('win');record(id,!failed,sb);say(it.std.replace(/[「」]/g,''));qDone({first:!failed,html:WHYBOX(T(it.std)+`<div class="hint">答案：${it.ord.map(i=>CODES[pos(i)]).join('')}</div>`,it.why),say:it.std.replace(/[「」]/g,''),onDone:done,delay:900})}
      else{failed=true;sfx('bad');$$('.slotb',sb).forEach((s,i)=>s.classList.add(placed[i]===it.ord[i]?'good':'wrong'));toast('順序不對，再試試看。');later(()=>{placed=[];draw()},1100)}};
    draw();autoSay((it.intro?it.intro.replace(/[。？！\s]+$/,'')+'。':'')+'點下面的詞，一個一個排成句子。點一個詞，它會放到下一個位置。點上面的詞，可以拿回來。可以排的有：'+disp.map(i=>ch[i]).join('；')+'。')}
  if(it.pre){const q=MQ(it.pre.q,it.pre.opts,it.pre.ans,it.pre.why,{pO:0});q.id=id;q.sk='sent';q.say=it.pre.q+optSay(q);
    sb.innerHTML=progBar()+'<div id="qh"></div>';setPB(ids.indexOf(id)/ids.length);
    renderMCQ($('#qh',sb),q,{retry:true,norec:true,onAnswer:first=>{if(!first)failed=true},onDone:()=>orderStep()})}
  else orderStep()}

/* ====== S11 花朵串句子：用詞語造句（跳花朵）＋ 幫句子放標點 ====== */

  const a=pickN(sn,std?3:2),b=pickN(pu,std?4:3);const ids=[];for(let k=0;k<Math.max(a.length,b.length);k++){if(a[k])ids.push(a[k]);if(b[k])ids.push(b[k])}
  const {sb}=stageShell('S11',ids.length);
  function sentRound(id,it,done){let placed=[],failed=false,hinted=false;const bank=shuffle(it.toks.concat(it.dis).map((t,i)=>({t,i})));window.TGI={id,toks:it.toks,dis:it.dis};

      setPB(ids.indexOf(id)/ids.length);

      $$('.placed',sb).forEach(b=>b.onclick=()=>{placed.splice(+b.dataset.k,1);sfx('tick');draw()});
      $('#rs',sb).onclick=()=>{placed=[];draw()};$('#ht',sb).onclick=()=>{failed=true;hinted=true;draw();toast('亮亮的花朵，是下一朵！')}};
    const check=()=>{const ok=placed.every((p,i)=>p.t===it.toks[i]);
      if(ok){draw();$$('.placed',sb).forEach(b=>b.classList.add('shine'));sfx('win');confetti(14);record(id,!failed,sb);S.sents.push({pat:it.w,text:it.std});if(S.sents.length>60)S.sents.shift();save();say(it.std);
        qDone({first:!failed,html:WHYBOX(T(it.std),`這是老師的示範句。你也可以用「${it.w}」想一個自己的句子，說給大家聽！`),say:it.std,onDone:done,delay:1000,force:false})}
      else{failed=true;sfx('bad');draw();let k=0;while(k<placed.length&&placed[k].t===it.toks[k])k++;const el=$$('.placed',sb)[k];if(el)el.classList.add('wrong');toast(`第 ${k+1} 塊不對，再試試。`);later(()=>{placed=placed.slice(0,k);draw()},1200)}};
    draw();autoSay(`用${it.w}造句。照順序點花朵。可以用的花朵有：${bank.map(b=>b.t).join('，')}。`)}
  const PNM={'，':'逗號','。':'句號','？':'問號','、':'頓號','！':'驚嘆號'};
  function punctRound(id,it,done){const MKS=it.marks||['，','。','？'],ext=MKS.length>3;const ns=it.ans.length;let k=0,failed=false;const put=Array(ns).fill(null);window.TGI={id,ans:it.ans};
    const full=()=>it.parts.map((p,i)=>p+(i<ns?put[i]||'':'')).join('');
    const draw=()=>{const body=it.parts.map((p,i)=>T(p)+(i<ns?`<span class="pstone ${put[i]?'ok':i===k?'act':''}">${put[i]?put[i]:'□'}</span>`:'')).join('');
      sb.innerHTML=progBar()+inst('✏️',ext?'選出對的標點符號，點一點。':'話還沒說完，點「，」；話說完了，點「。」；問問題，點「？」',ext?'選出對的標點符號。話還沒說完，點逗號。一樣的詞，中間點頓號。話說完了，點句號。問問題，點問號。很開心，點驚嘆號。':'話還沒說完，點逗號。話說完了，點句號。問問題，點問號。')+`<div class="station river punctw"><div class="ptxt">${body}</div></div><div class="pbtns">${MKS.map(m=>`<button class="pk" data-p="${m}"><b>${m}</b><span>${T(PNM[m])}</span></button>`).join('')}</div>`;
      setPB((ids.indexOf(id)+k/ns)/ids.length);
      const sayStep=(first)=>autoSay((first?(ext?'話還沒說完，點逗號。一樣的詞，中間點頓號。話說完了，點句號。問問題，點問號。很開心，點驚嘆號。':'話還沒說完，點逗號。話說完了，點句號。問問題，點問號。'):'')+`看第${k+1}個空格。前面是：${it.parts[k]}。${it.parts[k+1]?'後面是：'+it.parts[k+1]+'。':'後面沒有字了。'}點哪一個標點符號？`);
      sayStep(k===0&&put.every(x=>!x));
      $$('.pk',sb).forEach(b=>b.onclick=()=>{const c=b.dataset.p;
        if(it.ans[k].includes(c)){put[k]=c;sfx('ok');k++;if(k>=ns){draw2()}else draw()}
        else{failed=true;sfx('bad');b.classList.add('bad');toast(`這裡不是${PNM[c]}，再試試。`);later(()=>b.classList.remove('bad'),500)}})};
    const draw2=()=>{const body=it.parts.map((p,i)=>T(p)+(i<ns?`<span class="pstone ok">${put[i]}</span>`:'')).join('');
      sb.innerHTML=progBar()+inst('✏️','標點都放好了！','標點都放好了')+`<div class="station river punctw"><div class="ptxt">${body}</div></div>`;setPB((ids.indexOf(id)+1)/ids.length);sfx('win');
      record(id,!failed,sb);const txt=full();say(txt);
      qDone({first:!failed,html:WHYBOX(T(txt),(ext?'逗號「，」表示話還沒說完；頓號「、」用來隔開一樣的詞；句號「。」表示一句話說完了；問號「？」表示在問問題；驚嘆號「！」表示很開心、很驚訝。':'逗號「，」表示話還沒說完，要停一下；句號「。」表示一句話說完了；問號「？」表示在問問題。')),say:txt,onDone:done,delay:1000})};
    draw()}
  runRounds(sb,ids,(id,done)=>{const it=IT[id];if(it.k==='punct')punctRound(id,it,done);else sentRound(id,it,done)})}

'use strict';
function mixIds(n){const ks=Object.keys(SK);const out=[];let g=0,guard=0;
  while(out.length<n&&guard++<400){const k=ks[g%ks.length];const id=pickN(ALLIDS[k].filter(x=>!out.includes(x)&&mcq(x)),1)[0];if(id)out.push(id);g++}return shuffle(out)}
function gBoss(){quizRun({stage:'S12',ids:mixIds(NQ(10)),title:'🐭 搗蛋鼠大王',hearts:5,boss:true})}
function quizRun(o){const N=o.ids.length;if(!N){toast('目前沒有可以練習的題目');return notebook('wrong')}
  startSession(o.stage,o.hearts||0);const el=go(`${hudHTML({title:o.title,hearts:!!o.hearts,prog:'0/'+N})}<div class="stagebody" id="sb"></div>`,'stage');bindBack();const sb=$('#sb',el);
  let i=0,hint=2,coil=2;
  function next(){if(SES.max&&SES.hearts<=0)return endStage({dead:true});if(i>=N)return endStage({extra:o.boss?'<div class="card" style="max-width:26rem">🐭 搗蛋鼠大王被趕跑了，小巷又恢復平靜，小花貓開心的打呼嚕！大家為你歡呼！🎉</div>':''});
    setProg(i,N);const q=mcq(o.ids[i]);q.say=qSay(q);
    sb.innerHTML=(o.boss?`<div class="bosshead"><div class="bossface" id="bf">${i>=N-1?'😵':'🐭'}</div><div style="flex:1"><div style="font-weight:900">${T('搗蛋鼠大王')}　${T('力氣')}</div><div class="hpbar" style="max-width:none"><i id="hp" style="width:${(N-i)/N*100}%"></i></div></div></div>`:progBar())+`<div class="powers"><button class="btn p sm" id="pc" ${coil?'':'disabled'}>🛡️ 刪去 2 個×${coil}</button><button class="btn b sm" id="ph" ${hint?'':'disabled'}>🔍 提示 ×${hint}</button></div><div class="hint" id="th" style="min-height:1.6rem"></div><div id="qh"></div>`;
    if(!o.boss)setPB(i/N);
    const h=renderMCQ($('#qh',sb),q,{retry:!!o.retry,onAnswer:ok=>{if(ok){const bf=$('#bf');if(bf)bf.classList.add('hit');const hp=$('#hp');if(hp)hp.style.width=((N-i-1)/N*100)+'%';if(o.boss){popEl($('#bf'),'🐾 貓掌出擊！')}}else{loseHeart();const bf=$('#bf');if(bf)bf.classList.add('atk')}},onDone:()=>{i++;next()}});
    $('#pc').onclick=()=>{if(!coil)return;if(h.remove2()){coil--;$('#pc').textContent='🛡️ 刪去 2 個×'+coil;if(!coil)$('#pc').disabled=true;sfx('pop')}};
    $('#ph').onclick=()=>{if(!hint)return;hint--;$('#ph').textContent='🔍 提示 ×'+hint;if(!hint)$('#ph').disabled=true;$('#th').innerHTML='💡 '+T(q.tip||'仔細讀題目，把每個選項讀一讀。');sfx('pop')}}
  next()}

const TCOL=['#e04848','#1f78e0','#22a653','#9b6bff'];

  const el=go(`${hudHTML({title:'🐱 全班小貓競賽',back:true,pg:true})}<div class="page"><div class="wrap"><div class="card"><h3>分組</h3><div class="seg" id="tn">${[2,3,4].map(n=>`<button data-v="${n}" class="${CL.teams===n?'on':''}">${n} 組</button>`).join('')}</div><div class="teamcfg" style="margin-top:.6rem" id="tc"></div></div>

  <div class="hint" style="margin-bottom:.6rem">${T('玩法：各組輪流回答。答對的組別，小花貓就往前跑一格；先跑到終點、或題目結束時跑得最遠的組別獲勝！每題答完都會顯示解析，老師可以順便講解。可用鍵盤 1～4 或 A～D 選答案。答題不會計入個人學習紀錄。')}</div>
  <div class="row" style="justify-content:center"><button class="btn g big" id="st">🐱 開始比賽</button></div></div></div>`,'stage');
  bindBack(hub);
  const drawT=()=>{$('#tc',el).innerHTML=Array.from({length:CL.teams},(_,i)=>`<label class="tpill" style="background:${TCOL[i]}">🐱<input data-i="${i}" value="${esc(CL.names[i])}" maxlength="6" style="width:6rem;margin-left:.3rem"></label>`).join('');$$('#tc input',el).forEach(x=>x.oninput=()=>{CL.names[+x.dataset.i]=x.value.trim()||('第'+(+x.dataset.i+1)+'組')})};drawT();
  const seg=(id,key,cb)=>$$('#'+id+' button',el).forEach(b=>b.onclick=()=>{CL[key]=+b.dataset.v;$$('#'+id+' button',el).forEach(x=>x.classList.toggle('on',x===b));if(cb)cb()});
  seg('tn','teams',drawT);seg('qn','n');seg('qs','sec');
  $$('#ty button',el).forEach(b=>b.onclick=()=>{const k=b.dataset.k;const cnt=Object.values(CL.types).filter(Boolean).length;if(CL.types[k]&&cnt<=1){toast('至少要選一種題型');return}CL.types[k]=CL.types[k]?0:1;b.classList.toggle('on',!!CL.types[k])});
  $('#st').onclick=()=>{getAC();classPlay()}}
function classPlay(){
  const pool=shuffle([].concat(...Object.keys(CL.types).filter(k=>CL.types[k]).map(k=>ALLIDS[k]))).filter(id=>mcq(id));
  const ids=pool.slice(0,CL.n);
  const N=ids.length,T_=CL.teams,teams=Array.from({length:T_},(_,i)=>({n:CL.names[i],c:TCOL[i],s:0}));let i=0,tm=null;
  const el=go(`<div class="hud"><button class="ibtn" id="hBack">⬅️</button><div class="title-h">🐱 全班小貓競賽</div><div class="grow"></div><span class="pill" id="prog">0/${N}</span></div><div class="stagebody" id="sb" style="font-size:1.15em"></div>`,'stage');
  bindBack(()=>confirmBox('結束比賽？','目前的比分不會保留。','結束',classSetup));const sb=$('#sb',el);
  function race(){return`<div class="race">${teams.map((t,k)=>`<div class="rtrack"><span class="tn" style="color:${t.c}">${esc(t.n)}</span><div class="lane2"><span class="bal" id="bal${k}" style="left:${4+t.s/N*88}%">🐱</span></div><b style="width:2.4rem">${t.s}</b></div>`).join('')}</div>`}
  function next(){if(i>=N)return finish();setProg(i,N);const t=teams[i%T_],q=mcq(ids[i]);q.say='輪到'+t.n+'。'+qSay(q);
    sb.innerHTML=race()+`<div style="text-align:center"><span class="tpill" style="background:${t.c}">🎯 輪到：${esc(t.n)}</span></div>${CL.sec?'<div class="timerbar"><i id="tb" style="width:100%"></i></div>':''}<div id="qh"></div>`;
    const h=renderMCQ($('#qh'),q,{norec:true,tag:true,noauto:false,onAnswer:ok=>{if(tm)tm();if(ok){t.s++;const b=$('#bal'+(i%T_));if(b)b.style.left=(4+t.s/N*88)+'%';sfx('win')}},onDone:()=>{i++;if(teams.some(x=>x.s>=N))i=N;next()}});
    if(CL.sec){let left=CL.sec;const tb=$('#tb');tm=loop(dt=>{left-=dt;tb.style.width=Math.max(0,left/CL.sec*100)+'%';tb.style.background=left<CL.sec*.25?'var(--coral)':left<CL.sec*.5?'var(--sun2)':'var(--green)';if(left<=0){tm();tm=null;h.timeout()}})}}
  function finish(){const rk=teams.slice().sort((a,b)=>b.s-a.s);const top=rk[0].s;S.cls++;saveNow();checkBadges();sfx('win');confetti(40);
    sb.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:3.4rem">🏆</div><h2>比賽結束！</h2>${rk.map((t,k)=>`<div class="tpill" style="background:${t.c};margin:.2rem;font-size:${1.6-k*.1}rem">${['🥇','🥈','🥉','4️⃣'][k]} ${esc(t.n)}　${t.s} 分${t.s===top?'　👑':''}</div><br>`).join('')}<div class="row" style="justify-content:center;margin-top:.6rem"><button class="btn w" id="mp">🗺️ 回小巷地圖</button><button class="btn g big" id="ag">🔁 再比一場</button><button class="btn b" id="cf">⚙️ 重新設定</button></div></div>`;
