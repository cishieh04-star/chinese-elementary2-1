const ZYBASE=['運','動','熱','鬧','飄','哇','舞','聲','協','腳','汗','賽','步','容','往','可','最','氣','河','拔'];
const ZYCH=[...ZYBASE,...ZYBASE];
const CONFZY={ㄣ:'ㄥ',ㄥ:'ㄣ',ㄢ:'ㄤ',ㄤ:'ㄢ',ㄗ:'ㄓ',ㄓ:'ㄗ',ㄘ:'ㄔ',ㄔ:'ㄘ',ㄙ:'ㄕ',ㄕ:'ㄙ',ㄈ:'ㄏ',ㄏ:'ㄈ',ㄋ:'ㄌ',ㄌ:'ㄋ',ㄒ:'ㄒ'};
const TONES=['','ˊ','ˇ','ˋ','˙'];
function wordZy(w){return [...w].map(c=>ZYC[c]||'?')}
function perturbOne(zy){const body=zy.replace(/[ˊˇˋ˙]/g,''),tone=(zy.match(/[ˊˇˋ˙]/)||[''])[0];
  const syms=[...body];const idx=rnd(syms.length);
  if(Math.random()<.55&&CONFZY[syms[idx]]){syms[idx]=CONFZY[syms[idx]];return syms.join('')+tone}
  let nt=one(TONES.filter(t=>t!==tone));return body+nt}
function zyOptsFor(w){const parts=wordZy(w);const correct=parts.join(' ');const outs=new Set([correct]);let g=0;
  while(outs.size<4&&g++<40){const arr=parts.slice();const i=rnd(arr.length);arr[i]=perturbOne(arr[i]);const v=arr.join(' ');if(v!==correct)outs.add(v)}
  return shuffle([...outs])}

const POLY=[];

const FBANK=['運動','熱鬧','同心','協力','加油'];
const FILL=[
 {pre:'今天學校舉辦',post:'大會，大家都好興奮。',correct:'運動'},
 {pre:'我最喜歡不同的',post:'項目，尤其是賽跑。',correct:'運動'},
 {pre:'操場上加油聲此起彼落，好',post:'！',correct:'熱鬧'},

 {pre:'看到弟弟跌倒了，我趕快跑過去為他',post:'。',correct:'加油'},

/* ---- 認識字（看圖選字）---- */
const PICS=[
 {emo:'🏅',w:'獎牌'},
 {emo:'🏆',w:'獎盃'},
 {emo:'⚽',w:'足球'},
 {emo:'🚩',w:'旗子'},
 {emo:'🎈',w:'氣球'},
 {emo:'⛺',w:'帳篷'},
 {emo:'🧢',w:'帽子'},
 {emo:'👏',w:'拍手'},
 {emo:'☀️',w:'太陽'},
 {emo:'🥁',w:'大鼓'},
];
function picsOptsFor(w){const others=PICS.map(p=>p.w).filter(x=>x!==w);const picks=shuffle(others).slice(0,3);return shuffle([w,...picks])}

function buildPool(){let zG=[],wG=[],fG=[],vG=[];
  if(S.mode2==='all'||S.mode2==='z'){zG=zG.concat(ZYCH.map(c=>({t:'z',word:c,opts:zyOptsFor(c)})));zG=zG.concat(POLY.map(x=>({t:'p',...x})));zG=shuffle(zG)}
  if(S.mode2==='all'||S.mode2==='w')wG=shuffle(WRONG.map(x=>({t:'w',...x})));
  if(S.mode2==='all'||S.mode2==='f')fG=shuffle(FILL.map(x=>({t:'f',...x,opts:shuffle(FBANK)})));
  if(S.mode2==='all'||S.mode2==='v')vG=shuffle(PICS.map(x=>({t:'v',...x,opts:picsOptsFor(x.w)})));
  return [...zG,...vG,...fG,...wG]}

let Q=null,POOL=[],QI=0,EARN=0;
function startRound(){clearAll();POOL=buildPool();QI=0;EARN=0;$('#homeBtn').style.display='';chipUpd();renderQ()}
function nextQ(){QI++;if(QI>=POOL.length)roundDone();else renderQ()}

function qBanner(title,sub){return `<div id="ban"><div class="qn">第 ${QI+1} / ${POOL.length} 題</div><div class="bh">${title}</div>${sub?`<div class="bs">${sub}</div>`:''}</div>`}

function renderQ(){clearAll();Q=POOL[QI];
  if(Q.t==='w')renderWrong();else if(Q.t==='z')renderZ();else if(Q.t==='p')renderP();else if(Q.t==='v')renderV();else renderF();
  setFoot([{h:'再聽一次',c:'w',f:()=>Q._say&&Q._say()},{h:'暫停',c:'g',f:doPause}]);
}

/* ---- 改錯字 ---- */
function renderWrong(){const chs=[...Q.s];Q._step=1;
  main.innerHTML=`<div id="play">${qBanner('📖 改錯字','找找看，哪一個字寫錯了？點它！')}<div id="fld" class="lang"><div class="sen" id="sen">${chs.map((c,i)=>`<button class="sc" data-i="${i}">${c}</button>`).join('')}</div><div id="msg"></div></div></div>`;
  const say1=()=>say(`${Q.s}，找找看，哪一個字寫錯了？`);Q._say=say1;later(say1,300);
  $('#sen').querySelectorAll('.sc').forEach(b=>b.onclick=()=>{
    if(Q._step!==1)return;const i=+b.dataset.i;
    if(i===Q.wi){Q._step=2;b.classList.add('bad2');sfx('ok');say(`對，「${Q.wrong}」寫錯了，應該是哪一個字呢？`);
      showOpts(shuffle(Q.opts),Q.correct,(ok,el)=>{
        if(ok){b.textContent=Q.correct;b.classList.remove('bad2');b.classList.add('fixed');finishQ(`${chs.map((c,j)=>j===i?Q.correct:c).join('')}`)}
        else{el.classList.add('bad3');setTimeout(()=>el.classList.remove('bad3'),400);say('再想想看')}
      })}
    else{b.classList.add('bad3');setTimeout(()=>b.classList.remove('bad3'),400);say('再看看，找找哪一個字怪怪的')}
  })}

/* ---- 選注音 ---- */
function renderZ(){const u=Q.word.length===1?'字':'詞';
  main.innerHTML=`<div id="play">${qBanner('🔤 選注音',`這個${u}的注音，哪一個是對的？`)}<div id="fld" class="lang"><div class="tg">${Q.word}</div><div id="optbox"></div><div id="msg"></div></div></div>`;
  const say1=()=>say(`${Q.word}，這個${u}的注音，哪一個是對的？`);Q._say=say1;later(say1,300);
  showOpts(Q.opts,Q.opts.find(o=>o===wordZy(Q.word).join(' ')),(ok,el)=>{
    if(ok)finishQ(Q.word);else{el.classList.add('bad3');setTimeout(()=>el.classList.remove('bad3'),400);say('再想想看')}
  })}

/* ---- 一字多音 ---- */
function renderP(){main.innerHTML=`<div id="play">${qBanner('🔤 選注音','句子裡的這個字，要念哪一個音？')}<div id="fld" class="lang"><div class="sen"><span class="pl">${Q.pre}</span><span class="tg" style="font-size:min(3.6rem,10vh,16vw)">${Q.target}</span><span class="pl">${Q.post}</span></div><div id="optbox"></div><div id="msg"></div></div></div>`;

/* ---- 詞語填空 ---- */
function renderF(){main.innerHTML=`<div id="play">${qBanner('✏️ 詞語填空','哪一個詞放進去最合適？')}<div id="fld" class="lang"><div class="sen">${Q.pre}<span class="bk">▢▢</span>${Q.post}</div><div id="optbox"></div><div id="msg"></div></div></div>`;
  const say1=()=>say(`${Q.pre}○○${Q.post}`);Q._say=say1;later(say1,300);
  showOpts(Q.opts,Q.correct,(ok,el)=>{

/* ---- 認識字 ---- */
function renderV(){main.innerHTML=`<div id="play">${qBanner('🚚 認識字','看看圖片，這是什麼呢？')}<div id="fld" class="lang"><div class="tg" style="font-size:min(6rem,18vh,26vw)">${Q.emo}</div><div id="optbox"></div><div id="msg"></div></div></div>`;
  const say1=()=>say('看看圖片，這是什麼呢？');Q._say=say1;later(say1,300);
  showOpts(Q.opts,Q.w,(ok,el)=>{
    if(ok)finishQ(Q.w);else{el.classList.add('bad3');setTimeout(()=>el.classList.remove('bad3'),400);say('再想想看')}
  })}

function showOpts(opts,correct,cb){const box=document.createElement('div');box.className='zyt';box.id='optbox2';
  const old=$('#optbox');if(old)old.replaceWith(box);else $('#fld').appendChild(box);
  opts.forEach(o=>{const el=document.createElement('button');el.className='zt';el.textContent=o;box.appendChild(el);
    el.addEventListener('pointerdown',e=>{e.preventDefault();if(el.classList.contains('used')||box.classList.contains('done'))return;
      if(o===correct){box.classList.add('done');el.classList.add('okc');sfx('ok');cb(true,el)}else{el.classList.add('used');cb(false,el)}})})}

function finishQ(fullText){addPts(2);EARN+=2;flowers(18);
  const m=$('#msg');if(m){m.innerHTML='太棒了！';m.classList.add('on')}
  later(()=>say(fullText,()=>later(nextQ,500)),300)}

function roundDone(){clearAll();S.clr++;addPts(20);EARN+=20;save();sfx('win');confetti();flowers(40);
  const pz=newPrizes(),toNext=PER-(S.pts%PER);
  main.innerHTML=`<div class="res"><div class="stars">🎉 這一輪全部完成了！</div><div class="row"><span class="chip">🎖 通關 ${S.clr} 次</span><span class="chip">⭐ 這次 +${EARN} 點</span><span class="chip">🏆 共 ${S.pts} 點</span></div>${pz.length?`<div class="stars" style="font-size:2.4rem">🎁 新獎品 ${pz.join(' ')}</div>`:`<div class="tip">再 ${toNext} 點，就有新獎品 🎁</div>`}<div class="tip" id="cd">馬上開始新的一輪…</div></div>`;
  setFoot([{h:'回首頁',c:'w',f:home}]);
  later(()=>say(pz.length?'太棒了，這一輪全部完成了，你得到新獎品':'太棒了，這一輪全部完成了',()=>{
    const el=$('#cd');if(el)el.innerHTML='出發！';
    later(startRound,900)
  }),300)}
