<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>森林找水小探險：「聰明」的小熊</title>
<style>
:root{--wood:#6b4423;--wood2:#8a5a2b;--slip:#f3dfa6;--ink:#2b1d12;--seal:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#3b2616;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);touch-action:manipulation;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;height:100dvh}
header#top{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:4px 6px;background:linear-gradient(#7a4f29,#5b3a1c);border-bottom:3px solid #3b2616}
header#top.hide{display:none}
header button{font-size:clamp(13px,3.3vw,17px);padding:6px 8px;border-radius:10px;border:2px solid #3b2616;background:#f6e2b0;color:#3b2616;font-weight:800;font-family:inherit}
header button.on{background:#ffd54a}
header button.pp{background:#ffe3a8;min-width:3.2em}
#bPause{background:#ffcdd2;border-color:#8e1d1d;color:#8e1d1d}
#bGo{background:#c8f2c4;border-color:#1b5e20;color:#1b5e20}
#bGo.on{animation:pulse 1.1s infinite;box-shadow:0 0 0 3px #ffd54a}
header button:disabled{opacity:.45}
.spdbox{display:flex;align-items:center;gap:3px;background:#3b2616;border-radius:12px;padding:3px 4px}
.spdbox button{background:#cfe8ff;border-color:#1f4f8a;color:#123a66}
.meter{display:flex;flex-direction:column;align-items:center;min-width:52px;line-height:1}
.bars{display:flex;align-items:flex-end;gap:2px;height:22px}
.bars i{width:6px;border-radius:2px;background:#6b5a48}
.bars i.on{background:#7fd36b}
#spd{color:#fff;font-size:clamp(12px,3vw,14px);font-weight:900;margin-top:2px}
.maprow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.teams{flex:0 0 auto;display:flex;gap:5px}
.team{flex:1;min-width:0;white-space:nowrap;display:flex;align-items:center;gap:4px;border:3px solid #999;border-radius:12px;padding:2px 6px;background:#fff8e6;font-weight:900;font-size:clamp(14px,3.8vw,19px);opacity:.6;transition:.3s}
.team svg{height:min(6vh,38px);width:auto}
.team b{margin-left:auto;font-size:1.3em}
.team.now{opacity:1;transform:scale(1.04);box-shadow:0 0 0 4px #ffd54a}
.turn{flex:0 0 auto;text-align:center;font-size:clamp(20px,5.4vw,30px);font-weight:900;border-radius:12px;color:#fff;padding:3px}
.pickrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pickrow button.sel{background:var(--seal);box-shadow:0 0 0 4px #ffd54a}
.rank{display:flex;flex-direction:column;gap:6px;width:min(94vw,520px)}
.rank div{display:flex;align-items:center;gap:8px;background:#fff8e6;border:3px solid var(--wood);border-radius:12px;padding:4px 10px;font-size:clamp(18px,5vw,26px);font-weight:900}
.rank div svg{height:44px;width:auto}
.rank div b{margin-left:auto}
.rank div.win{background:#ffe48a;border-color:var(--seal)}
.vlist{display:flex;flex-direction:column;gap:6px;width:min(94vw,560px);max-height:58vh;overflow:auto}
.vlist div{display:flex;align-items:center;gap:6px;background:#fff8e6;border:3px solid var(--wood2);border-radius:12px;padding:6px 8px;font-weight:800;font-size:clamp(15px,4vw,19px);text-align:left}
.vlist div.sel{background:#c8f2c4;border-color:#2e7d32}
.vlist div span{flex:1}
#who{color:#fff;font-weight:800;font-size:clamp(13px,3.4vw,17px);display:flex;align-items:center;gap:2px}
#who svg{height:28px;width:auto}
#spd{color:#ffe9b0;font-size:clamp(12px,3vw,15px);font-weight:700}
#starBox{color:#ffd54a;font-weight:900;font-size:clamp(15px,4vw,20px);margin-left:auto;padding:0 4px}
main#main{flex:1 1 auto;min-height:0;position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,#f3e1b1 0 34px,#e7cd8f 34px 37px)}
.btn{font-family:inherit;font-size:clamp(17px,4.4vw,23px);font-weight:800;padding:10px 18px;border-radius:14px;background:var(--wood2);color:#fff;border:3px solid #3b2616;box-shadow:0 4px 0 #3b2616;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3b2616}
.btn.red{background:var(--seal)}
.btn.small{font-size:clamp(14px,3.6vw,18px);padding:7px 12px}
.btn.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.center{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px;text-align:center}

/* cover */
.cover{background:radial-gradient(circle at 50% 35%,#fbe9b9,#d9b26a 70%,#a87a3a)}
.title-slips{display:flex;flex-direction:row-reverse;gap:6px}
.title-slips span{writing-mode:vertical-rl;background:linear-gradient(90deg,#e2c27a,#f6e3ae 40%,#e2c27a);border:2px solid #8a5a2b;border-radius:6px;padding:10px 4px;font-size:clamp(26px,8vw,46px);font-weight:900;letter-spacing:4px;color:#4a2a10;box-shadow:0 3px 0 #8a5a2b}
.subt{font-size:clamp(18px,5vw,28px);font-weight:900;color:#7a2a10}
.namebox{display:flex;gap:8px;align-items:center;font-size:clamp(17px,4.6vw,22px);font-weight:800}
.namebox input{font-size:clamp(18px,5vw,24px);padding:6px 10px;border-radius:10px;border:3px solid var(--wood);width:9em;font-family:inherit;-webkit-user-select:text;user-select:text}
.chars{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chars button{background:#fff8e6;border:3px solid var(--wood2);border-radius:14px;padding:4px 8px;font-family:inherit;font-size:clamp(15px,4vw,19px);font-weight:800;display:flex;flex-direction:column;align-items:center}
.chars button svg{height:min(12vh,70px);width:auto}
.chars button.sel{background:#ffd54a;border-color:var(--seal);transform:scale(1.06)}

/* map */
.map{height:100%;display:flex;flex-direction:column;padding:6px;gap:6px}
.map h2{margin:0;text-align:center;font-size:clamp(18px,4.8vw,26px);color:#5a2a0a}
.tiles{flex:1 1 auto;min-height:0;display:grid;gap:7px;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr}
@media (orientation:landscape){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;display:flex;align-items:center;gap:6px;background:linear-gradient(90deg,#e0bf74,#f7e5b2 35%,#f2d996 70%,#dcb86a);border:3px solid var(--wood);border-radius:12px;padding:4px 8px;font-family:inherit;text-align:left;cursor:pointer;min-height:0;overflow:hidden}
.tile .no{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--wood);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:16px}
.tile .ic{flex:0 0 auto;height:100%;max-height:72px;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.tile .ic svg{height:100%;width:100%}
.tile .nm{font-size:clamp(15px,4.2vw,21px);font-weight:900;line-height:1.25;color:#3b2010}
.tile .stamp{position:absolute;right:6px;top:50%;transform:translateY(-50%) rotate(-12deg);width:clamp(38px,10vw,54px);height:clamp(38px,10vw,54px);border:3px solid var(--seal);border-radius:8px;color:var(--seal);font-size:clamp(22px,6vw,32px);font-weight:900;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.35);font-family:"Kaiti TC","BiauKai","DFKai-SB",serif}
.chestbar{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:clamp(15px,4vw,20px);color:#5a2a0a}
.chestbar svg{height:46px;width:auto}

/* story */
.story{height:100%;display:flex;flex-direction:column;padding:6px;gap:6px}
.stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;background:#fff8e3;border:4px solid var(--wood);border-radius:12px;overflow:hidden}
.stage svg{width:100%;height:100%}
.tbox{flex:0 0 auto;background:var(--slip);border:3px solid var(--wood);border-radius:12px;padding:8px 12px;font-size:clamp(19px,5vw,30px);font-weight:700;line-height:1.5}
.tbox span{border-radius:6px;padding:0 2px;transition:background .3s}
.tbox span.now{background:#ffd54a}
.nav{flex:0 0 auto;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.stage{position:relative}
.chhead{position:absolute;left:6px;top:6px;z-index:3;background:#c0392b;color:#fff;font-weight:900;font-size:clamp(12px,3.2vw,16px);border-radius:8px;padding:2px 8px;pointer-events:none}
.wcard{position:absolute;right:8px;top:8px;z-index:3;background:#fff8e3;border:5px solid #c0392b;border-radius:14px;padding:2px 10px;display:flex;flex-direction:column;align-items:center;line-height:1.1;box-shadow:0 3px 8px #0004}
.wcard b{font-size:clamp(46px,13vw,84px);color:#c0392b;font-family:"Kaiti TC","BiauKai","DFKai-SB","PingFang TC",serif}
.wcard small{font-size:clamp(16px,4.4vw,24px);font-weight:900;color:#1b5e20}
.zbox{color:#fff;background:#c0392b;border-radius:6px;padding:0 4px}
.zbox.strike{text-decoration:line-through;text-decoration-thickness:4px;opacity:.45}
.zans{display:inline-flex;align-items:center;gap:3px;background:#ffe48a;border:3px solid #c0392b;border-radius:10px;padding:0 6px;margin-left:4px;animation:popin .6s both;font-size:.75em;vertical-align:middle;font-family:inherit}
.zans svg{height:1.5em;width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.chips span{background:#fff;border:3px solid var(--wood2);border-radius:12px;padding:3px 12px;font-weight:900;font-size:clamp(17px,4.5vw,24px);transition:.3s}
.chips span.ans{background:#c8f2c4;border-color:#2e7d32;transform:scale(1.12)}
.chips span.dim{opacity:.35}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;width:100%;height:100%}
.sumgrid div{background:#fff8e3;border:3px solid var(--wood);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;transition:.3s}
.sumgrid div.now{background:#ffe48a;border-color:#c0392b;transform:scale(1.04)}
.sumgrid b{font-size:clamp(18px,5vw,30px);color:#8a1a10}
.sumgrid span{font-size:clamp(14px,3.8vw,20px);font-weight:800}
.scrub{flex:1 1 100%;display:flex;align-items:center;gap:6px;background:#5b3a1c;border-radius:14px;padding:4px 10px;position:relative}
.scrub .lb2{color:#ffe9b0;font-weight:900;font-size:clamp(13px,3.4vw,16px);white-space:nowrap}
.scrub input{flex:1;-webkit-appearance:none;appearance:none;height:34px;background:transparent;margin:0;touch-action:none}
.scrub input::-webkit-slider-runnable-track{height:12px;border-radius:6px;background:linear-gradient(90deg,#ffd54a var(--p),#c9a86a var(--p))}
.scrub input::-moz-range-track{height:12px;border-radius:6px;background:#c9a86a}
.scrub input::-moz-range-progress{height:12px;border-radius:6px;background:#ffd54a}
.scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;margin-top:-11px;border-radius:50%;background:#c0392b;border:4px solid #fff;box-shadow:0 2px 4px #0006}
.scrub input::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#c0392b;border:4px solid #fff}
.ticks{position:absolute;left:0;right:0;bottom:1px;pointer-events:none}
.tip{position:absolute;bottom:46px;transform:translateX(-50%);background:#fff8e3;border:3px solid #c0392b;border-radius:10px;padding:3px 8px;font-weight:900;font-size:clamp(14px,3.8vw,18px);white-space:nowrap;max-width:80vw;overflow:hidden;text-overflow:ellipsis;display:none;z-index:5;color:#3b2010}
.pg{font-weight:900;font-size:clamp(15px,4vw,19px)}
@media (orientation:landscape) and (min-width:700px){
 .story.wide{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:1fr auto}
 .story.wide .stage{grid-row:1/2;grid-column:1/2}
 .story.wide .right{grid-row:1/2;grid-column:2/3;display:flex;flex-direction:column;gap:6px;min-height:0;justify-content:center}
 .story.wide .nav{grid-column:1/3}
}
.right{display:contents}

/* learn */
.gu{background:#fffaf0;border:3px solid var(--wood);border-radius:12px;padding:6px 10px}
.gu .lb{font-size:clamp(13px,3.4vw,16px);font-weight:900;color:#fff;background:var(--wood);border-radius:8px;padding:1px 8px;display:inline-block;margin-bottom:2px}
.gu.cl .lb{background:var(--seal)}
.row{line-height:1.6;font-weight:800}
.cl .row{font-size:clamp(24px,6.6vw,40px);font-family:"Kaiti TC","BiauKai","DFKai-SB","PingFang TC",serif;letter-spacing:2px}
.md .row{font-size:clamp(18px,4.8vw,28px)}
.ck{border-radius:7px;padding:0 2px;cursor:pointer;border-bottom:3px solid transparent}
.ck.key{border-bottom:3px dotted #8a1a10}
.ck.hl{outline:3px solid #c0392b;box-shadow:0 0 0 4px #ffd54a}
.ck.whole{background:#ffe48a!important}
.note{min-height:1.6em;font-size:clamp(17px,4.6vw,25px);font-weight:900;color:#8a1a10;text-align:center}
.slips{display:flex;flex-direction:row-reverse;justify-content:center;gap:3px;height:100%;padding:6px;align-items:flex-start;overflow:hidden}
.slips div{writing-mode:vertical-rl;background:linear-gradient(90deg,#d9b466,#f6e3ae 40%,#d9b466);border:1px solid #8a5a2b;border-radius:4px;padding:6px 2px;font-size:clamp(16px,4.4vw,26px);font-weight:900;font-family:"Kaiti TC","BiauKai","DFKai-SB","PingFang TC",serif;letter-spacing:2px;color:#3b2010;transition:background .3s}
.slips div.now{background:#ffd54a}

/* quiz */
.quiz{height:100%;display:flex;flex-direction:column;padding:6px;gap:6px}
.qtop{flex:0 0 auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qtitle{font-weight:900;font-size:clamp(16px,4.2vw,21px);color:#5a2a0a}
.dots{display:flex;gap:4px;margin-left:auto}
.dots i{width:12px;height:12px;border-radius:50%;background:#d8c08a;border:2px solid var(--wood)}
.dots i.ok{background:#4caf50}.dots i.cur{background:#ffd54a}
.qcard{flex:0 1 auto;min-height:0;background:var(--slip);border:3px solid var(--wood);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.qpic{height:min(24vh,170px);max-width:100%}
.qpic svg{height:100%;width:auto;max-width:100%}
.qtext{font-size:clamp(19px,5vw,30px);font-weight:800;line-height:1.4;text-align:center}
.qtext .big{font-size:1.35em;font-family:"Kaiti TC","BiauKai","DFKai-SB","PingFang TC",serif;color:#5a1a0a}
.qtext .red{color:#fff;background:var(--seal);border-radius:6px;padding:0 4px}
.opts{flex:1 1 auto;min-height:0;display:grid;gap:7px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));align-content:center}
.opt{position:relative;display:flex;align-items:center;gap:8px;background:#fff8e6;border:3px solid var(--wood2);border-radius:14px;padding:6px 8px;font-family:inherit;font-size:clamp(17px,4.5vw,25px);font-weight:800;color:var(--ink);text-align:left;min-height:52px;cursor:pointer;box-shadow:0 3px 0 var(--wood2)}
.opt svg{height:min(10vh,70px);width:auto;flex:0 0 auto}
.opt .t{flex:1 1 auto}
.opt .ear{flex:0 0 auto;font-family:inherit;font-size:clamp(13px,3.4vw,16px);font-weight:800;padding:8px 8px;border-radius:10px;background:var(--wood2);color:#fff;border:none}
.opt.right{background:#c8f2c4;border-color:#2e7d32}
.opt.wrong{opacity:.4;animation:shake .4s}
.opt.hint,.card.hint{animation:glow 1s infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px #ffd54a}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.exbar{flex:0 0 auto;min-height:1.5em;text-align:center;font-size:clamp(17px,4.5vw,24px);font-weight:900;color:#1b5e20}

/* order */
.slots{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.slot{aspect-ratio:400/290;border:3px dashed var(--wood2);border-radius:8px;background:#fff6dc;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#b08850;overflow:hidden;position:relative}
.slot svg{width:100%;height:100%}
.slot b{position:absolute;left:2px;top:0;background:var(--seal);color:#fff;border-radius:6px;padding:0 5px;font-size:14px}
.cards{flex:1 1 auto;min-height:0;display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(min(46%,190px),1fr));align-content:center}
.card{background:#fff8e6;border:3px solid var(--wood2);border-radius:12px;padding:4px;display:flex;flex-direction:column;align-items:center;font-family:inherit;cursor:pointer;min-height:0}
.card svg{width:100%;height:auto;max-height:15vh}
.card .t{font-size:clamp(14px,3.8vw,19px);font-weight:800;color:var(--ink);text-align:center;line-height:1.3}
.card .ear{font-family:inherit;font-size:13px;font-weight:800;padding:4px 10px;border-radius:8px;background:var(--wood2);color:#fff;border:none;margin-top:2px}
.card.wrong{animation:shake .4s}

/* overlays */
.toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(28px,9vw,56px);font-weight:900;color:#fff;text-shadow:0 3px 0 #c0392b,0 0 12px #000;pointer-events:none;animation:toast 1.3s forwards;z-index:50;white-space:nowrap}
@keyframes toast{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{transform:translate(-50%,-50%) scale(1.1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.fx i{position:fixed;left:50%;top:42%;width:12px;height:12px;border-radius:50%;pointer-events:none;z-index:49;animation:boom 1.3s ease-out forwards}
.fx i.st{border-radius:0;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);width:20px;height:20px}
@keyframes boom{to{transform:translate(var(--dx),var(--dy)) rotate(260deg) scale(.4);opacity:0}}
.bigseal{width:min(40vw,180px);height:min(40vw,180px);border:8px solid var(--seal);border-radius:18px;color:var(--seal);font-size:min(26vw,120px);font-weight:900;display:flex;align-items:center;justify-content:center;font-family:"Kaiti TC","BiauKai","DFKai-SB",serif;animation:stampIn .6s cubic-bezier(.3,1.6,.5,1) both;background:rgba(255,255,255,.5);transform:rotate(-10deg)}
@keyframes stampIn{0%{transform:scale(3) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(-10deg);opacity:1}}
.donebox{font-size:clamp(20px,5.5vw,30px);font-weight:900;color:#5a2a0a}

/* svg anims */
.a-bob{animation:bob 1.4s ease-in-out infinite}
.a-prowl{animation:prowl 3s ease-in-out infinite alternate}
.a-shake{animation:shk .35s linear infinite}
.a-run{animation:run 2.4s ease-in .8s forwards}
.a-run2{animation:run 2.2s ease-in 1.2s forwards}
.a-run3{animation:run 2s ease-in 1.5s forwards}
.a-fly{animation:fly 2.6s ease-out both}
.a-inR{animation:inR 2.6s ease-out both}
.a-march{animation:march 2.8s ease-in-out infinite alternate}
.a-pop{animation:popin .8s ease-out both}
.a-wig{animation:wig 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.a-sun{animation:spin 12s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes prowl{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
@keyframes shk{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
@keyframes run{to{transform:translateX(330px)}}
@keyframes fly{from{transform:translate(-230px,-120px)}to{transform:translate(0,0)}}
@keyframes inR{from{transform:translateX(220px)}to{transform:translateX(0)}}
@keyframes march{from{transform:translateX(-25px)}to{transform:translateX(30px)}}
@keyframes popin{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes wig{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
.a-pop{transform-box:fill-box;transform-origin:center}
.still *{animation:none!important}

/* ===== 森林找水小探險 主題 ===== */
:root{--wood:#2e7d32;--wood2:#0277bd;--slip:#f7fbf2;--seal:#e65100}
header#top{background:linear-gradient(#388e3c,#1b5e20);border-bottom:4px solid #4fc3f7}
main#main{background:linear-gradient(#b3e5fc 0,#dcedc8 34%,#7cb342 60%,#2e5d1f 100%)}
main#main::before{content:none}
.btn{background:#0277bd;border-color:#01406b;box-shadow:0 4px 0 #01406b}
.btn.red{background:#e65100}
.cover{background:linear-gradient(#b3e5fc,#dcedc8)}
.cover .subt,.cover .namebox,.cover>div{color:#3e2723}
.coverpic{width:min(92vw,520px);aspect-ratio:400/250;border:5px solid #4fc3f7;border-radius:14px;overflow:hidden;box-shadow:0 0 30px #ffca2866}
.coverpic svg{width:100%;height:100%;display:block}
.covertitle{font-size:clamp(34px,10vw,60px);font-weight:900;color:#c62828;letter-spacing:6px;text-shadow:0 3px 0 #fff}
.map h2,.qtitle,.pg,.chestbar{color:#fff;text-shadow:0 2px 3px #000}
.tile{background:#f7fbf2;border:3px solid #2e7d32;box-shadow:0 4px 0 #1b5e20;border-radius:16px}
.tile .no{background:#0277bd}
.litmark{position:absolute;right:6px;bottom:4px;background:#ffca28;color:#5a3a1e;border-radius:8px;padding:0 6px;font-weight:900;font-size:12px}
.biglamp{width:min(40vw,170px);animation:stampIn .6s cubic-bezier(.3,1.6,.5,1) both;filter:drop-shadow(0 0 20px #ffca28)}
.biglamp svg{width:100%;height:auto}
.donebox{color:#fff;text-shadow:0 2px 3px #000}
.stage{background:#fffaf0;border-color:#4fc3f7}
.tbox{background:#fff7e6;border-color:#ffca28}
.slot{background:#fff7e6}
.chestbar svg{width:min(44vw,220px);height:auto;border-radius:10px;border:3px solid #2e7d32;background:#dcedc8}
.a-sinkS{animation:sinkS 2.2s ease-out both}
@keyframes sinkS{from{transform:translateY(-16px)}to{transform:none}}
.a-glowS{animation:glow2 1.2s ease-in-out infinite}
.card.txt{justify-content:center;min-height:70px}.card.txt .t{font-size:clamp(17px,4.4vw,23px);padding:6px}
.stxt{font-size:clamp(11px,2.8vw,15px);font-weight:900;color:#1d2b53;padding:2px;text-align:center}
.charcard{width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:4%;padding:4%}
.bigch{position:relative;font-size:min(30vw,150px);line-height:1;font-weight:900;color:#c62828;font-family:"Kaiti TC","BiauKai","DFKai-SB","PingFang TC",serif;background:repeating-linear-gradient(0deg,transparent 0 49.5%,#e0b0a0 49.5% 50.5%,transparent 50.5%),repeating-linear-gradient(90deg,transparent 0 49.5%,#e0b0a0 49.5% 50.5%,transparent 50.5%);border:3px solid #c62828;padding:4px;display:flex;align-items:center}
.zy{font-size:.18em;line-height:1.05;color:#1d2b53;margin-left:6px;font-family:inherit}
.chinfo{display:flex;flex-direction:column;gap:8px;font-size:clamp(16px,4.2vw,24px);font-weight:900;color:#1d2b53}
.chinfo b{display:inline-block;background:#2e7d32;color:#fff;border-radius:8px;padding:0 6px;margin-right:6px;font-size:.8em}
.zbox{background:#e65100}
.right .note,.quiz .note{background:#fff7e6;border-radius:10px;padding:2px 8px;border:2px solid #ffca28}
.a-glow{animation:glow2 1.2s ease-in-out infinite}
@keyframes glow2{50%{filter:drop-shadow(0 0 6px #ffeb3b) brightness(1.3)}}
.a-spin{animation:spin 6s linear infinite}
.a-swing{animation:swing 1.6s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.a-fall{animation:fall 3s ease-in infinite}
@keyframes fall{0%{transform:translate(0,0)}100%{transform:translate(20px,110px);opacity:0}}
.a-spark{animation:spk .5s ease-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}
@keyframes spk{from{opacity:.4;transform:scale(.7)}to{opacity:1;transform:scale(1.1)}}
.a-beat{animation:beat .7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes beat{50%{transform:scale(1.25)}}
.a-runL{animation:runL 3s ease-in 1s forwards}
@keyframes runL{to{transform:translateX(-360px)}}
.a-smoke{animation:smoke 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes smoke{0%{opacity:.2;transform:translateY(4px) scaleY(.8)}50%{opacity:.9}100%{opacity:0;transform:translateY(-10px) scaleY(1.1)}}
</style>

<script>
"use strict";
/* ================= 小工具 ================= */
const $=s=>document.querySelector(s);
const main=$('#main');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ================= 聲音效果（經過柔化，手機喇叭也不刺耳） ================= */
let AC=null,MASTER=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC}
function out(){const c=ac();if(!c)return null;if(!MASTER){const g=c.createGain();g.gain.value=.5;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=4500;let last=lp;try{const comp=c.createDynamicsCompressor();lp.connect(comp);last=comp}catch(e){}g.connect(lp);last.connect(c.destination);MASTER=g}return MASTER}
function tone(f,d,type,v,when,f2){const c=ac();if(!c)return;const o0=out();const t=c.currentTime+(when||0);const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.18,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(o0);o.start(t);o.stop(t+d+.05)}
function noise(d,v,when,fq,q){const c=ac();if(!c)return;const o0=out();const t=c.currentTime+(when||0);const len=Math.floor(c.sampleRate*d);const b=c.createBuffer(1,len,c.sampleRate);const a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=fq||1500;f.Q.value=q||1;const g=c.createGain();g.gain.value=v||.3;s.connect(f);f.connect(g);g.connect(o0);s.start(t)}
function sfx(n){
 switch(n){
  case'ok':tone(660,.15,'sine',.2);tone(990,.3,'sine',.16,.1);break;
  case'clap':for(let i=0;i<14;i++)noise(.07,.35,i*.075+Math.random()*.03,1400+Math.random()*600,.9);break;
  case'fanfare':[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.14,i*.13));break;
  case'bell':[1047,1319,1568].forEach((f,i)=>tone(f,.7,'sine',.1,i*.14));break;
  case'bad':tone(330,.2,'sine',.12);tone(262,.3,'sine',.1,.14);break;
  case'stamp':tone(110,.22,'triangle',.25,0,70);noise(.12,.35,0,300,.7);break;
  case'roar':tone(130,.9,'triangle',.2,0,80);noise(.8,.25,0,220,.6);break;
  case'run':for(let i=0;i<10;i++)noise(.05,.3,i*.12,600,2);break;
  case'whoosh':noise(.7,.35,0,800,.5);break;
  case'snap':tone(420,.1,'triangle',.18);noise(.1,.4,0,1800,1);break;
  case'pop':tone(420,.14,'sine',.18,0,880);break;
 }
}

/* ================= 語音（可暫停、可調速、自動挑好聽的聲音） ================= */
const RATES=[0.5,0.6,0.7,0.8,0.95,1.1],RNAME=['最慢','很慢','慢','普通','快','最快'];
const isAndroid=/Android/i.test(navigator.userAgent);
let rateIdx=+(store.get('br28_rate')||2);if(!(rateIdx>=0&&rateIdx<RATES.length))rateIdx=2;
let voiceOn=true,paused=false;
const synth=window.speechSynthesis||null;
const effRate=()=>RATES[rateIdx]*(isAndroid?0.9:1); // Android 的語音本來就比較快
// ---- 挑聲音：只自動挑「臺灣華語」的聲音；找不到就交給系統預設，避免怪腔調 ----
let VOICES=[],autoVoice=null,badVoices={};
let voicePref=store.get('br28_voice')||'auto';
function isTW(v){return /zh[-_]TW|zh[-_]Hant|臺灣|台灣|Taiwan/i.test(v.lang+' '+v.name)}
function isZh(v){return /^zh|cmn|Chinese|中文|國語|普通話|華語/i.test(v.lang+' '+v.name)&&!/HK|yue|粵|Cantonese|香港/i.test(v.lang+' '+v.name)}
function scoreVoice(v){let s=isTW(v)?50:isZh(v)?10:-999;const n=v.name;
 if(/Natural|Neural|Premium|Enhanced|增強|優化|高品質/i.test(n))s+=15;
 if(/Mei-?Jia|美佳|HsiaoChen|曉臻|HsiaoYu|曉雨|Yating|雅婷|Hanhan|涵涵|Google/i.test(n))s+=8;
 if(/Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Bad News|Bells|Boing|Bubbles|Cellos|Wobble|Jester|Organ|Trinoids|Whisper|Zarvox|Albert|Fred|Junior|Kathy|Ralph|Superstar|Good News/i.test(n))s-=500; // 怪聲音、玩具聲音
 return s}
function loadVoices(){if(!synth)return;try{VOICES=synth.getVoices()||[]}catch(e){VOICES=[]}
 const ok=VOICES.filter(v=>isTW(v)&&scoreVoice(v)>0&&!badVoices[v.name]).sort((a,b)=>scoreVoice(b)-scoreVoice(a));autoVoice=ok[0]||null}
if(synth){loadVoices();try{synth.addEventListener?synth.addEventListener('voiceschanged',loadVoices):(synth.onvoiceschanged=loadVoices)}catch(e){}}
function pickVoice(){if(voicePref&&voicePref!=='auto'){const v=VOICES.find(x=>x.name===voicePref&&!badVoices[x.name]);if(v)return v}return autoVoice}
function fixSay(t){
 t=String(t).replace(/（[ㄅ-ㄩˊˇˋ˙]+）/g,'').replace(/[「」『』《》]/g,'').replace(/＝/g,'就是');
 t=t.replace(/使我長/g,'使我掌').replace(/^長，/,'掌，').replace(/為子/g,'衛子').replace(/曰/g,'約').replace(/燕/g,'煙').replace(/＿+/g,'空格').replace(/為(?=女)/g,'衛').replace(/□/g,'空格').replace(/調適/g,'條適').replace(/調整/g,'條整').replace(/給予/g,'擠雨').replace(/贈予/g,'贈雨').replace(/授予/g,'授雨').replace(/予取予求/g,'魚取魚求').replace(/數月/g,'樹月').replace(/伽利略/g,'加利略').replace(/好奇/g,'號奇').replace(/為了/g,'位了').replace(/↔/g,'，相反是，').replace(/＋/g,'加').replace(/數支/g,'樹支').replace(/名將/g,'名醬').replace(/將士/g,'醬士').replace(/大將/g,'大醬').replace(/中計/g,'眾計').replace(/丞相/g,'成象').replace(/率/g,'帥').replace(/為何/g,'衛何').replace(/朝(?=[西北東南著])/g,'潮').replace(/彈(?=著?琴|起琴)/g,'談');
 if(t==='長')t='掌';
 // 去掉會被唸成怪聲音的符號
 t=t.replace(/[（(]/g,'，').replace(/[）)]/g,'，').replace(/[…⋯～~]+/g,'，').replace(/[／/→←★●○]/g,'，').replace(/[!！]{2,}/g,'！').replace(/，(?=[，。！？])/g,'').replace(/，+/g,'，').replace(/^[，\s]+|[，\s]+$/g,'');
 return t;
}
// 長句子切成短句，避免某些手機唸到一半斷掉或變調
function splitParts(t){const m=t.match(/[^，。！？；：]+[，。！？；：]?/g)||[t];const r=[];let cur='';m.forEach(p=>{if((cur+p).length>28&&cur){r.push(cur);cur=p}else cur+=p});if(cur)r.push(cur);return r}
let Q=[],qi=0,qDone=null,gen=0,fallT=null;
function speakSeq(items,done){stopSpeech();Q=items;qi=0;qDone=done||null;runItem()}
function say(text,done){speakSeq([{say:text}],done)}
function stopSpeech(){gen++;clearTimeout(fallT);Q=[];qDone=null;try{synth&&synth.cancel()}catch(e){}}
function runItem(){
 const g=gen;clearTimeout(fallT);
 if(paused)return;
 if(qi>=Q.length){const d=qDone;qDone=null;Q=[];d&&d();return}
 const it=Q[qi];
 const next=()=>{if(g!==gen)return;clearTimeout(fallT);it.end&&it.end();qi++;setTimeout(()=>{if(g===gen)runItem()},it.gap!=null?it.gap:350)};
 if(it.fn){it.fn();qi++;runItem();return}
 if(it.wait){fallT=setTimeout(()=>{if(g===gen){qi++;runItem()}},it.wait);return}
 it.start&&it.start();
 const txt=fixSay(it.say);
 if(!synth||!txt){fallT=setTimeout(next,600);return}
 const parts=splitParts(txt);let pi=0,retry=0;
 const speakPart=()=>{
  if(g!==gen)return;
  if(pi>=parts.length){next();return}
  let fin=false;const part=parts[pi];
  const done=()=>{if(fin||g!==gen)return;fin=true;clearTimeout(fallT);pi++;retry=0;setTimeout(speakPart,40)};
  try{
   const u=new SpeechSynthesisUtterance(part);u.lang='zh-TW';const v=pickVoice();if(v)u.voice=v;
   u.rate=effRate();u.pitch=1;u.volume=1;
   u.onend=done;
   u.onerror=e=>{if(fin||g!==gen)return;const er=e&&e.error;
    if(u.voice&&retry<1&&/voice|synthesis|language|unavailable/.test(er||'')){fin=true;clearTimeout(fallT);badVoices[u.voice.name]=1;loadVoices();retry++;setTimeout(speakPart,60);return}
    done()};
   u.onstart=()=>{if(fin||g!==gen)return;clearTimeout(fallT);fallT=setTimeout(done,part.length*700/effRate()+5000)};
   try{synth.resume&&synth.resume()}catch(e){}
   synth.speak(u);
   fallT=setTimeout(done,part.length*450/effRate()+3000);
  }catch(e){fallT=setTimeout(done,1200)}
 };
 setTimeout(speakPart,70); // 先停一下再唸，iPhone 才不會吃掉第一句
}

function scrubHTML(n,cur,unit){return `<div class="scrub"><span class="lb2">章節</span><input type="range" id="scrub" min="1" max="${n}" step="1" value="${cur+1}" style="--p:${n>1?cur/(n-1)*100:100}%" aria-label="章節拉把"><span class="lb2" id="scrubN">第 ${cur+1} / ${n} ${unit}</span><div class="tip" id="scrubTip"></div></div>`}
function bindScrub(n,unit,titles,go){
 const r=$('#scrub'),tip=$('#scrubTip'),lab=$('#scrubN');if(!r)return;
 const show=()=>{const v=+r.value;r.style.setProperty('--p',(n>1?(v-1)/(n-1)*100:100)+'%');lab.textContent=`第 ${v} / ${n} ${unit}`;
  tip.textContent=`第 ${v} ${unit}：${titles[v-1]}`;tip.style.display='block';
  const rc=r.getBoundingClientRect(),pc=r.parentNode.getBoundingClientRect();tip.style.left=(rc.left-pc.left+17+(rc.width-34)*(n>1?(v-1)/(n-1):0))+'px'};
 r.addEventListener('input',()=>{show();sfx('pop')});
 const commit=()=>{tip.style.display='none';go(+r.value-1)};
 r.addEventListener('change',commit);
}

function quiz(id,title,qs,help){
 let i=0,busy=false,wrongs=0,firstLevelEnter=true;
 function show(){
  stopSpeech();busy=false;wrongs=0;const q=qs[i];
  main.innerHTML=`<div class="quiz"><div class="qtop"><span class="qtitle">${title}</span><button class="btn small" id="qAgain">再聽題目</button><div class="dots">${qs.map((_,k)=>`<i class="${k<i?'ok':k===i?'cur':''}"></i>`).join('')}</div></div>
  <div class="qcard">${q.pic?`<div class="qpic">${q.pic}</div>`:''}<div class="qtext">${q.q}</div></div>
  <div class="opts">${q.opts.map((o,k)=>`<div class="opt" role="button" data-k="${k}">${o.pic||''}<span class="t">${o.t}</span><button class="ear" data-e="${k}">聽</button></div>`).join('')}</div>
  <div class="exbar" id="ex"></div></div>`;
  const opts=main.querySelectorAll('.opt');
  $('#qAgain').onclick=()=>readQ();
  main.querySelectorAll('.ear').forEach(b=>b.onclick=e=>{e.stopPropagation();const k=+b.dataset.e;stopSpeech();say(`第${k+1}個，${q.opts[k].t}`)});
  opts.forEach(o=>o.onclick=()=>pickOpt(+o.dataset.k,o,opts));
  function readQ(){
   const items=[];
   if(firstLevelEnter&&help){items.push({say:help});}
   items.push({say:q.say||q.q.replace(/<[^>]+>/g,'')});
   q.opts.forEach((o,k)=>items.push({say:`第${k+1}個，${o.t}`,start:()=>opts[k].style.outline='3px solid #ffd54a',end:()=>opts[k].style.outline=''}));
   speakSeq(items);
  }
  if(firstLevelEnter&&help&&!voiceOn){firstLevelEnter=false}
  readQ();firstLevelEnter=false;
 }
 function pickOpt(k,el,opts){
  if(busy||el.classList.contains('wrong'))return;
  const q=qs[i];
  if(k===q.a){
   busy=true;stopSpeech();el.classList.add('right');opts.forEach(o=>o.style.outline='');
   if(wrongs===0)addStar(1);celebrate();
   $('#ex').textContent=q.ex;
   setTimeout(()=>speakSeq([{say:q.ex},{wait:500}],()=>{i++;if(i<qs.length)show();else finishLevel(id)}),700);
  }else{
   wrongs++;sfx('bad');el.classList.add('wrong');busy=true;setTimeout(()=>busy=false,600);
   stopSpeech();
   if(wrongs>=2){opts[q.a].classList.add('hint');say('看看發亮的那一個。')}else say('不是這個，再試一次。');
  }
 }
 show();
}

function orderGame(){
 const ROUNDS=[
  {nm:'「聰明」的小熊的故事',c:[['crow2','烏鴉想出好方法'],['travel','小熊去旅行'],['hot','又熱又渴'],['stones','放進小石頭'],['horse','小馬好奇的問'],['why','為什麼不拿起瓶子？']]},
  {nm:'句子排排看（一）',c:[[null,'口渴的'],[null,'烏鴉為了要喝'],[null,'瓶子裡的水'],[null,'想出一個'],[null,'喝到水的好方法']]},
  {nm:'句子排排看（二）',c:[[null,'森林裡的'],[null,'動物們'],[null,'知道了'],[null,'都說烏鴉'],[null,'真是聰明']]},
  {nm:'句子排排看（三）',c:[[null,'小熊馬上找了'],[null,'許多小石頭'],[null,'放進瓶子裡'],[null,'開心的看著'],[null,'瓶裡的水越升越高']]},
  {nm:'句子排排看（四）',c:[[null,'難道'],[null,'你忘了'],[null,'烏鴉'],[null,'喝水'],[null,'的故事']]},
 ];
 let r=0;
 function round(){
  stopSpeech();const R=ROUNDS[r];let step=0,busy=false,wrongs=0;
  const order=shuffle(R.c.map((_,k)=>k));
  main.innerHTML=`<div class="quiz"><div class="qtop"><span class="qtitle">故事排排看：${R.nm}（第 ${r+1} / ${ROUNDS.length} 回）</span><button class="btn small" id="oAgain">再聽說明</button></div>
  <div class="slots" style="grid-template-columns:repeat(${R.c.length},1fr)">${R.c.map((_,k)=>`<div class="slot" data-s="${k}">${k+1}</div>`).join('')}</div>
  <div class="qtext" id="oQ" style="font-size:clamp(17px,4.6vw,24px)">第 1 個發生的是哪一張？</div>
  <div class="cards">${order.map(k=>`<div class="card ${R.c[k][0]?'':'txt'}" role="button" data-k="${k}">${R.c[k][0]?svg(SC[R.c[k][0]](),'still'):''}<span class="t">${R.c[k][1]}</span><button class="ear" data-e="${k}">聽</button></div>`).join('')}</div></div>`;
  const ask=()=>{const isTxt=!R.c[0][0];const t=step===0?(isTxt?`把句子排好。第一個是哪一張？請點一下。`:`${R.nm}，第一個發生的是哪一張？請點一下。`):`接下來，第${step+1}個是哪一張？`;$('#oQ').textContent=`第 ${step+1} 個是哪一張？`;
   const items=[{say:t}];if(step===0)order.forEach(k=>items.push({say:R.c[k][1],start:()=>{const c=main.querySelector(`.card[data-k="${k}"]`);c&&(c.style.outline='3px solid #ffd54a')},end:()=>{const c=main.querySelector(`.card[data-k="${k}"]`);c&&(c.style.outline='')}}));speakSeq(items)};
  $('#oAgain').onclick=ask;
  main.querySelectorAll('.card .ear').forEach(b=>b.onclick=e=>{e.stopPropagation();stopSpeech();say(R.c[+b.dataset.e][1])});
  main.querySelectorAll('.card').forEach(c=>c.onclick=()=>{
   if(busy)return;const k=+c.dataset.k;
   if(k===step){
    busy=true;stopSpeech();sfx('ok');if(wrongs===0)addStar(1);wrongs=0;
    const sl=main.querySelector(`.slot[data-s="${step}"]`);sl.innerHTML=(R.c[k][0]?svg(SC[R.c[k][0]](),'still'):`<span class="stxt">${R.c[k][1]}</span>`)+`<b>${step+1}</b>`;sl.style.borderStyle='solid';
    c.style.visibility='hidden';step++;
    speakSeq([{say:R.c[k][1]}],()=>{busy=false;if(step<R.c.length)ask();else{celebrate();speakSeq([{say:R.c[0][0]?'排好了！整個故事都對了！':'排好了！'+R.c.map(x=>x[1]).join('')},{wait:600}],()=>{r++;if(r<ROUNDS.length)round();else finishLevel('f')})}});
   }else{
    wrongs++;sfx('bad');c.classList.remove('wrong');void c.offsetWidth;c.classList.add('wrong');busy=true;setTimeout(()=>busy=false,600);
    stopSpeech();say('還沒輪到它喔，再想想看。');
    if(wrongs>=2){const rc=main.querySelector(`.card[data-k="${step}"]`);rc&&rc.classList.add("hint")}
   }
  });

}

   else{o.classList.add('wrong');sfx('bad');opts[q.a].classList.add('right');$('#ex').style.color='#8a1a10';$('#ex').textContent=`答案是：${q.opts[q.a].t}`;

  });
  const items=[{say:`輪到${T.nm}。`},{say:q.say||q.q.replace(/<[^>]+>/g,'')}];
  q.opts.forEach((o,k)=>items.push({say:`第${k+1}個，${o.t}`,start:()=>opts[k].style.outline='3px solid #ffd54a',end:()=>opts[k].style.outline=''}));
  sfx('bell');speakSeq(items);
 }
 function nextQ(){turn++;if(turn<pool.length)show();else result()}
 function result(){
  stopSpeech();const order=score.map((s,k)=>({s,k})).sort((a,b)=>b.s-a.s);const top=order[0].s;const winners=order.filter(x=>x.s===top).map(x=>TEAMS[x.k].nm);
  main.innerHTML=`<div class="center"><div class="subt">比賽結果</div><div class="rank">${order.map((x,i)=>`<div class="${x.s===top?'win':''}">${i+1}.　${TEAMS[x.k].ic()}${TEAMS[x.k].nm}<b>${x.s} 分</b></div>`).join('')}</div>
  <div class="donebox">${winners.length>1?winners.join('、')+' 一樣厲害，平手！':winners[0]+' 獲勝！'}</div>
  <div class="pickrow"><button class="btn small" id="tAgain">再比一次</button><button class="btn small" id="tMap">回地圖</button></div></div>`;
  $('#tAgain').onclick=()=>teamSetup();$('#tMap').onclick=()=>showMap();
  sfx('fanfare');setTimeout(celebrate,300);setTimeout(celebrate,1200);
  say(winners.length>1?`${winners.join('和')}一樣厲害，平手！大家都很棒！`:`恭喜${winners[0]}獲勝！大家都很棒！`);
 }
 show();
}

/* ================= 老師設定：換聲音 ================= */
function voiceSetup(){
 stopSpeech();loadVoices();
 const list=VOICES.filter(v=>isZh(v)&&scoreVoice(v)>-100).sort((a,b)=>scoreVoice(b)-scoreVoice(a));
 const cur=voicePref;
 const row=(id,nm,sub)=>`<div class="${cur===id?'sel':''}"><span>${nm}${sub?`<br><small style="font-weight:600;color:#6b4423">${sub}</small>`:''}</span><button class="btn small" data-t="${id}">試聽</button><button class="btn small red" data-u="${id}">用這個</button></div>`;
 main.innerHTML=`<div class="center"><div class="subt">老師設定：換聲音</div>
 <div style="font-weight:800;font-size:clamp(14px,3.8vw,18px);max-width:560px">建議用「自動」：會挑這台裝置上最好聽的臺灣國語聲音。如果聽起來怪怪的，可以試聽別的聲音，按「用這個」。</div>
 <div class="vlist">${row('auto','自動（建議）',autoVoice?'目前會用：'+autoVoice.name:'使用裝置預設的聲音')}${list.map(v=>row(v.name,v.name,v.lang+(isTW(v)?'・臺灣':''))).join('')}</div>
 ${list.length?'':'<div style="font-weight:800">這台裝置沒有提供其他聲音，會使用系統預設的聲音。</div>'}
 <button class="btn" id="vBack">回地圖</button></div>`;
 const test=id=>{const old=voicePref;voicePref=id;say('口渴的烏鴉，想出一個喝到水的好方法。',()=>{});setTimeout(()=>{voicePref=old},50)};
 main.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const old=voicePref;voicePref=b.dataset.t;stopSpeech();Q=[{say:'口渴的烏鴉，想出一個喝到水的好方法。'}];qi=0;qDone=()=>{};const g0=gen;runItem();setTimeout(()=>{voicePref=old},300)});
 main.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{voicePref=b.dataset.u;store.set('br28_voice',voicePref);sfx('ok');say('好，以後就用這個聲音。');voiceSetup()});
 $('#vBack').onclick=()=>showMap();
}
/* ================= 封面 ================= */
function cover(){
 $('#top').classList.add('hide');
 main.innerHTML=`<div class="center cover"><div class="coverpic">${svg(SC.rise())}</div><div class="covertitle">「聰明」的小熊</div>
 <div class="subt">森林找水小探險</div><button class="btn red pulse" id="cStart" style="font-size:clamp(22px,6vw,32px)">點一下開始</button></div>`;
 $('#cStart').onclick=()=>{ac();sfx('bell');setup()};
}
function setup(){
 main.innerHTML=`<div class="center cover">
 <div class="subt">森林找水小探險</div>
 <div class="namebox">你的名字：<input id="nm" maxlength="8" placeholder="寫名字" value="${player.name}"></div>
 <div style="font-weight:900;font-size:clamp(17px,4.6vw,22px)">選一個好朋友陪你：</div>
 <div class="chars">${CHARS.map(c=>`<button data-c="${c.id}" class="${player.ch===c.id?'sel':''}">${c.ic()}<span>${c.nm}</span></button>`).join('')}</div>
 <button class="btn red pulse" id="cGo" style="font-size:clamp(22px,6vw,30px)">出發！</button></div>`;
 main.querySelectorAll('.chars button').forEach(b=>b.onclick=()=>{player.ch=b.dataset.c;main.querySelectorAll('.chars button').forEach(x=>x.classList.toggle('sel',x===b));sfx('pop');stopSpeech();say(CHARS.find(c=>c.id===player.ch).nm)});
 $('#cGo').onclick=()=>{
  player.name=($('#nm').value||'').trim();
  if(/Line\//i.test(navigator.userAgent)){
   const u=new URL(location.href);u.searchParams.set('openExternalBrowser','1');u.searchParams.set('n',player.name);u.searchParams.set('c',player.ch);location.href=u.toString();return;
  }
  start();
 };
 say('歡迎來到森林找水小探險！請寫下你的名字，選一個好朋友，再按紅色的出發。');
}
function start(){
 loadDone();
 const c=CHARS.find(x=>x.id===player.ch)||CHARS[0];
 $('#who').innerHTML=c.ic()+`<span>${player.name||c.nm}</span>`;
 stars=0;addStar(0);
 showMap();
}
(function init(){
 const u=new URLSearchParams(location.search);
 if(u.get('openExternalBrowser')){player.name=u.get('n')||'';player.ch=u.get('c')||'fox';start();}
 else cover();
})();
</script>
