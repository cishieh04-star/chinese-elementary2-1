<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小小運動場大賽・國語二年級第四課〈運動會〉（第 18 回）</title>
<style>:root{
  --sky1:#7fd6ff;--sky2:#c9f0ff;--grass:#7ddc6a;--grass2:#4fbf4a;--sun:#ffd84d;--sun2:#ffb703;
  --coral:#ff6b6b;--coral2:#e04848;--blue:#3b9cff;--blue2:#1f78e0;--green:#3ecf72;--green2:#22a653;
  --purple:#9b6bff;--purple2:#7647e0;--ink:#2b3a55;--ink2:#5a6b8c;--card:#ffffff;--line:#d8e6f7;
  --bg:#e8f6ff;--shadow:0 .35rem 0 rgba(30,60,110,.18);--fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(clamp(14px,calc(.6vw + 1.2vh + 6px),32px)*var(--fs));height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;font-weight:700;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:.22rem solid var(--purple);outline-offset:.15rem}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:scr .25s ease}
@keyframes scr{from{opacity:0;transform:translateY(.6rem)}to{opacity:1;transform:none}}
ruby{ruby-position:over}
rt{font-size:.46em;font-weight:700;color:#d0301f;letter-spacing:0;user-select:none}
.zy-off rt{display:none}
.zy-on ruby{ruby-align:center}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:3rem;padding:.55rem 1.3rem;border-radius:1.1rem;
  background:var(--sun);color:#5a3b00;font-size:1.15rem;font-weight:900;box-shadow:0 .3rem 0 var(--sun2);position:relative;top:0;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(.28rem);box-shadow:0 .02rem 0 var(--sun2)}
.btn.g{background:var(--green);color:#fff;box-shadow:0 .3rem 0 var(--green2)}
.btn.g:active:not(:disabled){box-shadow:0 .02rem 0 var(--green2)}
.btn.b{background:var(--blue);color:#fff;box-shadow:0 .3rem 0 var(--blue2)}
.btn.b:active:not(:disabled){box-shadow:0 .02rem 0 var(--blue2)}
.btn.r{background:var(--coral);color:#fff;box-shadow:0 .3rem 0 var(--coral2)}
.btn.r:active:not(:disabled){box-shadow:0 .02rem 0 var(--coral2)}
.btn.p{background:var(--purple);color:#fff;box-shadow:0 .3rem 0 var(--purple2)}
.btn.w{background:#fff;color:var(--ink);box-shadow:0 .3rem 0 #b9cde6}
.btn.w:active:not(:disabled){box-shadow:0 .02rem 0 #b9cde6}
.btn.big{font-size:1.3rem;min-height:3.6rem;padding:.6rem 1.3rem;border-radius:1.3rem}
.btn.sm{min-height:2.4rem;padding:.3rem .8rem;font-size:.95rem;border-radius:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ibtn{width:2.8rem;height:2.8rem;border-radius:50%;background:#fff;box-shadow:0 .22rem 0 #b9cde6;font-size:1.3rem;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ibtn:active{transform:translateY(.2rem);box-shadow:none}
.ibtn.on{background:var(--sun);box-shadow:0 .22rem 0 var(--sun2)}
/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;gap:.5rem;padding:.55rem .7rem;flex:none;flex-wrap:wrap;background:linear-gradient(#fff,#eaf6ff);border-bottom:.2rem solid var(--line);z-index:5}
.hud .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .75rem;border-radius:999px;background:#fff;border:.15rem solid var(--line);font-size:1rem;font-weight:900;white-space:nowrap}
.pill.lv{background:var(--purple);color:#fff;border-color:var(--purple2)}
.pill.coin{background:#fff6cc;border-color:#ffe07a}
.pill.net{background:#dcfbe6;border-color:#9fe6b6}
.xpbar{width:5.5rem;height:.7rem;border-radius:99px;background:rgba(255,255,255,.35);overflow:hidden;display:inline-block}
.xpbar i{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .5s}
.hearts{display:inline-flex;gap:.15rem;font-size:1.3rem}
.hearts .lost{filter:grayscale(1);opacity:.35}
.title-h{font-size:1.25rem;font-weight:900;display:flex;align-items:center;gap:.4rem}
/* ---------- title screen ---------- */
.title-scr{background:linear-gradient(#7fd6ff 0%,#c9f0ff 55%,#bff3c0 55%,#7ddc6a 100%);align-items:center;text-align:center;padding:1rem;overflow:auto}
.title-scr>div{position:relative;z-index:1}
.title-scr .logo{font-size:min(3.4rem,11vw);font-weight:900;color:#fff;text-shadow:0 .25rem 0 var(--blue2),0 .5rem 0 rgba(0,0,0,.12);line-height:1.15;letter-spacing:.05em}
.title-scr .sub{display:inline-block;margin:.4rem 0 .8rem;padding:.3rem 1rem;background:var(--sun);border-radius:99px;color:#5a3b00;font-weight:900;box-shadow:0 .2rem 0 var(--sun2)}
.title-card{background:#fff;border-radius:1.6rem;padding:1rem 1.2rem;box-shadow:var(--shadow);max-width:34rem;width:100%}
.avatars{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:.5rem 0}
.avatars button{width:3.1rem;height:3.1rem;border-radius:1rem;font-size:1.8rem;background:#f0f7ff;border:.2rem solid transparent}
.avatars button.sel{border-color:var(--purple);background:#efe6ff;transform:scale(1.1)}
.nameinp{width:100%;font:inherit;font-size:1.3rem;padding:.6rem 1rem;border-radius:1rem;border:.2rem solid var(--line);text-align:center;font-weight:800;color:var(--ink);background:#fff;user-select:text}
.nameinp:focus{outline:none;border-color:var(--blue)}
.cloud{pointer-events:none;z-index:0;position:absolute;font-size:3rem;opacity:.9;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
/* ---------- hub map ---------- */
.hub{background:linear-gradient(#8fdcff 0%,#d9f4ff 38%,#c4f2b8 38%,#8be07a 100%)}
.mapwrap{flex:1;position:relative;overflow:auto;min-height:0}
.map{position:relative;width:100%;height:100%;min-height:56rem;min-width:min(100%,60rem);margin:0 auto}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.deco{position:absolute;font-size:2.4rem;pointer-events:none;opacity:.95}
.node{background:none;border:0;padding:0;font:inherit;color:inherit;position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.15rem;width:6.9rem;z-index:2}
.node .orb{width:4.6rem;height:4.6rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.4rem;
  background:radial-gradient(circle at 30% 25%,#fff8c8,var(--sun) 55%,var(--sun2));border:.28rem solid #fff;box-shadow:0 .4rem 0 rgba(30,60,110,.25);transition:transform .15s}
.node:hover .orb{transform:scale(1.08)}
.node:active .orb{transform:scale(.95)}
.node.cur .orb{animation:bob 1.1s ease-in-out infinite;box-shadow:0 0 0 .35rem rgba(255,255,255,.7),0 .4rem 0 rgba(30,60,110,.25)}
.node.lock .orb{background:radial-gradient(circle at 30% 25%,#eee,#bbb 60%,#999);filter:grayscale(.4)}
.node.boss .orb{width:5.6rem;height:5.6rem;font-size:3rem;background:radial-gradient(circle at 30% 25%,#ffd0d0,var(--coral) 60%,var(--coral2))}
.node .nm{background:#fff;border-radius:.8rem;padding:.1rem .6rem;font-size:.95rem;font-weight:900;box-shadow:0 .15rem 0 rgba(30,60,110,.18);text-align:center;line-height:1.25}
.node .sk{font-size:.72rem;color:var(--ink2);font-weight:800;text-align:center;line-height:1.1;background:rgba(255,255,255,.8);border-radius:.5rem;padding:0 .3rem}
.stars{font-size:1.05rem;letter-spacing:.05rem;filter:drop-shadow(0 .08rem 0 rgba(0,0,0,.2))}
.stars .off{filter:grayscale(1);opacity:.35}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.45rem)}}
.netty{position:absolute;z-index:3;display:flex;align-items:flex-end;gap:.4rem;pointer-events:none}
.netty .bubble{background:#fff;border-radius:1rem;padding:.45rem .8rem;font-size:.95rem;max-width:15rem;box-shadow:var(--shadow);position:relative;pointer-events:auto}
.netty svg{width:4.6rem;height:4.6rem;animation:bob 2.2s ease-in-out infinite;flex:none}
.dock{display:flex;gap:.5rem;padding:.55rem .6rem;justify-content:center;flex-wrap:wrap;flex:none;background:linear-gradient(#fff,#eaf6ff);border-top:.2rem solid var(--line)}
.dock .btn{flex:1;max-width:10rem;min-width:5.5rem;padding:.4rem .5rem;font-size:1rem}
/* ---------- generic page ---------- */
.page{flex:1;overflow:auto;padding:.9rem;min-height:0}
.wrap{max-width:60rem;margin:0 auto;width:100%}
.card{background:var(--card);border-radius:1.2rem;padding:.9rem 1rem;box-shadow:var(--shadow);margin-bottom:.8rem}
.card h3{margin:.1rem 0 .4rem;font-size:1.15rem}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.7rem}
.tab{padding:.45rem 1rem;border-radius:99px;background:#fff;border:.15rem solid var(--line);font-weight:900;font-size:1rem}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue2)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.sw{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.55rem .2rem;border-bottom:.1rem dashed var(--line)}
.sw:last-child{border:0}
.sw small{display:block;font-size:.8rem;color:var(--ink2);font-weight:700}
.toggle{width:3.6rem;height:2rem;border-radius:99px;background:#c9d6e8;position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:.2rem;left:.2rem;width:1.6rem;height:1.6rem;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 .1rem .2rem rgba(0,0,0,.25)}
.toggle.on{background:var(--green)}
.toggle.on::after{left:1.8rem}
.seg{display:inline-flex;border-radius:.9rem;overflow:hidden;border:.15rem solid var(--line)}
.seg button{padding:.35rem .8rem;background:#fff;font-weight:900}
.seg button.on{background:var(--blue);color:#fff}
.hint{font-size:.9rem;color:var(--ink2);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{padding:.25rem .7rem;border-radius:99px;background:#eef5ff;border:.12rem solid var(--line);font-size:.95rem;font-weight:800}
/* ---------- stage screen ---------- */
.stage{background:linear-gradient(#e9f7ff,#f6fff0)}
.stagebody{flex:1;position:relative;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:.7rem .8rem .9rem;gap:.6rem;align-items:stretch}
.inst{background:#fff;border-radius:1rem;padding:.4rem .8rem;font-size:1rem;box-shadow:0 .2rem 0 rgba(30,60,110,.12);display:flex;align-items:center;gap:.5rem;flex:none}
.inst .em{font-size:1.6rem}
.prog{height:.8rem;background:#d6e6f7;border-radius:99px;overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#9be564);border-radius:99px;transition:width .4s}
/* MCQ */
.qcard{background:#fff;border-radius:1.3rem;padding:1rem 1.1rem;box-shadow:var(--shadow);font-size:1.35rem;line-height:2.3;display:flex;gap:.6rem;align-items:flex-start}
.qcard .qt{flex:1;min-width:0;overflow-wrap:anywhere}
.qcard .sp{flex:none}
.opts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.7rem}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{background:#fff;border-radius:1.1rem;padding:.7rem .9rem;text-align:left;font-size:1.2rem;line-height:1.9;box-shadow:0 .3rem 0 #b9cde6;border:.18rem solid transparent;display:flex;gap:.6rem;align-items:center;min-height:3.4rem;transition:transform .08s}
.opt:active:not(:disabled){transform:translateY(.25rem);box-shadow:0 .03rem 0 #b9cde6}
.opt .k{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:900}
.opt.ok{background:#d9f9e3;border-color:var(--green);box-shadow:0 .3rem 0 var(--green2)}
.opt.ok .k{background:var(--green)}
.opt.bad{background:#ffe0e0;border-color:var(--coral);box-shadow:0 .3rem 0 var(--coral2);animation:shake .35s}
.opt.bad .k{background:var(--coral)}
.opt.gone{opacity:.25;pointer-events:none}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-.4rem)}75%{transform:translateX(.4rem)}}
@media(max-width:34rem){.opts{grid-template-columns:minmax(0,1fr)}}
.skilltag{display:inline-block;font-size:.8rem;background:#efe6ff;color:var(--purple2);border-radius:99px;padding:.05rem .6rem;font-weight:900;margin-right:.4rem;vertical-align:middle}
.mark{background:#fff0a8;border-radius:.4rem;padding:0 .15rem}
.blank{display:inline-block;min-width:2.4em;border-bottom:.18rem solid var(--ink);text-align:center;color:var(--purple2)}
/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(20,40,80,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:46rem;background:#fff;border-radius:1.6rem 1.6rem 0 0;padding:1rem 1.2rem 1.1rem;box-shadow:0 -.4rem 1.2rem rgba(0,0,0,.2);animation:up .28s cubic-bezier(.2,1.3,.5,1);max-height:80%;overflow:auto}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet .hd{display:flex;align-items:center;gap:.6rem;font-size:1.5rem;font-weight:900;margin-bottom:.3rem}
.sheet.ok .hd{color:var(--green2)}
.sheet.bad .hd{color:var(--coral2)}
.sheet .body{font-size:1.15rem;line-height:2.2;margin:.2rem 0 .7rem}
.sheet .ans{background:#f0f7ff;border-radius:.9rem;padding:.4rem .8rem;margin:.3rem 0;font-size:1.1rem;line-height:2.1}
.modalbg{position:fixed;inset:0;background:rgba(20,40,80,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:1rem;animation:fade .2s}
.modal{background:#fff;border-radius:1.5rem;padding:1.1rem 1.3rem;max-width:30rem;width:100%;box-shadow:var(--shadow);text-align:center;max-height:92%;overflow:auto}
.modal h2{margin:.2rem 0 .4rem;font-size:1.5rem}
.modal .row{justify-content:center;margin-top:.8rem}
.toast{position:fixed;left:50%;top:5rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.5rem 1.1rem;border-radius:99px;font-size:1.05rem;z-index:70;animation:toast 2.2s forwards;pointer-events:none;text-align:center;max-width:90vw}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-.8rem)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.pop{position:fixed;z-index:65;pointer-events:none;font-weight:900;font-size:1.6rem;color:var(--sun2);text-shadow:0 .1rem 0 #fff,0 0 .3rem #fff;animation:popup .9s forwards}
@keyframes popup{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-3rem) scale(1.3)}}
.conf{position:fixed;top:-2rem;font-size:1.8rem;z-index:80;pointer-events:none;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
/* result */
.result{align-items:center;justify-content:center;text-align:center;padding:1rem;background:linear-gradient(#fff7d1,#e6f7ff);overflow:auto}
.result>.big{font-size:3.2rem;margin:.2rem 0}
.result .stars{font-size:3rem}
.result .rows{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin:.6rem 0}
.result .rows .pill{font-size:1.15rem;padding:.4rem 1rem}
/* ---------- Boss ---------- */
.bosshead{display:flex;align-items:center;gap:.8rem;background:linear-gradient(#ffd6d6,#ffeaea);border-radius:1.2rem;padding:.5rem .9rem;box-shadow:var(--shadow);flex:none}
.bosshead .bossface{font-size:3.2rem}
.powers{display:flex;gap:.5rem;flex:none}
/* ---------- class mode ---------- */
.race{background:linear-gradient(#bfe9ff,#e5f8ff);border-radius:1.2rem;padding:.6rem .8rem;box-shadow:var(--shadow);flex:none}
.rtrack{display:flex;align-items:center;gap:.6rem;margin:.3rem 0}
.rtrack .tn{width:6rem;font-size:1rem;font-weight:900;flex:none;text-align:right;color:var(--ink)}
.rtrack .lane2{flex:1;height:2.4rem;background:rgba(255,255,255,.7);border-radius:99px;position:relative}
.rtrack .bal{position:absolute;top:-.5rem;font-size:2.4rem;transform:translateX(-50%);transition:left .8s cubic-bezier(.3,1.4,.5,1)}
.tpill{padding:.35rem .9rem;border-radius:99px;color:#fff;font-weight:900;font-size:1.2rem;display:inline-block}
.timerbar{height:.9rem;border-radius:99px;background:#d6e6f7;overflow:hidden;flex:none}
.timerbar i{display:block;height:100%;background:var(--green);transition:background .3s}
.teamcfg{display:flex;gap:.5rem;flex-wrap:wrap}
.teamcfg input{font:inherit;font-weight:800;padding:.4rem .7rem;border-radius:.8rem;border:.15rem solid var(--line);width:9rem;user-select:text}
/* ---------- misc ---------- */
.village{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.6rem,1fr));gap:.5rem;background:linear-gradient(#bfe9ff,#bff3b0);border-radius:1.2rem;padding:.8rem;min-height:12rem}
.hut{font-size:2.4rem;text-align:center;line-height:1;position:relative;animation:scr .4s}
.hut::after{content:"";position:absolute;left:50%;top:-.2rem;transform:translateX(-50%);font-size:1.5rem;opacity:.85}
.cert{width:100%;max-width:40rem;border-radius:1rem;box-shadow:var(--shadow);display:block;margin:0 auto}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.6rem}
.badge{background:#fff;border-radius:1rem;padding:.6rem .4rem;text-align:center;box-shadow:0 .2rem 0 #cfdcee;font-size:.85rem;line-height:1.4}
.badge .e{font-size:2.3rem;display:block}
.badge.no{opacity:.4;filter:grayscale(1)}
.bar2{display:flex;align-items:center;gap:.5rem;margin:.3rem 0;font-size:.95rem}
.bar2 .nm{width:7.5rem;flex:none}
.bar2 .tr{flex:1;height:1.2rem;background:#e3eefb;border-radius:99px;overflow:hidden}
.bar2 .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:99px}
.bar2 .v{width:4.5rem;text-align:right;flex:none;font-size:.85rem;color:var(--ink2)}
.wb{background:#fff;border-radius:1rem;padding:.7rem .9rem;box-shadow:0 .2rem 0 #cfdcee;margin-bottom:.6rem;font-size:1.05rem;line-height:2.1}
.idcard{background:linear-gradient(#fff,#fff7dc);border:.18rem solid #ffe07a;border-radius:1rem;padding:.6rem .8rem;line-height:1.9}
.idcard b{font-size:1.4rem;color:var(--coral2)}
.idcard.no{opacity:.45;filter:grayscale(1);border-style:dashed}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.reduce *{animation-duration:.01s!important;transition-duration:.01s!important}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
@media print{body{overflow:visible}#app{position:static}.hud,.dock,.btn,.tabs{display:none}}

#zyBtn{position:fixed;top:.5rem;right:.6rem;z-index:90;min-width:3.5rem;height:3rem;border-radius:1rem;background:#fff;border:.15rem solid var(--line);box-shadow:0 .25rem 0 #b9cde6;font-weight:900;font-size:.9rem;line-height:1.1;padding:.1rem .5rem;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center}
#zyBtn small{font-size:.62rem;letter-spacing:.02rem;color:#d0301f}
#zyBtn.on{background:var(--sun);color:#5a3b00;box-shadow:0 .25rem 0 var(--sun2);border-color:#fff}
#zyBtn:active{transform:translateY(.2rem);box-shadow:none}
.hud,.title-scr{padding-right:4.8rem}
.zy-on .qcard,.zy-on .opt,.zy-on .speech,.zy-on .sheet .body,.zy-on .sheet .ans,.zy-on .inst,.zy-on .sense,.zy-on .brick,.zy-on .ordi,.zy-on .wb,.zy-on .enemy .say,.zy-on .runq,.zy-on .gate .g,.zy-on .sorti,.zy-on .cardc,.zy-on .wtile,.zy-on .idcard,.zy-on .hint{line-height:2.7}
.zy-on .chtile{line-height:2.4;min-width:2.8rem}
.zy-on .pchar,.zy-on .slot{line-height:2.2}
.zy-on .node .nm,.zy-on .node .sk{line-height:2}
.brick .mark{color:#2b3a55}

#go{padding:.7rem .5rem;white-space:nowrap}

.inst>span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
.inst>span:last-child,.opt>span:last-child,.ordi>span:last-child,.speech>div>div{min-width:0}

.zy-on .gate .g{font-size:1rem;line-height:2.5;padding:.3rem 0}.zy-on .gate .g rt{font-size:.4em}

.opt,.sense,.cardc,.ordi,.brick{overflow-wrap:anywhere;max-width:100%}

.btn{white-space:nowrap}.lanebtns .btn{white-space:normal}

.wtile.zt{font-size:1.1rem}
.wtile.sel{outline:3px solid #ffb300;background:#fff8e1}
.wtile.popped.zt{opacity:.5}

<script>
const DATA={"items": [{"id": "z4_1", "sec": "一", "no": "1", "k": "zy", "st": ["S1"], "sk": "zy", "s": "那名⟪運⟫⟪動⟫選手一個跨⟪步⟫，⟪往⟫右邊空檔切入，得分後臉上綻放笑⟪容⟫。", "src": "一.1"}, {"id": "z4_2", "sec": "一", "no": "2", "k": "zy", "st": ["S1"], "sk": "zy", "s": "這條⟪河⟫川上的橋，是由許多人同心⟪協⟫力、⟪汗⟫流浹背搭建而成的。", "src": "一.2"}, {"id": "z4_3", "sec": "一", "no": "3", "k": "zy", "st": ["S1"], "sk": "zy", "s": "好⟪哇⟫！我們來⟪協⟫力玩兩人三⟪腳⟫。", "src": "一.3"}, {"id": "z4_4", "sec": "一", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "學習⟪聲⟫樂和⟪舞⟫蹈的她，身上充滿了藝術家的⟪氣⟫息。", "src": "一.4"}, {"id": "z4_5", "sec": "一", "no": "5", "k": "zy", "st": ["S1"], "sk": "zy", "s": "笑⟪容⟫", "src": "一.5"}, {"id": "z4_6", "sec": "一", "no": "6", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪往⟫上跳", "src": "一.6"}, {"id": "z4_9", "sec": "一", "no": "9", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪可⟫是", "src": "一.9"}, {"id": "z4_10", "sec": "一", "no": "10", "k": "zy", "st": ["S1"], "sk": "zy", "s": "在前⟪往⟫⟪熱⟫⟪鬧⟫⟪舞⟫會的路上，每個人都面帶笑⟪容⟫，踏著輕快的⟪步⟫伐。", "src": "一.10"}, {"id": "z4_11", "sec": "一", "no": "11", "k": "zy", "st": ["S1"], "sk": "zy", "s": "馬拉松比⟪賽⟫的⟪運⟫動選手⟪汗⟫如雨下，堅持到⟪最⟫後，獲得大家熱烈的掌⟪聲⟫。", "src": "一.11"}, {"id": "z4_12", "sec": "一", "no": "12", "k": "zy", "st": ["S1"], "sk": "zy", "s": "放慢⟪腳⟫⟪步⟫", "src": "一.12"}, {"id": "z_a1", "sec": "一", "no": "7", "k": "zy", "st": ["S1"], "sk": "zy", "s": "寬闊的操場上，刺激的⟪拔⟫⟪河⟫比⟪賽⟫開始了。", "src": "一.7（短文分句）"}, {"id": "z_a2", "sec": "一", "no": "7", "k": "zy", "st": ["S1"], "sk": "zy", "s": "老師說：「只要大家同心⟪協⟫力，就可以發揮⟪最⟫大的力量。」", "src": "一.7（短文分句）"}, {"id": "z_a3", "sec": "一", "no": "7", "k": "zy", "st": ["S1"], "sk": "zy", "s": "大家紛紛抓緊繩子，伴隨著場邊的加油⟪聲⟫，", "src": "一.7（短文分句）"}, {"id": "z_a4", "sec": "一", "no": "7", "k": "zy", "st": ["S1"], "sk": "zy", "s": "一⟪步⟫一⟪步⟫努力⟪往⟫後退，", "src": "一.7（短文分句）"}, {"id": "z_a5", "sec": "一", "no": "7", "k": "zy", "st": ["S1"], "sk": "zy", "s": "用盡全身的力⟪氣⟫想要阻止繩子被拉走，", "src": "一.7（短文分句）"}, {"id": "z_a6", "sec": "一", "no": "7", "k": "zy", "st": ["S1"], "sk": "zy", "s": "額頭也流出許多⟪汗⟫水。", "src": "一.7（短文分句）"}, {"id": "zp_a", "sec": "一", "no": "7", "k": "zp", "st": ["S2"], "sk": "zy", "s": "寬闊的操場上，刺激的⟪拔⟫⟪河⟫比⟪賽⟫開始了。老師說：「只要大家同心⟪協⟫力，就可以發揮⟪最⟫大的力量。」大家紛紛抓緊繩子，伴隨著場邊的加油⟪聲⟫，一⟪步⟫一⟪步⟫努力⟪往⟫後退，用盡全身的力⟪氣⟫想要阻止繩子被拉走，額頭也流出許多⟪汗⟫水。我想不論輸贏，都會成為我們美好的回憶。", "title": "拔河比賽", "qs": [], "src": "一.7（短文）"}, {"id": "z_b1", "sec": "一", "no": "8", "k": "zy", "st": ["S1"], "sk": "zy", "s": "今天是學校一年一度的⟪運⟫⟪動⟫會。", "src": "一.8（短文分句）"}, {"id": "z_b2", "sec": "一", "no": "8", "k": "zy", "st": ["S1"], "sk": "zy", "s": "操場上⟪飄⟫著五顏六色的彩旗，到處充滿了歡笑⟪聲⟫，", "src": "一.8（短文分句）"}, {"id": "z_b3", "sec": "一", "no": "8", "k": "zy", "st": ["S1"], "sk": "zy", "s": "真是⟪熱⟫⟪鬧⟫極了！", "src": "一.8（短文分句）"}, {"id": "z_b4", "sec": "一", "no": "8", "k": "zy", "st": ["S1"], "sk": "zy", "s": "在大會⟪舞⟫、兩人三⟪腳⟫的項目結束後，", "src": "一.8（短文分句）"}, {"id": "z_b5", "sec": "一", "no": "8", "k": "zy", "st": ["S1"], "sk": "zy", "s": "老師帶大家⟪往⟫跑道走去，", "src": "一.8（短文分句）"}, {"id": "z_b6", "sec": "一", "no": "8", "k": "zy", "st": ["S1"], "sk": "zy", "s": "因為刺激的大隊接力比⟪賽⟫就要開始了。", "src": "一.8（短文分句）"}, {"id": "z_b7", "sec": "一", "no": "8", "k": "zy", "st": ["S1"], "sk": "zy", "s": "雖然要拿第一名並不⟪容⟫易，但我們一定會全力以赴，", "src": "一.8（短文分句）"}, {"id": "zp_b", "sec": "一", "no": "8", "k": "zp", "st": ["S2"], "sk": "zy", "s": "今天是學校一年一度的⟪運⟫⟪動⟫會。操場上⟪飄⟫著五顏六色的彩旗，到處充滿了歡笑⟪聲⟫，真是⟪熱⟫⟪鬧⟫極了！在大會⟪舞⟫、兩人三⟪腳⟫的項目結束後，老師帶大家⟪往⟫跑道走去，因為刺激的大隊接力比⟪賽⟫就要開始了。\n雖然要拿第一名並不⟪容⟫易，但我們一定會全力以赴，努力衝過終點線。", "title": "學校運動會", "qs": [], "src": "一.8（短文）"}, {"id": "zk_t11", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "青天高，白雲⟪飄⟫，⟪運⟫⟪動⟫大會正⟪熱⟫⟪鬧⟫！", "src": "課本（課文）"}, {"id": "zk_t12", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "大會⟪舞⟫，跳⟪哇⟫跳，心情跟著⟪往⟫上跳，笑⟪容⟫也在臉上跳⟪哇⟫跳！", "src": "課本（課文）"}, {"id": "zpk_t1", "sec": "課本", "no": "課文", "k": "zp", "st": ["S2"], "sk": "zy", "s": "青天高，白雲⟪飄⟫，⟪運⟫⟪動⟫大會正⟪熱⟫⟪鬧⟫！大會⟪舞⟫，跳⟪哇⟫跳，心情跟著⟪往⟫上跳，笑⟪容⟫也在臉上跳⟪哇⟫跳！", "title": "課文第一段：熱鬧的運動會", "qs": [], "src": "課本（課文）"}, {"id": "zk_t21", "sec": "課本", "no": "課文", "k": "zy", "st": ["S1"], "sk": "zy", "s": "跑⟪步⟫比⟪賽⟫比誰快，⟪汗⟫水也要來比⟪賽⟫，看誰跑得比風快 一：寫國字或注音）"}, {"id": "zk_k6", "sec": "課本", "no": "習作", "k": "zy", "st": ["S1"], "sk": "zy", "s": "抬頭看著白雲⟪飄⟫過，深吸一口新鮮空⟪氣⟫，好舒服⟪哇⟫！", "src": "課本（習作一：寫國字或注音）"}, {"id": "zk_k7", "sec": "課本", "no": "習作", "k": "zy", "st": ["S1"], "sk": "zy", "s": "爸爸說：「每一種⟪運⟫⟪動⟫和比⟪賽⟫，都需要堅忍不⟪拔⟫的意志，", "src": "課本（習作一：寫國字或注音）"}, {"id": "zk_k8", "sec": "課本", "no": "習作", "k": "zy", "st": ["S1"], "sk": "zy", "s": "這是很不⟪容⟫易的。」", "src": "課本（習作一：寫國字或注音）"}, {"id": "zpk_k", "sec": "課本", "no": "習作", "k": "zp", "st": ["S2"], "sk": "zy", "s": "今天，我們去爬山。一開始我輕鬆的⟪往⟫前走，一路欣賞⟪河⟫邊風光，身旁有飛⟪舞⟫的蝴蝶、⟪熱⟫⟪鬧⟫的蟲鳴鳥叫⟪聲⟫相伴。\n⟪可⟫是，我的⟪腳⟫⟪步⟫漸漸慢了下來，才走到半山腰，已經累得滿頭大⟪汗⟫。最後，在爸爸的⟪協⟫助下，我終於到達山頂，抬頭看著白雲⟪飄⟫過，深吸一口新鮮空⟪氣⟫，好舒服⟪哇⟫！\n爸爸說：「每一種⟪運⟫⟪動⟫和比⟪賽⟫，都需要堅忍不⟪拔⟫的意志，這是很不⟪容⟫易的。」", "title": "爬山", "qs": [], "src": "課本（習作一：寫國字或注音）"}, {"id": "zk_c1", "sec": "課本", "no": "習作", "k": "zy", "st": ["S1"], "sk": "zy", "s": "文字變化真神⟪奇⟫。", "src": "課本（我會認字：可字家族；習作二）"}, {"id": "zk_c2", "sec": "課本", "no": "習作", "k": "zy", "st": ["S1"], "sk": "zy", "s": "景色優美淡水⟪河⟫。", "src": "課本（我會認字：可字家族；習作二）"}, {"id": "zk_c3", "sec": "課本", "no": "習作", "k": "zy", "st": ["S1"], "sk": "zy", "s": "全家團聚笑⟪呵⟫⟪呵⟫。", "src": "課本（我會認字：可字家族；習作二）"}, {"id": "zk_c4", "sec": "課本", "no": "習作", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪何⟫時⟪何⟫地問為⟪何⟫。", "src": "課本（我會認字：可字家族；習作二）"}, {"id": "zk_c5", "sec": "課本", "no": "習作", "k": "zy", "st": ["S1"], "sk": "zy", "s": "小小世界真⟪奇⟫妙，⟪河⟫水唱歌嘩啦啦，可愛魚兒捉迷藏，", "src": "課本（我會認字：可字家族；習作二）"}, {"id": "zk_c6", "sec": "課本", "no": "習作", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪何⟫處青蛙嘓嘓叫，大樹聽了笑⟪呵⟫⟪呵⟫。", "src": "課本（我會認字：可字家族；習作二）"}, {"id": "z4x_01", "sec": "補充", "no": "1", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪運⟫動", "src": "補充題（詞語）", "gen": 1}, {"id": "z4x_02", "sec": "補充", "no": "2", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪運⟫氣", "src": "補充題（詞語）", "gen": 1}, {"id": "z4x_03", "sec": "補充", "no": "3", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪運⟫河", "src": "補充題（詞語）", "gen": 1}, {"id": "z4x_04", "sec": "補充", "no": "4", "k": "zy", "st": ["S1"], "sk": "zy", "s": "⟪動⟫物 , {"id": "b1q5", "sec": "補充", "no": "5", "k": "mc", "st": ["S10"], "sk": "read", "stem": "大家用盡全身的力氣想要做什麼？", "opts": ["阻止繩子被拉走", "把繩子剪斷", "把繩子藏起來"], "ans": 0, "why": "文章說：用盡全身的力氣想要阻止繩子被拉走。", "src": "補充（短文）", "bk": "b1", "gen": 1}, {"id": "b2q1", "sec": "一", "no": "8-1", "k": "tf", "st": ["S10"], "sk": "read", "stem": "今天在學校的操場上可以看到五顏六色的彩旗。", "ans": 1, "why": "文章說：操場上飄著五顏六色的彩旗。", "bk": "b2", "src": "一.8（１）"}, {"id": "b2q2", "sec": "一", "no": "8-2", "k": "tf", "st": ["S10"], "sk": "read", "stem": "對於大隊接力這個項目，大家都有信心能拿第一。", "ans": 0, "why": "文章說：雖然要拿第一名並不容易，但我們一定會全力以赴，不是說有信心能拿第一。", "bk": "b2", "src": "一.8（２）"}, {"id": "b2q3", "sec": "補充", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "運動會是學校多久舉行一次？", "opts": ["一年一次", "一天一次", "一個月一次"], "ans": 0, "why": "文章說：今天是學校一年一度的運動會。", "src": "補充（短文）", "bk": "b2", "gen": 1}, {"id": "b2q4", "sec": "補充", "no": "4", "k": "mc", "st": ["S10"], "sk": "read", "stem": "老師帶大家往哪裡走去？", "opts": ["跑道", "教室", "圖書館"], "ans": 0, "why": "文章說：老師帶大家往跑道走去。", "src": "補充（短文）", "bk": "b2", "gen": 1}, {"id": "b2q5", "sec": "補充", "no": "5", "k": "mc", "st": ["S10"], "sk": "read", "stem": "大隊接力比賽就要開始了，大家一定會怎麼做？", "opts": ["全力以赴", "躲起來", "提早回家"], "ans": 0, "why": "文章說：我們一定會全力以赴，努力衝過終點線。", "src": "補充（短文）", "bk": "b2", "gen": 1}, {"id": "b3q1", "sec": "十", "no": "1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "這首詩的題目是邀請，是誰邀請誰呢？", "opts": ["小螞蟻邀請長頸鹿。", "長頸鹿邀請小螞蟻。", "花朵邀請長頸鹿。"], "ans": 0, "why": "小螞蟻邀請長頸鹿，要牠低下來，才能聞到草地上的花。", "src": "十.1（閱讀）", "bk": "b3"}, {"id": "b3q2", "sec": "補充", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "小螞蟻在草地上碰到誰？", "opts": ["長頸鹿", "小花貓", "大象"], "ans": 0, "why": "詩中說：一隻小螞蟻在草地上，碰到一隻長頸鹿。", "src": "補充（短文）", "bk": "b3", "gen": 1}, {"id": "b3q3", "sec": "補充", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "小螞蟻要長頸鹿怎麼樣？", "opts": ["低一點", "高一點", "快一點"], "ans": 0, "why": "小螞蟻說：你那麼高不行哪！要低一點。", "src": "補充（短文）", "bk": "b3", "gen": 1}, {"id": "b3q4", "sec": "補充", "no": "4", "k": "mc", "st": ["S10"], "sk": "read", "stem": "長頸鹿最後聞到了什麼？", "opts": ["一朵盛開的花", "一塊蛋糕", "一條魚"], "ans": 0, "why": "詩的最後說：開心的聞著草地上，一朵盛開的花。", "src": "補充（短文）", "bk": "b3", "gen": 1}, {"id": "b4q1", "sec": "十", "no": "1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "國王受傷後，變成一個怎樣的人？", "opts": ["凶猛殘暴的人", "愛護百姓的人", "愛指責別人的人", "沉默寡言的人"], "ans": 0, "why": "文章說：他的個性就變得非常殘暴。", "src": "十.2（１）", "bk": "b4"}, {"id": "b4q2", "sec": "十", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "國王的一隻眼睛是怎麼瞎的呢？", "opts": ["天生就瞎了一隻眼睛", "自己不小心刺瞎的", "被敵人刺瞎的", "生病而瞎的"], "ans": 2, "why": "文章說：他在一次戰爭中被敵人刺傷了一隻眼睛。", "src": "十.2（２）", "bk": "b4"}, {"id": "b4q3", "sec": "十", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "下面哪一個選項最適合用來形容第二位畫家呢？", "opts": ["懂得隨機應變", "聰明反被聰明", "沉著鎮定又機智", "雙喜臨門"], "ans": 1, "why": "第二位畫家學聰明了，畫了兩隻炯炯有神的大眼睛，卻讓國王覺得被諷刺，反而被處死，所以是「聰明反被聰明」。", "src": "十.2（３）", "bk": "b4"}, {"id": "b4q4", "sec": "補充", "no": "4", "k": "mc", "st": ["S10"], "sk": "read", "stem": "第一位畫家為什麼被處死？", "opts": ["因為把國王的眼罩也畫出來了", "因為畫得不像", "因為遲到了"], "ans": 0, "why": "文章說：他把國王的眼罩也畫出來了，國王看了十分生氣。", "src": "補充（短文）", "bk": "b4", "gen": 1}, {"id": "b4q5", "sec": "補充", "no": "5", "k": "mc", "st": ["S10"], "sk": "read", "stem": "第三位畫家想出了什麼好辦法？", "opts": ["畫國王的側面畫像", "不畫了", "畫一隻小狗"], "ans": 0, "why": "文章說：他畫國王的側面畫像，把瞎掉的那一隻眼睛完全隱藏。", "src": "補充（短文）", "bk": "b4", "gen": 1}, {"id": "b5q1", "sec": "十一", "no": "1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "「安國君把兒子子楚送到趙國當人質。」從這句話可以知道什麼？", "opts": ["子楚並不受寵。", "子楚是趙國人。", "子楚就要繼承王位。", "子楚很賢能。"], "ans": 0, "why": "被送去當人質，趙國又不禮遇他，可以知道子楚並不受寵。", "src": "十一.1（１）", "bk": "b5"}, {"id": "b5q2", "sec": "十一", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "「奇貨可居」的「居」是什麼意思？", "opts": ["居住", "當鄰居", "儲存", "居然"], "ans": 2, "why": "「奇貨可居」，是把稀有的貨物囤積起來，等待高價時再賣，所以「居」是儲存。", "src": "十一.1（２）", "bk": "b5"}, {"id": "b5q3", "sec": "十一", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "在故事中被比喻為「奇貨」的是誰？", "opts": ["呂不韋", "子楚", "華陽夫人", "安國君"], "ans": 1, "why": "呂不韋認為子楚像一件寶物，可以買起來囤積，所以子楚被比喻為「奇貨」。", "src": "十一.1（３）", "bk": "b5"}, {"id": "b6q1", "sec": "十一", "no": "1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "孟子周遊列國的理想是什麼？", "opts": ["了解各國君王誰最努力", "看哪個國家最強盛", "勸導各國停止戰爭", "遊山玩水和講學"], "ans": 2, "why": "孟子周遊列國，是為了勸導各國國君重視仁義之道，改變好戰的風氣。", "src": "十一.2（１）", "bk": "b6"}, {"id": "b6q2", "sec": "十一", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "梁惠王和鄰國君王共同的缺點是什麼？", "opts": ["喜歡嘲笑人", "喜歡戰爭", "半途而廢", "五十步笑百步"], "ans": 1, "why": "孟子說梁惠王「你喜歡戰爭」，鄰國也一樣不管人民的死活，所以共同的缺點是喜歡戰爭。", "src": "十一.2（２）", "bk": "b6"}, {"id": "b7q1", "sec": "補充", "no": "1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "運動會當天，小明一早做了什麼事？", "opts": ["穿上運動服出門", "去圖書館看書", "在家裡睡覺"], "ans": 0, "why": "短文說：小明一早就穿上運動服出門。", "src": "補充（短文）", "bk": "b7", "gen": 1}, {"id": "b7q2", "sec": "補充", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "第一個項目是什麼？", "opts": ["大會舞", "拔河", "跳高"], "ans": 0, "why": "短文說：第一個項目是大會舞。", "src": "補充（短文）", "bk": "b7", "gen": 1}, {"id": "b7q3", "sec": "補充", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "小明和小華參加兩人三腳，最後得到第幾名？", "opts": ["第二名", "第一名", "第三名"], "ans": 0, "why": "短文說：最後得到第二名。", "src": "補充（短文）", "bk": "b7", "gen": 1}, {"id": "b7q4", "sec": "補充", "no": "4", "k": "mc", "st": ["S10"], "sk": "read", "stem": "運動會結束了，大家的心情怎麼樣？", "opts": ["笑得好開心", "覺得很生氣", "覺得很難過"], "ans": 0, "why": "短文說：大家都滿頭大汗，卻笑得好開心。", "src": "補充（短文）", "bk": "b7", "gen": 1}, {"id": "b8q1", "sec": "補充", "no": "1", "k": "mc", "st": ["S10"], "sk": "read", "stem": "拔河比賽在什麼時候舉行？", "opts": ["下午", "早上", "晚上"], "ans": 0, "why": "短文說：下午，操場上要舉行拔河比賽。", "src": "補充（短文）", "bk": "b8", "gen": 1}, {"id": "b8q2", "sec": "補充", "no": "2", "k": "mc", "st": ["S10"], "sk": "read", "stem": "每一隊有幾位同學？", "opts": ["十位", "五位", "二十位"], "ans": 0, "why": "短文說：每一隊有十位同學。", "src": "補充（短文）", "bk": "b8", "gen": 1}, {"id": "b8q3", "sec": "補充", "no": "3", "k": "mc", "st": ["S10"], "sk": "read", "stem": "哨子一響，兩隊同學怎麼做？", "opts": ["用力往後拉", "坐下來休息", "一起唱歌"], "ans": 0, "why": "短文說：哨子一響，兩隊同學用力往後拉。", "src rc": "是非題（依試卷內容改編）"}, {"id": "tf102", "sec": "補充", "no": "102", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「散步」是慢慢走，讓身體放鬆。", "ans": 1, "why": "「散步」，是慢慢走，讓身體放鬆。", "src": "是非題（依試卷內容改編）"}, {"id": "tf103", "sec": "補充", "no": "103", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「汗水」是從身體流出來的水分。", "ans": 1, "why": "「汗水」，是天氣熱或運動時，從身體流出的水。", "src": "是非題（依試卷內容改編）"}, {"id": "tf104", "sec": "補充", "no": "104", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「賽跑」是比誰跑得快的比賽。", "ans": 1, "why": "「賽跑」，是比誰跑得快的比賽。", "src": "是非題（依試卷內容改編）"}, {"id": "tf105", "sec": "補充", "no": "105", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「一會兒」是說時間很短。", "ans": 1, "why": "「一會兒」，是說時間很短。", "src": "是非題（依試卷內容改編）"}, {"id": "tf106", "sec": "補充", "no": "106", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「最後」是指排在最前面的。", "ans": 0, "why": "「最後」是指排在最後面的，不是最前面。", "src": "是非題（依試卷內容改編）"}, {"id": "tf107", "sec": "補充", "no": "107", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「第一」是指排在最前面的。", "ans": 1, "why": "「第一」，是排在最前面的。", "src": "是非題（依試卷內容改編）"}, {"id": "tf108", "sec": "補充", "no": "108", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「兩人三腳」是兩個人把兩隻腳綁在一起，一起走。", "ans": 1, "why": "兩人三腳，是兩個人的兩隻腳綁在一起，一起往前走，需要同心協力。", "src": "是非題（依試卷內容改編）"}, {"id": "tf109", "sec": "補充", "no": "109", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「大隊接力」是很多人輪流跑的比賽。", "ans": 1, "why": "大隊接力，是很多人一棒接著一棒，輪流跑的比賽。", "src": "是非題（依試卷內容改編）"}, {"id": "tf110", "sec": "補充", "no": "110", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「不過」前後兩句話的意思，常常是相反的。", "ans": 1, "why": "「…不過…」的後一句話和前一句話，常常是相反的意思。", "src": "是非題（依試卷內容改編）"}, {"id": "tf111", "sec": "補充", "no": "111", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「我的力氣小，不過我的聲音可不小。」這句話，是說我的聲音很大。", "ans": 1, "why": "「不過」後面轉折，是說我的聲音可不小，就是聲音很大。", "src": "是非題（依試卷內容改編）"}, {"id": "tf112", "sec": "補充", "no": "112", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「同學找我出去玩，不過我的功課還沒寫完，不能出去。」這句話，是說我可以出去玩。", "ans": 0, "why": "「不過」後面說功課還沒寫完，不能出去，所以我不能出去玩。", "src": "是非題（依試卷內容改編）"}, {"id": "tf113", "sec": "補充", "no": "113", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「我的個子小，不過力氣大。」前後兩句話，意思是相反的。", "ans": 1, "why": "個子小和力氣大，是相反的意思，用「不過」連起來很合適。", "src": "是非題（依試卷內容改編）"}, {"id": "tf114", "sec": "補充", "no": "114", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「他很累，所以不過他很開心。」這句話用對了「不過」。", "ans": 0, "why": "「不過」要放在前後兩句話的中間，例如「他很累，不過他很開心」。", "src": "是非題（依試卷內容改編）"}, {"id": "tf115", "sec": "補充", "no": "115", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「跑步比賽好累，不過我很開心。」這句話用對了「不過」。", "ans": 1, "why": "好累和很開心，意思相反，用「不過」連起來很合適。", "src": "是非題（依試卷內容改編）"}, {"id": "tf116", "sec": "補充", "no": "116", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「最後」可以用在事情的最後。", "ans": 1, "why": "「最後」，是事情的最後，例如「最後我們贏了」。", "src": "是非題（依試卷內容改編）"}, {"id": "tf117", "sec": "補充", "no": "117", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「今天我們比賽，最後一開始就贏了。」這句話用對了「最後」。", "ans": 0, "why": "「最後」是事情的最後，不能用在一開始。", "src": "是非題（依試卷內容改編）"}, {"id": "tf118", "sec": "補充", "no": "118", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "問句的句尾要用問號。", "ans": 1, "why": "心中有疑問時，句尾要用問號。", "src": "是非題（依試卷內容改編）"}, {"id": "tf119", "sec": "補充", "no": "119", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「看誰跑得比風快？」句尾用問號是對的。", "ans": 1, "why": "「看誰跑得比風快？」是一句問句，句尾用問號。", "src": "是非題（依試卷內容改編）"}, {"id": "tf120", "sec": "補充", "no": "120", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「看看最後誰第一！」句尾用驚嘆號最合適。", "ans": 0, "why": "「看看最後誰第一？」是一句問句，句尾要用問號。", "src": "是非題（依試卷內容改編）"}, {"id": "tf121", "sec": "補充", "no": "121", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「加油！加油！」的驚嘆號，表示很興奮、很用力的喊。", "ans": 1, "why": "驚嘆號用來表示強烈的感情，像大聲喊加油。", "src": "是非題（依試卷內容改編）"}, {"id": "tf122", "sec": "補充", "no": "122", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「跳高、跳遠和跑步」，三個項目中間用頓號隔開是對的。", "ans": 1, "why": "跳高、跳遠、跑步是同類的運動項目，中間用頓號隔開。", "src": "是非題（依試卷內容改編）"}, {"id": "tf123", "sec": "補充", "no": "123", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「跳高。跳遠。和跑步」用句號隔開是對的。", "ans": 0, "why": "同類的詞語中間要用頓號，不能用句號。", "src": "是非題（依試卷內容改編）"}, {"id": "tf124", "sec": "補充", "no": "124", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "「青天高，白雲飄，運動大會正熱鬧！」這句話的最後用驚嘆號。", "ans": 1, "why": "課文第一段說：青天高，白雲飄，運動大會正熱鬧！", "src": "是非題（依試卷內容改編）"}, {"id": "tf125", "sec": "補充", "no": "125", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "課文說，青天高，白雲飄。", "ans": 1, "why": "課文第一段說：青天高，白雲飄。", "src": "是非題（依試卷內容改編）"}, {"id": "tf126", "sec": "補充", "no": "126", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "課文說，運動大會正熱鬧。", "ans": 1, "why": "課文第一段說：運動大會正熱鬧！", "src": "是非題（依試卷內容改編）"}, {"id": "tf127", "sec": "補充", "no": "127", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "課文說，大會舞跳哇跳，心情跟著往上跳。", "ans": 1, "why": "課文說：大會舞，跳哇跳，心情跟著往上跳。", "src": "是非題（依試卷內容改編）"}, {"id": "tf128", "sec": "補充", "no": "128", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "課文說，笑容也在臉上跳哇跳。", "ans": 1, "why": "課文說：笑容也在臉上跳哇跳！", "src": "是非題（依試卷內容改編）"}, {"id": "tf129", "sec": "補充", "no": "129", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "課文說，跑步比賽比誰胖。", "ans": 0, "why": "課文說：跑步比賽比誰快。", "src": "是非題（依試卷內容改編）"}, {"id": "tf130", "sec": "補充", "no": "130", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "課文說，汗水也要來比賽。", "ans": 1, "why": "課文第二段說：汗水也要來比賽。", "src": "是非題（依試卷內容改編）"}, {"id": "tf131", "sec": "補充", "no": "131", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "課文說，兩人三腳比同心，比協力。", "ans": 1, "why": "課文說：兩人三腳比什麼？比同心，比協力。", "src": "是非題（依試卷內容改編）"}, {"id": "tf132", "sec": "補充", "no": "132", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "課文說，歡樂笑聲也來比一比。", "ans": 1, "why": "課文第二段最後說：歡樂笑聲也來比一比！", "src": "是非題（依試卷內容改編）"}, {"id": "tf133", "sec": "補充", "no": "133", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "課文說，拔河比力氣。", "ans": 1, "why": "課文第三段說：拔河比力氣。", "src": "是非題（依試卷內容改編）"}, {"id": "tf134", "sec": "補充", "no": "134", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "課文說，拔河一會兒拉過來，一會兒拉過去。", "ans": 1, "why": "課文說：一會兒拉過來，一會兒拉過去。", "src": "是非題（依試卷內容改編）"}, {"id": "tf135", "sec": "補充", "no": "135", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "課文說，我的力氣大，也跑得快。", "ans": 0, "why": "課文說：我的力氣小，跑不快，跳不高。", "src": "是非題（依試卷內容改編）"}, {"id": "tf136", "sec": "補充", "no": "136", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "課文說，我的聲音可不小。", "ans": 1, "why": "課文說：不過我的聲音可不小！", "src": "是非題（依試卷內容改編）"}, {"id": "tf137", "sec": "補充", "no": "137", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "課文說，我的聲音比天高。", "ans": 1, "why": "課文最後說：我的聲音比天高！", "src": "是非題（依試卷內容改編）"}, {"id": "tf138", "sec": "補充", "no": "138", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "課文一共有四段。", "ans": 1, "why": "課文一共有四段。", "src": "是非題（依試卷內容改編）"}, {"id": "tf139", "sec": "補充", "no": "139", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "課文的作者是林世仁。", "ans": 1, "why": "課文旁寫著：林世仁。", "src": "是非題（依試卷內容改編）"}, {"id": "tf140", "sec": "補充", "no": "140", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "運動前先做暖身運動，比較不容易受傷。", "ans": 1, "why": "運動前先暖身，讓身體熱起來，可以避免受傷。", "src": "是非題（依試卷內容改編）"}, {"id": "tf141", "sec": "補充", "no": "141", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "運動時流了很多汗，要記得補充水分。", "ans": 1, "why": "流汗後，身體會缺水，要記得喝水。", "src": "是非題（依試卷內容改編）"}, {"id": "tf142", "sec": "補充", "no": "142", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "拔河時，大家要同心協力，一起用力。", "ans": 1, "why": "拔河要大家同心協力，才能發揮最大的力量。", "src": "是非題（依試卷內容改編）"}, {"id": "tf143", "sec": "補充", "no": "143", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "比賽輸了，可以生氣的丟東西。", "ans": 0, "why": "比賽輸了也要保持風度，不可以生氣丟東西。", "src": "是非題（依試卷內容改編）"}, {"id": "tf144", "sec": "補充", "no": "144", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "為別人加油，是很好的行為。", "ans": 1, "why": "為同學加油，表示關心和支持，是很好的行為。", "src": "是非題（依試卷內容改編）"}, {"id": "tf145", "sec": "補充", "no": "145", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "兩人三腳時，兩個人的腳步要一致，才不會跌倒。", "ans": 1, "why": "兩人三腳要配合彼此的腳步，才能順利往前走。", "src": "是非題（依試卷內容改編）"}, {"id": "tf146", "sec": "補充", "no": "146", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "運動會上，大家應該互相比賽，不需要遵守規則。", "ans": 0, "why": "比賽一定要遵守規則，這樣才公平。", "src": "是非題（依試卷內容改編）"}, {"id": "tf147", "sec": "補充", "no": "147", "k": "tf", "st": ["S5"], "sk": "tf", "stem": "跑完步後，可以馬上大口喝冰水然後躺下。", "ans": 0, "why": "運動後要慢慢走一走，讓身體恢復，再慢慢補充水分。", "src": "是非題（依試卷內容改編）"}, {"id": "o12a" ", "何", "河", "柯"], "ans": 2, "why": "「小河」的「河」，是這個字。", "src": "三.1", "pO": 1, "say": "我們沿著這條小河散步。看注音，選出對的字。"}, {"id": "q3_2", "sec": "三", "no": "2", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "將注音寫成國字後，哪一組的字完全正確？\n①氣球⟪往⟫上⟪飄⟫走了（寫成：住、漂）\n②同心⟪協⟫力⟪拔⟫蘿蔔（寫成：脅、拔）\n③他的笑⟪容⟫真⟪可⟫愛（寫成：容、何）\n④邁開⟪腳⟫⟪步⟫向前走（寫成：腳、步）", "opts": ["第①組", "第②組", "第③組", "第④組"], "ans": 3, "why": "第④組「腳、步」完全正確。第①組的「往」寫成了「住」，「飄」寫成了「漂」；第②組的「協」寫錯了；第③組的「可」寫成了「何」。", "src": "三.2", "pO": 1, "say": "將注音寫成國字後，哪一組的字完全正確？第一組，住、漂。第二組，脅、拔。第三組，容、何。第四組，腳、步。"}, {"id": "q3_3", "sec": "三", "no": "3", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "「馬拉松比塞時，選手們個個扞流浹背，不過此起彼落的加油聲岢真令人振奮。」\n句子中的錯別字有哪些？", "opts": ["選，落，岢", "塞，扞，岢", "塞，落，聲", "選，扞，聲"], "ans": 1, "why": "正確的寫法是「比賽」「汗流浹背」「可」，所以錯別字是「塞」「扞」「岢」。", "src": "三.3", "pO": 1, "say": "馬拉松比塞時，選手們個個扞流浹背，不過此起彼落的加油聲岢真令人振奮。句子中的錯別字有哪些？"}, {"id": "q3_4", "sec": "三", "no": "4", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "這次比賽他能得到冠軍，真是不⟪容⟫易。\n看注音，選出對的字。", "opts": ["籠", "農", "容", "仍"], "ans": 2, "why": "「不容易」的「容」，是這個字。", "src": "三.4", "pO": 1, "say": "這次比賽他能得到冠軍，真是不容易。看注音，選出對的字。"}, {"id": "q3_5", "sec": "三", "no": "5", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "這附近新開了一間⟪舞⟫蹈教室。\n看注音，選出對的字。", "opts": ["舞", "無", "舛", "舜"], "ans": 0, "why": "「舞蹈」的「舞」，是這個字。", "src": "三.5", "pO": 1, "say": "這附近新開了一間舞蹈教室。看注音，選出對的字。"}, {"id": "q4_1b", "sec": "四", "no": "1", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「⟬往⟭」可以組成哪一個詞語？", "opts": ["往來", "往桌", "往鞋"], "ans": 0, "why": "「往來」是一個詞語。", "src": "四.1", "pO": 1}, {"id": "q4_2a", "sec": "四", "no": "2", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "「⟬協⟭」的部首是什麼？", "opts": ["十", "力", "刀"], "ans": 0, "why": "「協」的部首是「十」。", "src": "四.2", "pO": 1}, {"id": "q4_2b", "sec": "四", "no": "2", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「協」可以組成哪一個詞語？", "opts": ["協助", "協桌", "協鞋"], "ans": 0, "why": "「協助」是一個詞語，是在旁邊幫忙。", "src": "四.2", "pO": 1}, {"id": "q4_3a", "sec": "四", "no": "3", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "「⟬動⟭」的部首是什麼？", "opts": ["力", "云", "口"], "ans": 0, "why": "「動」的部首是「力」。", "src": "四.3", "pO": 1}, {"id": "q4_3b", "sec": "四", "no": "3", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「動」可以組成哪一個詞語？", "opts": ["動物", "動桌", "動鞋"], "ans": 0, "why": "「動物」是一個詞語。", "src": "四.3", "pO": 1}, {"id": "q4_4a", "sec": "四", "no": "4", "k": "mc", "st": ["S7"], "sk": "shape", "stem": "「⟬最⟭」的部首是什麼？（依試卷答案）", "opts": ["冂", "口", "攴"], "ans": 0, "why": "依試卷的答案，「最」的部首是「冂」。", "src": "四.4", "pO": 1, "say": "最的部首是什麼？"}, {"id": "q4_4b", "sec": "四", "no": "4", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「最」可以組成哪一個詞語？", "opts": ["最近", "最桌", "最鞋"], "ans": 0, "why": "「最近」是一個詞語。", "src": "四.4", "pO": 1}, {"id": "q6_1", "sec": "六", "no": "1", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "下面哪一個情況適合用「同心協力」來形容？", "opts": ["他性格剛毅，對於自己認定的道理，從不退讓。", "公司政策長期搖擺不定，整個團隊早已各自為政。", "全村居民群策群力，短短幾週就使風災過後的家園重現生機。", "這場比賽中，他單槍匹馬守住禁區，隻身應付對手的攻勢。"], "ans": 2, "why": "「同心協力」，是大家心意相同，一起努力。全村居民群策群力，讓家園重現生機，就是同心協力。", "src": "六.1"}, {"id": "q6_2", "sec": "六", "no": "2", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「這座吊橋，是山區居民□□□□搭建完成的。」\n空格中應該填入哪個詞語？", "opts": ["有氣無力", "三心二意", "同心協力", "不自量力"], "ans": 2, "why": "「同心協力」，是大家一起努力。山區居民一起努力搭建吊橋，所以填「同心協力」。", "src": "六.2"}, {"id": "q6_3", "sec": "六", "no": "3", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「今天天氣酷熱，即使是穿了短袖、短褲，仍然令人□□□□。」\n空格中應該填入哪一個成語？", "opts": ["水深火熱", "汗流浹背", "同心協力", "忍氣吞聲"], "ans": 1, "why": "「汗流浹背」，是形容汗流得很多，連背都濕透了。天氣酷熱，所以填「汗流浹背」。", "src": "六.3"}, {"id": "q6x_1", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「搭建帳篷時，大家□□□□，很快就完成了。」\n空格要填哪一個成語？", "opts": ["同心協力", "三心二意", "有氣無力", "不自量力"], "ans": 0, "why": "「同心協力」，是大家一起努力。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_2", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「爸爸在大太陽下工作，累得□□□□。」\n空格要填哪一個成語？", "opts": ["汗流浹背", "同心協力", "水深火熱", "忍氣吞聲"], "ans": 0, "why": "「汗流浹背」，是形容汗流得很多，連背都濕透了。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_3", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「他一整天沒吃東西，走起路來□□□□。」\n空格要填哪一個成語？", "opts": ["有氣無力", "同心協力", "群策群力", "全力以赴"], "ans": 0, "why": "「有氣無力」，是形容沒有精神，沒有力氣。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_4", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「做功課的時候，不可以□□□□，要專心。」\n空格要填哪一個成語？", "opts": ["三心二意", "同心協力", "全力以赴", "汗流浹背"], "ans": 0, "why": "「三心二意」，是心意不專一，做事不專心。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_5", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「他不會游泳，卻想游過大河，真是□□□□。」\n空格要填哪一個成語？", "opts": ["不自量力", "同心協力", "群策群力", "全力以赴"], "ans": 0, "why": "「不自量力」，是不衡量自己的能力，去做做不到的事。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_6", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「遇到難題，大家一起想辦法，這叫做□□□□。」\n空格要填哪一個成語？", "opts": ["群策群力", "三心二意", "有氣無力", "忍氣吞聲"], "ans": 0, "why": "「群策群力」，是大家一起想辦法，一起出力。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_7", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「比賽快要開始了，選手們都□□□□，想拿到好成績。」\n空格要填哪一個成語？", "opts": ["全力以赴", "三心二意", "有氣無力", "不自量力"], "ans": 0, "why": "「全力以赴」，是用盡全部力量去做。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_8", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「運動會是學校□□□□的大事。」\n空格要填哪一個成語？", "opts": ["一年一度", "一天一次", "一月一次", "一時一刻"], "ans": 0, "why": "「一年一度」，是一年一次。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_9", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「操場上掛滿了□□□□的彩旗。」\n空格要填哪一個成語？", "opts": ["五顏六色", "一模一樣", "無精打采", "有氣無力"], "ans": 0, "why": "「五顏六色」，是形容顏色很多。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_10", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「運動會的現場□□□□，人山人海。」\n空格要填哪一個成語？", "opts": ["熱鬧非凡", "無精打采", "三心二意", "冷冷清清"], "ans": 0, "why": "「熱鬧非凡」，是形容非常熱鬧。", "src": "補充（成語）", "gen": 1}, {"id": "q6x_11", "sec": "補充", "no": "成語", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「同心協力」是什麼意思？", "opts": ["大家一起努力", "每個人各玩各的", "一個人偷懶"], "ans": 0, "why": "「同心協力」，是大家心意相同，一起 我的力氣小，不過我的聲音可不小！」這句話想說什麼？", "opts": ["我的聲音很大", "我的聲音很小", "我沒有聲音"], "ans": 0, "why": "「不過」後面轉折，是說我的聲音可不小，就是聲音很大。", "src": "課本（習作四：不過）"}, {"id": "cf_3", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「同學找我出去玩，不過我的功課還沒寫完，不能出去。」我現在怎麼樣？", "opts": ["不能出去玩", "可以出去玩", "已經玩完了"], "ans": 0, "why": "功課還沒寫完，所以不能出去玩。", "src": "課本（習作四：不過）"}, {"id": "cf_4", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "哪一句用對了「不過」？", "opts": ["我的個子小，不過力氣大。", "我的個子小，所以不過力氣大。", "不過我的個子小力氣大。"], "ans": 0, "why": "「我的個子小，不過力氣大。」個子小和力氣大，意思相反，用「不過」連起來。", "src": "課本（習作五：看圖用不過完成句子）"}, {"id": "cf_5", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「跑步比賽好累，不過……」後面接哪一句最合適？", "opts": ["我很開心。", "我更累了。", "我好想睡覺。"], "ans": 0, "why": "「不過」後面要說相反的意思，累了，不過很開心，最合適。", "src": "課本（習作五：看圖用不過完成句子）"}, {"id": "cf_6", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「看看最後誰第一？」「最後」是什麼意思？", "opts": ["排在最後面", "排在最前面", "排在中間"], "ans": 0, "why": "「最後」，是排在最後面，也是事情的最後。", "src": "課本（課文）"}, {"id": "cf_7", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「看誰跑得比風快？」句尾要用什麼標點符號？", "opts": ["問號", "驚嘆號", "句號"], "ans": 0, "why": "這是一句問句，句尾要用問號。", "src": "課本（課文標點符號）"}, {"id": "cf_8", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「加油！加油！」句尾的「！」叫什麼？", "opts": ["驚嘆號", "問號", "頓號"], "ans": 0, "why": "「！」叫做驚嘆號，表示很興奮、很大聲。", "src": "課本（課文標點符號）"}, {"id": "cf_9", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「跑步、跳高、跳遠和拔河」，運動項目中間要用什麼標點符號隔開？", "opts": ["頓號", "句號", "問號"], "ans": 0, "why": "同類的詞語中間要用頓號「、」隔開。", "src": "課本（課文標點符號）"}, {"id": "cf_10", "sec": "課本", "no": "句型", "k": "mc", "st": ["S7"], "sk": "sense", "stem": "「一會兒拉過來，一會兒拉過去」，兩句話中間是什麼標點符號？", "opts": ["逗號", "句號", "問號"], "ans": 0, "why": "兩句話中間，要用逗號「，」隔開。", "src": "課本（課文標點符號）"}, {"id": "g4_1", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "今天學校在舉行什麼？", "opts": ["運動會", "考試", "畢業典禮"], "ans": 0, "why": "短文說：今天是學校的運動會。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "今天是學校的運動會，操場上好熱鬧。"}, {"id": "g4_2", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "小明得到第幾名？", "opts": ["第一名", "第二名", "第三名"], "ans": 0, "why": "短文說：小明得到第一名。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "小明在跑步比賽中跑得很快，得到第一名。"}, {"id": "g4_3", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "兩人三腳需要什麼，才能一起往前走？", "opts": ["同心協力", "各走各的", "跑得很快"], "ans": 0, "why": "短文說：要兩個人同心協力，才能一起往前走。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "兩人三腳比賽，要兩個人同心協力，才能一起往前走。"}, {"id": "g4_4", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "大隊接力時，要把什麼交給下一個人？", "opts": ["接力棒", "皮球", "水瓶"], "ans": 0, "why": "短文說：每個人都要把接力棒交給下一個人。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "大隊接力時，每個人都要把接力棒交給下一個人。"}, {"id": "g4_5", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "同學們在場邊做什麼？", "opts": ["大聲喊加油", "睡覺", "吃便當"], "ans": 0, "why": "短文說：同學們在場邊大聲喊加油。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "比賽時，同學們在場邊大聲喊：「加油！加油！」"}, {"id": "g4_6", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "拔河時，大家做什麼？", "opts": ["用力往後拉", "一起唱歌", "慢慢散步"], "ans": 0, "why": "短文說：大家抓緊繩子，用力往後拉。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "拔河的時候，大家抓緊繩子，用力往後拉。"}, {"id": "g4_7", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "小華跑完步，做了什麼？", "opts": ["喝水", "睡覺", "寫功課"], "ans": 0, "why": "短文說：他拿起水壺喝了一大口水。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "跑完步，小華滿頭大汗，他拿起水壺喝了一大口水。"}, {"id": "g4_8", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "彩旗在風中怎麼樣？", "opts": ["飄揚", "掉下來", "消失了"], "ans": 0, "why": "短文說：彩旗在風中飄揚。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "操場上掛著五顏六色的彩旗，在風中飄揚。"}, {"id": "g4_9", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "運動前要先做什麼？", "opts": ["暖身", "睡覺", "吃糖"], "ans": 0, "why": "短文說：運動前要先暖身，才不容易受傷。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "媽媽說，運動前要先暖身，才不容易受傷。"}, {"id": "g4_10", "sec": "補充", "no": "", "k": "mc", "st": ["S2"], "sk": "read", "stem": "比賽結束了，大家的心情怎麼樣？", "opts": ["很開心", "很生氣", "很難過"], "ans": 0, "why": "短文說：大家都笑得很開心。", "src": "補充題（不用課本也能答）", "gen": 1, "ctx": "比賽結束了，雖然沒有得到第一名，但是大家都笑得很開心。"}], "books": [{"id": "b0", "title": "運動會（課文）", "src": "課本 第四課", "e": "🏃", "paras": ["青天高，白雲飄，運動大會正熱鬧！大會舞，跳哇跳，心情跟著往上跳，笑容也在臉上跳哇跳！", "跑步比賽比誰快，汗水也要來比賽，看誰跑得比風快？兩人三腳比什麼？比同心，比協力，歡樂笑聲也來比一比！", "拔河比力氣，一會兒拉過來，一會兒拉過去，看看最後誰第一？", "我的力氣小，跑不快，跳不高，不過我的聲音可不小！「加油！加油！」你聽，你聽，我的聲音比天高！"], "notes": []}, {"id": "b1", "title": "拔河比賽", "src": "一.7（閱讀）", "e": "💪", "paras": ["寬闊的操場上，刺激的拔河比賽開始了。老師說：「只要大家同心協力，就可以發揮最大的力量。」大家紛紛抓緊繩子，伴隨著場邊的加油聲，一步一步努力往後退，用盡全身的力氣想要阻止繩子被拉走，額頭也流出許多汗水。我想不論輸贏，都會成為我們美好的回憶。"], "notes": []}, {"id": "b2", "title": "學校運動會", "src": "一.8（閱讀）", "e": "🎉", "paras": ["今天是學校一年一度的運動會。操場上飄著五顏六色的彩旗，到處充滿了歡笑聲，真是熱鬧極了！", "在大會舞、兩人三腳的項目結束後，老師帶大家往跑道走去，因為刺激的大隊接力比賽就要開始了。雖然要拿第一名並不容易，但我們一定會全力以赴，努力衝過終點線。"], "notes": []}, {"id": "b3", "title": "邀請", "src": "十.1（閱讀）", "e": "🐜", "paras": ["一隻小螞蟻在草地上，碰到一隻長頸鹿。", "小螞蟻抬起頭，大聲喊：「喂！你那麼高不行哪！要低一點。」", "「好，低一點。」長頸鹿彎下脖子。", "「不行，不行，還是太高了！」", "「好，我再試一試。」長頸鹿努力蹲下來。", "「不行，不行，還要再低一點。」", "「好，我再試一試……這樣可以了嗎？」", "「可以可以，聞到了嗎？」", "「我聞到了！我聞到了！」", "草地上，一隻趴下來的長頸鹿，開心的聞著草地上，一朵盛開的花。"], "notes": []}, {"id": "b4", "title": "國王的畫像", "src": "十.2（閱讀）", "e": "👑", "paras": ["從前有一位國王，他在一次戰爭中被敵人刺傷了一隻眼睛，從此以後，他的個性就變得非常殘暴。", "有一天，國王請來全國最好的一位畫家，幫他畫肖像。這位畫家確實不同凡響①，將國王畫得栩栩如生②，但是卻把國王的眼罩也畫出來了。國王看了之後十分生氣，就把這位畫家處死了。", "第二天，國王又請來了第二位畫家，第二位畫家學聰明了，幫國王畫了兩隻炯炯有神③的大眼睛。國王看了，很生氣的說：「這個不是我！你簡直是故意在諷刺我！」國王在極怒之下，又把第二位畫家處死了。", "第三天，國王再請來第三位畫家，第三位畫家沉思了很久，不敢輕易作畫，最後他總算想出了一個好辦法，那就是畫國王的側面畫像，把國王瞎掉的那一隻眼睛完全隱藏。", "國王看了之後，非常滿意，送了很多的金子給第三位畫家。"], "notes": ["不同凡響：形容比一般事物出色、不平凡。", "栩栩如生：指外形樣貌生動逼真，像真的一樣。", "炯炯有神：形容目光明亮、靈活。"]}, {"id": "b5", "title": "奇貨可居", "src": "十一.1（閱讀）", "e": "💰", "paras": ["根據史記記載：戰國時有一個商人呂不韋，他的事業非常成功，但總覺得商人的社會地位太低，所以有了從政的雄心。", "當時，秦國的太子安國君把兒子子楚送到趙國當人質①，因秦國曾多次攻打趙國，所以趙國對子楚並不禮遇②。當時呂不韋正好在趙國做生意，看到子楚的特殊背景和潦倒③處境，認為子楚就像一件寶物，可以買起來囤積，等待高價時再出售，於是就去求見子楚。他對子楚說：「我能光大你的門庭。」子楚笑著說：「您還是先光大自己門庭，然後再光大我的門庭吧！」呂不韋說：「您有所不知，我的門庭是要等待您的門庭光大後才能光大呀！」子楚心裡明白呂不韋的意思，便和他仔細的深談。", "呂不韋提供金錢給子楚做生活花費及結交賓客，又購買奇珍異寶帶回秦國獻給華陽夫人，營造子楚聰明賢能的名聲。在呂不韋的計畫下，子楚順利回到秦國，並被立為太子，最後還繼位成為國君，呂不韋也因此當上丞相。呂不韋果然因為子楚而得到名與利。後來「奇貨可居」就用來比喻利用某種專長或有價值的東西來謀利④。"], "notes": ["人質：被對方所拘留，或為了取信對方而作為抵押的人。", "禮遇：以優厚的禮節相待。", "潦倒：不得志或生活貧困。", "謀利：圖謀利益。"]}, {"id": "b6", "title": "五十步笑百步", "src": "十一.2（閱讀）", "e": "🚩", "paras": ["戰國時代，各國常為了爭權奪利、擴充版圖，而互相攻伐。為了讓百姓過安定的生活、遏止①戰禍，孟子便決定周遊列國，勸導各國國君重視仁義之道，改變好戰②的風氣。", "有一天，孟子到了梁國，梁惠王很得意的告訴孟子：「我治理國事真是盡心盡力！當河內遇到饑荒③，就把河內的災民遷移到河東，又將河東的糧食運到河內來賑濟④。而當河東遇到饑荒，我也是這樣處理。你看看鄰國，有哪一個國君像我這樣用心？但奇怪的是，為什麼鄰國的百姓沒有減少，而我這麼盡心盡力，我國的百姓卻沒有增多呢？」", "孟子笑著回答：「你喜歡戰爭，我來用戰爭做個比喻。當戰爭時，兩軍的刀劍已交鋒⑤，那戰敗的士兵丟盔棄甲，拖著兵器逃走，有的逃了一百步才停下來，有的則逃了五十步就止步了。如果逃了五十步的取笑那些逃了一百步的人，說他膽子小。您覺得怎麼樣呢？」", "梁惠王說：「這是不對的，只不過是沒跑一百步罷了，逃了五十步也是逃跑哇！」", "孟子說：「您既然明白這個道理，就不必奢望⑥百姓會比鄰國多了。彼此都不管人民的死活，如何能期望更多的人民來歸附呢？」梁惠王聽完孟子這麼說，才恍然大悟。"], "notes": ["遏止：阻止、防制。", "好戰：熱衷戰爭。", "饑荒：五穀不生、果類不熟。", "賑濟：以財物救濟。", "交鋒：刀鋒相接，指作戰、比賽。", "奢望：過分的希望。"]}, {"id": "b7", "title": "小明的運動會", "src": "補充", "e": "🏅", "paras": ["今天是學校的運動會，小明一早就穿上運動服出門。", "第一個項目是大會舞，同學們跟著音樂，一起跳舞。", "接著是兩人三腳，小明和小華綁好腳，一步一步往前走，最後得到第二名。", "運動會結束了，大家都滿頭大汗，卻笑得好開心。"], "notes": []}, {"id": "b8", "title": "拔河比賽（補充）", "src": "補充", "e": "🏁", "paras": ["下午，操場上要舉行拔河比賽。", "每一隊有十位同學，大家抓緊繩子，等老師吹哨子。", "哨子一響，兩隊同學用力往後拉，加油聲越來越大。", "比賽結束了，雖然我們輸了，但是大家同心協力，覺得很快樂。"], "notes": []}], "img": {}, "cover": [["一", "國字注音（詞語與句子 10 題、短文 2 篇）", ["z4_1", "z4_2", "z4_3", "z4_4", "z4_5", "z4_6", "z4_9", "z4_10", "z4_11", "z4_12", "z_a1", "z_a2", "z_a3", "z_a4", "z_a5", "z_a6", "zp_a", "z_b1", "z_b2", "z_b3", "z_b4", "z_b5", "z_b6", "z_b7", "zp_b"]], ["一", "閱讀測驗：拔河比賽、學校運動會（完整短文）", ["b1q1", "b1q2", "b2q1", "b2q2"]], ["二", "造詞（舞、鬧、河、協、運、可、步；改成選出正確的詞語，共 7 題）", ["q2_1", "q2_2", "q2_3", "q2_4", "q2_5", "q2_6", "q2_7"]], ["三", "選擇題（河、注音寫成國字、錯別字、容、舞；共 5 題）", ["q3_1", "q3_2", "q3_3", "q3_4", "q3_5"]], ["四", "先寫國字，再造詞：「彳＋主」是什麼字？（拼字）", ["c_5"]], ["四", "先寫部首、再造詞（協、動、最、往；共 7 題；「彳＋主」見「接力拼拼」）", ["q4_1b", "q4_2a", "q4_2b", "q4_3a", "q4_3b", "q4_4a", "q4_4b"]], ["五", "改錯題（3 題，共 6 個錯字）", ["ty5_ function chime(f,d=.7,delay=0,v=.16){if(!S.sfx)return;try{if(!getAC())return;const t=AC.currentTime+delay;[[1,1],[2.01,.28],[3.02,.1]].forEach(([m,a])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v*a,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+d/(m>1?1.6:1));o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)})}catch(e){}}

const inRect=(el,x,y)=>{const r=el.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom};
/* 拖拉：只負責「拖」；點一下由各元素自己的 click 處理 */
function dragBind(root,o){root.addEventListener('pointerdown',e=>{const el=e.target.closest(o.item);if(!el||!root.contains(el)||(o.can&&!o.can(el)))return;
  const sx=e.clientX,sy=e.clientY,r=el.getBoundingClientRect();let ghost=null,moved=false;
  const zones=()=>$$(o.zone,root.closest('.screen')||document);
  const move=ev=>{const dx=ev.clientX-sx,dy=ev.clientY-sy;if(!moved&&Math.hypot(dx,dy)<10)return;
    if(!moved){moved=true;ghost=el.cloneNode(true);ghost.className+=' ghost';ghost.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;margin:0;z-index:99;pointer-events:none;transform:scale(1.12) rotate(-4deg);opacity:.95`;document.body.appendChild(ghost);el.classList.add('dragging')}
    ghost.style.left=(r.left+dx)+'px';ghost.style.top=(r.top+dy)+'px';zones().forEach(z=>z.classList.toggle('over',inRect(z,ev.clientX,ev.clientY)))};
  const up=ev=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
    zones().forEach(z=>z.classList.remove('over'));
    if(moved){ghost.remove();el.classList.remove('dragging');const z=zones().find(z=>inRect(z,ev.clientX,ev.clientY));if(z)o.drop(el,z);o._nc=Date.now()}};

      $$('.key',sb).forEach(kb=>kb.onclick=()=>{if(kb.disabled)return;const b2=chosen[cur];

      else{failed=true;sfx('bad');b.classList.add('bad');b.disabled=true;toast('不對喔，再想一想。');later(()=>{if(!locked)hf.className='hfrog'},700)}};

/* ====== S8 裁判抓錯字：改錯字、刪掉多餘的字 ====== */
function gSpy(){const all=POOL.S8,ex=all.filter(i=>IT[i].marks.some(m=>m.extra)),lg=all.filter(i=>/^ty_/.test(i)),sh=all.filter(i=>!ex.includes(i)&&!lg.includes(i));
  const std=S.len==='std';const ids=shuffle(pickN(lg,1).concat(pickN(ex,std?2:1),pickN(sh,std?4:3)));const {sb}=stageShell('S8',ids.length);
  function round(id,done){const it=IT[id];const s=it.s,zs=zyArr(s);let failed=false,left=it.marks.length,cur=null;const fixed={};
    /* 一次只看一小段（一個逗號或句號以內），字不會太多 */
    const segs=[];{let a=0;for(let i=0;i<s.length;i++){if('，。！？'.includes(s[i])||i===s.length-1){const ms=it.marks.filter(m=>m.i>=a&&m.i<=i);if(ms.length)segs.push({a,b:i+1,ms});a=i+1}}}
    let si=0;const isEx=it.marks.some(m=>m.extra);
    function seg(){const sg=segs[si];const lastSeg=si===segs.length-1;let segLeft=sg.ms.length;
      window.TGI={id,marks:sg.ms.map(m=>m.i),extra:sg.ms.filter(m=>m.extra).map(m=>m.i)};
      const tiles=[...s.slice(sg.a,sg.b)].map((ch,k)=>{const i=sg.a+k;return isCJK(ch)?`<button class="sch" data-i="${i}">${zs[i]?`<ruby>${esc(ch)}<rt>${zs[i]}</rt></ruby>`:esc(ch)}</button>`:`<span class="spun">${esc(ch)}</span>`}).join('');
      const ins=isEx?'找出多餘的字，點它。':(segs.length>1?`第 ${si+1} 段：找出錯字，點它。`:'找出錯字，點它。');
      const segSay=s.slice(sg.a,sg.b);
      sb.innerHTML=progBar()+inst('🦁',ins,ins)+`<div class="radar"><div class="rcount" id="rc">🦁 還有 ${left} 個${isEx?'多餘的字':'錯字'}${segs.length>1?`（第 ${si+1}／${segs.length} 段）`:''}</div><div class="rtxt big" id="rt">${tiles}</div></div><div class="fixbox" id="fx"><div class="hint lt" style="text-align:center">${isEx?'點出多餘的字':'點出錯字'} ${spk(segSay)}</div></div>`;
      setPB((ids.indexOf(id)+si/segs.length)/ids.length);autoSay(ins+segSay);
      const tilesEl=$$('.sch',sb);
      function oneDone(t,m){left--;segLeft--;$('#rc',sb).textContent=left?`🦁 還有 ${left} 個${isEx?'多餘的字':'錯字'}`:'🎉 都找到了！';cur=null;
        if(segLeft>0){$('#fx',sb).innerHTML='<div class="hint lt" style="text-align:center">好棒！這一段還有，再找找看</div>'}
        else if(!lastSeg){$('#fx',sb).innerHTML='<div class="hint lt" style="text-align:center">這一段找完了！看下一段 ➜</div>';say('這一段找完了。看下一段。');later(()=>{si++;seg()},1500)}
        else{$('#fx',sb).innerHTML='';record(id,!failed,t);
          if(isEx){const mm=it.marks[0];const s2=s.slice(0,mm.i)+s.slice(mm.i+1);
            qDone({first:!failed,html:WHYBOX(T(s2),`多出來的字是「${mm.c}」，把它拿掉，句子就通順了。`),say:'多出來的字是，'+mm.c+'。'+s2,onDone:done,delay:700})}
          else{const txt=it.marks.map(x=>`「${x.c}」→「${x.r}」`).join('　');
            const fixedS=segs.map(g=>[...s.slice(g.a,g.b)].map((c,k)=>fixed[g.a+k]!=null?`⟦${fixed[g.a+k]}⟧`:c).join('')).join('');
            qDone({first:!failed,html:WHYBOX(T(fixedS),'錯字改正：'+txt),say:'改正了，'+it.marks.map(x=>x.r).join('，'),onDone:done,delay:700})}}}
      function showFix(i){const m=it.marks.find(x=>x.i===i);cur=m;tilesEl.forEach(t=>t.classList.toggle('sus',+t.dataset.i===i));
        $('#fx',sb).innerHTML=`<div class="fxh">這是錯字。選出正確的字。 ${spk('這是錯字。選出正確的字。')}</div><div class="chipr">${shuffle(m.opts).map(o=>`<button class="chipb" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
        autoSay('這是錯字。選出正確的字。');
        $$('#fx .chipb',sb).forEach(b=>b.onclick=()=>{if(b.disabled)return;if(b.dataset.o===m.r){sfx('ok');const t=tilesEl.find(t=>+t.dataset.i===m.i);fixed[m.i]=m.r;t.classList.remove('sus');t.classList.add('caught');t.disabled=true;
            const s2=[...s].map((c,k)=>fixed[k]!=null?fixed[k]:c).join('');const z2=zyArr(s2);t.innerHTML=`<ruby>${esc(m.r)}<rt>${z2[m.i]||''}</rt></ruby>`;popEl(t,'找到了！');
            oneDone(t,m)}
          else{failed=true;b.disabled=true;b.classList.add('bad');sfx('bad');toast('不是這個，再選選看。')}})}
      tilesEl.forEach(t=>t.onclick=()=>{if(t.classList.contains('caught'))return;const i=+t.dataset.i;const m=it.marks.find(x=>x.i===i);
        if(m&&m.extra){sfx('ok');t.classList.add('caught','struck');t.disabled=true;popEl(t,'找到了！');oneDone(t,m)}
        else if(m)showFix(i);
        else{failed=true;sfx('bad');t.classList.add('safe');setTimeout(()=>t.classList.remove('safe'),700);toast('這個字是對的，再找找。')}})}
    seg()}
  runRounds(sb,ids,round)}

/* ====== S10 運動場圖書館：閱讀測驗 ====== */
function noteMark(i){return String.fromCharCode(0xE000+i)}
function bookHTML(b){const mk=['①','②','③','④','⑤'];
  const para=s=>{let t=s;mk.forEach((m,i)=>{t=t.split(m).join(noteMark(i))});let h=T(t);h=h.replace(/[\ue000-\ue004]/g,c=>`<button class="nt" data-n="${c.charCodeAt(0)-0xE000}" aria-label="注釋">${mk[c.charCodeAt(0)-0xE000]}</button>`);const say=t.replace(/[-]/g,'').replace(/[\n　]+/g,'，');return`<p>${h}<button class="ibtn sp pbtn" data-say="${esc(say)}" aria-label="讀這一段">🔊</button></p>`};
  const title=T(b.title)+(b.titleNote?`<button class="nt" data-n="0">①</button>`:'');
  return `<h3 class="btitle">${title}</h3>${b.paras.map(para).join('')}<div class="notes hint lt2">${b.notes.map((n,i)=>`<div>${mk[i]} ${T(n)}</div>`).join('')}</div>`}
function bookSay(b){return [b.title].concat(b.paras).join('。').replace(/[①②③④⑤]/g,'').replace(/[　]+/g,'，')}
function gLib(){S.books=S.books||{};const {sb}=stageShell('S10',4);
  const rec=D.books.find(b=>!S.books[b.id])||D.books[0];
  sb.innerHTML=inst('📖','選一篇文章來讀。','選一篇文章來讀。讀完，再回答問題。')+`<div class="shelf">${D.books.map(b=>`<button class="bookc ${b.id===rec.id?'rec':''}" data-b="${b.id}"><span class="be">${b.e}</span><span class="bt2">${T(b.title)}</span><span class="bs">${S.books[b.id]?'✅ 讀過了':(b.id===rec.id?'⭐ 推薦':'')}</span></button>`).join('')}</div>`;

  function read(b){const qids=D.items.filter(i=>i.bk===b.id&&(!i.lesson||S.lesq)).map(i=>i.id);window.CURID=qids[0];window.TGI={book:b.id,qids};

    $('#lis',sb).onclick=()=>say(bookSay(b),null,true);if(S.auto&&S.tts)later(()=>say('讀一讀這篇文章。想聽的話，按聽故事。讀完了，按綠色的按鈕。'),400);
    $('#go2',sb).onclick=()=>{stopSay();ask(b,qids)}}

      setProg(i,qids.length);const q=mcq(qids[i]);q.ctx=null;q.say=(q.say||q.stem.replace(/\n/g,'，'))+optSay(q);window.CURID=qids[i];

      renderMCQ($('#qh',sb),q,{retry:true,onDone:()=>{i++;next()}})};next()}}

/* ====== 排序造句共用：S6 接力排排隊 ====== */
const CODES=['①','②','③','④','⑤','⑥'];
function orderRound(sb,ids,id,it,done){const ch=it.chunks;let placed=[],failed=false;window.TGI={id,ord:it.ord};
  /* 每次把詞打亂擺放，而且順序一定和答案不同；格子上的①②③也照擺放位置編 */
  let disp=ch.map((c,i)=>i);for(let t=0;t<40;t++){disp=shuffle(ch.map((c,i)=>i));if(ch.length<2||!disp.every((x,k)=>x===it.ord[k]))if(ch.length<3||!disp.every((x,k)=>x===k))break}
  const pos=i=>disp.indexOf(i);
  const em='🎀',cn='彩帶',first='第一個';
  const instT='點下面的詞，排成一句話。',instS='先點第一個詞，再點下一個詞，排成一句話。';
  function orderStep(){
    const draw=()=>{sb.innerHTML=progBar()+inst(em,instT,instS)+(it.intro?`<div class="introq">${T(it.intro)} ${spk(it.intro)}</div>`:'')+(it.prefix?`<div class="target">${T(it.prefix)}（　　　）${it.end||'。'}</div>`:'')
      +`<div class="station lily"><div class="slotsr">${ch.map((c,i)=>`<button class="slotb ${placed[i]!=null?'full':''}" data-p="${i}"><small>第 ${i+1} 個</small>${placed[i]!=null?`<span>${T(ch[placed[i]])}</span>`:'<span class="q">？</span>'}</button>`).join('')}</div></div><div class="hint lt" style="text-align:center">點一個詞，它就放到下一個位置。點上面的詞，可以拿回來。</div><div class="sbricks tiles">${disp.map((i,k)=>`<button class="sbrick tile" data-i="${i}" ${placed.includes(i)?'disabled':''} style="--c:${GCOL[k%6]}"><b class="cd">${CODES[k]}</b>${T(ch[i])}</button>`).join('')}</div>`;
      setPB(ids.indexOf(id)/ids.length);
      $$('.tile',sb).forEach(t=>t.onclick=()=>{if(t.disabled)return;placed.push(+t.dataset.i);sfx('pop');if(placed.length===ch.length)check();else draw()});
      $$('.slotb',sb).forEach(sl=>sl.onclick=()=>{const p=+sl.dataset.p;if(placed[p]==null)return;placed=placed.slice(0,p);sfx('tick');draw()})};
    const check=()=>{draw();const ok=placed.every((x,i)=>x===it.ord[i]);
      if(ok){sfx('win');record(id,!failed,sb);say(it.std.replace(/[「」]/g,''));qDone({first:!failed,html:WHYBOX(T(it.std)+`<div class="hint">答案：${it.ord.map(i=>CODES[pos(i)]).join('')}</div>`,it.why),say:it.std.replace(/[「」]/g,''),onDone:done,delay:900})}
      else{failed=true;sfx('bad');$$('.slotb',sb).forEach((s,i)=>s.classList.add(placed[i]===it.ord[i]?'good':'wrong'));toast('順序不對，再試試看。');later(()=>{placed=[];draw()},1100)}};
    draw();autoSay((it.intro?it.intro.replace(/[。？！\s]+$/,'')+'。':'')+'點下面的詞，一個一個排成句子。點一個詞，它會放到下一個位置。點上面的詞，可以拿回來。可以排的有：'+disp.map(i=>ch[i]).join('；')+'。')}
  if(it.pre){const q=MQ(it.pre.q,it.pre.opts,it.pre.ans,it.pre.why,{pO:0});q.id=id;q.sk='sent';q.say=it.pre.q+optSay(q);
    sb.innerHTML=progBar()+'<div id="qh"></div>';setPB(ids.indexOf(id)/ids.length);
    renderMCQ($('#qh',sb),q,{retry:true,norec:true,onAnswer:first=>{if(!first)failed=true},onDone:()=>orderStep()})}
  else orderStep()}
function gCoaster(){const ids=pickN(POOL.S6,CNT(POOL.S6.length,5,5));const {sb}=stageShell('S6',ids.length);
  runRounds(sb,ids,(id,done)=>orderRound(sb,ids,id,IT[id],done))}

/* ====== S11 彩帶串句子：用詞語造句（跳彩帶）＋ 幫句子放標點 ====== */
function gBricks(){const std=S.len==='std';
  const sn=POOL.S11.filter(i=>IT[i].k==='sent'),pu=POOL.S11.filter(i=>IT[i].k==='punct');
  const a=pickN(sn,std?3:2),b=pickN(pu,std?4:3);const ids=[];for(let k=0;k<Math.max(a.length,b.length);k++){if(a[k])ids.push(a[k]);if(b[k])ids.push(b[k])}
  const {sb}=stageShell('S11',ids.length);
  function sentRound(id,it,done){let placed=[],failed=false,hinted=false;const bank=shuffle(it.toks.concat(it.dis).map((t,i)=>({t,i})));window.TGI={id,toks:it.toks,dis:it.dis};
    const draw=()=>{const pre=(()=>{let n=0;while(n<placed.length&&placed[n].t===it.toks[n])n++;return n})();
      sb.innerHTML=progBar()+inst('🌟',`用「${it.w}」造句：照順序點彩帶。`,`用${it.w}造句。照順序，一條一條點彩帶，排成一句話。`)+`<div class="target">造句詞語：<b>${T(it.w)}</b></div><div class="station river"><div class="floors" id="fl">${placed.length?placed.map((p,k)=>`<button class="sbrick placed" data-k="${k}" style="--c:${GCOL[p.i%6]}">${T(p.t)}</button>`).join(''):'<div class="hint lt">點下面的彩帶，排在這裡</div>'}</div></div><div class="sbricks" id="bk">${bank.map(b=>`<button class="sbrick ${placed.some(p=>p.i===b.i)?'used':''} ${hinted&&!placed.some(p=>p.i===b.i)&&b.t===it.toks[pre]?'glow':''}" data-i="${b.i}" ${placed.some(p=>p.i===b.i)?'disabled':''} style="--c:${GCOL[b.i%6]}">${T(b.t)}</button>`).join('')}</div><div class="row" style="justify-content:center"><button class="btn w sm" id="rs">🔄 重來</button><button class="btn p sm" id="ht">💡 提示</button></div>`;
      setPB(ids.indexOf(id)/ids.length);
      $$('#bk .sbrick',sb).forEach(b=>b.onclick=()=>{if(b.disabled)return;placed.push(bank.find(x=>x.i===+b.dataset.i));hinted=false;sfx('pop');if(placed.length===it.toks.length)check();else draw()});
      $$('.placed',sb).forEach(b=>b.onclick=()=>{placed.splice(+b.dataset.k,1);sfx('tick');draw()});
      $('#rs',sb).onclick=()=>{placed=[];draw()};$('#ht',sb).onclick=()=>{failed=true;hinted=true;draw();toast('亮亮的彩帶，是下一條！')}};
    const check=()=>{const ok=placed.every((p,i)=>p.t===it.toks[i]);
      if(ok){draw();$$('.placed',sb).forEach(b=>b.classList.add('shine'));sfx('win');confetti(14);record(id,!failed,sb);S.sents.push({pat:it.w,text:it.std});if(S.sents.length>60)S.sents.shift();save();say(it.std);
        qDone({first:!failed,html:WHYBOX(T(it.std),`這是老師的示範句。你也可以用「${it.w}」想一個自己的句子，說給大家聽！`),say:it.std,onDone:done,delay:1000,force:false})}
      else{failed=true;sfx('bad');draw();let k=0;while(k<placed.length&&placed[k].t===it.toks[k])k++;const el=$$('.placed',sb)[k];if(el)el.classList.add('wrong');toast(`第 ${k+1} 塊不對，再試試。`);later(()=>{placed=placed.slice(0,k);draw()},1200)}};
    draw();autoSay(`用${it.w}造句。照順序點彩帶。可以用的彩帶有：${bank.map(b=>b.t).join('，')}。`)}
  const PNM={'，':'逗號','。':'句號','？':'問號','、':'頓號','！':'驚嘆號'};
  function punctRound(id,it,done){const MKS=it.marks||['，','。','？'],ext=MKS.length>3;const ns=it.ans.length;let k=0,failed=false;const put=Array(ns).fill(null);window.TGI={id,ans:it.ans};
    const full=()=>it.parts.map((p,i)=>p+(i<ns?put[i]||'':'')).join('');
    const draw=()=>{const body=it.parts.map((p,i)=>T(p)+(i<ns?`<span class="pstone ${put[i]?'ok':i===k?'act':''}">${put[i]?put[i]:'□'}</span>`:'')).join('');
      sb.innerHTML=progBar()+inst('✏️',ext?'選出對的標點符號，點一點。':'話還沒說完，點「，」；話說完了，點「。」；問問題，點「？」',ext?'選出對的標點符號。話還沒說完，點逗號。一樣的詞，中間點頓號。話說完了，點句號。問問題，點問號。很開心，點驚嘆號。':'話還沒說完，點逗號。話說完了，點句號。問問題，點問號。')+`<div class="station river punctw"><div class="ptxt">${body}</div></div><div class="pbtns">${MKS.map(m=>`<button class="pk" data-p="${m}"><b>${m}</b><span>${T(PNM[m])}</span></button>`).join('')}</div>`;
      setPB((ids.indexOf(id)+k/ns)/ids.length);
      const sayStep=(first)=>autoSay((first?(ext?'話還沒說完，點逗號。一樣的詞，中間點頓號。話說完了，點句號。問問題，點問號。很開心，點驚嘆號。':'話還沒說完，點逗號。話說完了，點句號。問問題，點問號。'):'')+`看第${k+1}個空格。前面是：${it.parts[k]}。${it.parts[k+1]?'後面是：'+it.parts[k+1]+'。':'後面沒有字了。'}點哪一個標點符號？`);
      sayStep(k===0&&put.every(x=>!x));
      $$('.pk',sb).forEach(b=>b.onclick=()=>{const c=b.dataset.p;
        if(it.ans[k].includes(c)){put[k]=c;sfx('ok');k++;if(k>=ns){draw2()}else draw()}
        else{failed=true;sfx('bad');b.classList.add('bad');toast(`這裡不是${PNM[c]}，再試試。`);later(()=>b.classList.remove('bad'),500)}})};
    const draw2=()=>{const body=it.parts.map((p,i)=>T(p)+(i<ns?`<span class="pstone ok">${put[i]}</span>`:'')).join('');
      sb.innerHTML=progBar()+inst('✏️','標點都放好了！','標點都放好了')+`<div class="station river punctw"><div class="ptxt">${body}</div></div>`;setPB((ids.indexOf(id)+1)/ids.length);sfx('win');
      record(id,!failed,sb);const txt=full();say(txt);
      qDone({first:!failed,html:WHYBOX(T(txt),(ext?'逗號「，」表示話還沒說完；頓號「、」用來隔開一樣的詞；句號「。」表示一句話說完了；問號「？」表示在問問題；驚嘆號「！」表示很開心、很驚訝。':'逗號「，」表示話還沒說完，要停一下；句號「。」表示一句話說完了；問號「？」表示在問問題。')),say:txt,onDone:done,delay:1000})};
    draw()}
  runRounds(sb,ids,(id,done)=>{const it=IT[id];if(it.k==='punct')punctRound(id,it,done);else sentRound(id,it,done)})}

'use strict';
function mixIds(n){const ks=Object.keys(SK);const out=[];let g=0,guard=0;
  while(out.length<n&&guard++<400){const k=ks[g%ks.length];const id=pickN(ALLIDS[k].filter(x=>!out.includes(x)&&mcq(x)),1)[0];if(id)out.push(id);g++}return shuffle(out)}
function gBoss(){quizRun({stage:'S12',ids:mixIds(NQ(10)),title:'🦁 拔河大力士',hearts:5,boss:true})}
function quizRun(o){const N=o.ids.length;if(!N){toast('目前沒有可以練習的題目');return notebook('wrong')}
  startSession(o.stage,o.hearts||0);const el=go(`${hudHTML({title:o.title,hearts:!!o.hearts,prog:'0/'+N})}<div class="stagebody" id="sb"></div>`,'stage');bindBack();const sb=$('#sb',el);
  let i=0,hint=2,coil=2;
  function next(){if(SES.max&&SES.hearts<=0)return endStage({dead:true});if(i>=N)return endStage({extra:o.boss?'<div class="card" style="max-width:26rem">🦁 拔河大力士被拉過來了，運動場上響起歡呼聲！大家為你鼓掌！🎉</div>':''});
    setProg(i,N);const q=mcq(o.ids[i]);q.say=qSay(q);
    sb.innerHTML=(o.boss?`<div class="bosshead"><div class="bossface" id="bf">${i>=N-1?'😵':'🦁'}</div><div style="flex:1"><div style="font-weight:900">${T('拔河大力士')}　${T('力氣')}</div><div class="hpbar" style="max-width:none"><i id="hp" style="width:${(N-i)/N*100}%"></i></div></div></div>`:progBar())+`<div class="powers"><button class="btn p sm" id="pc" ${coil?'':'disabled'}>🛡️ 刪去 2 個×${coil}</button><button class="btn b sm" id="ph" ${hint?'':'disabled'}>🔍 提示 ×${hint}</button></div><div class="hint" id="th" style="min-height:1.6rem"></div><div id="qh"></div>`;
    if(!o.boss)setPB(i/N);
    const h=renderMCQ($('#qh',sb),q,{retry:!!o.retry,onAnswer:ok=>{if(ok){const bf=$('#bf');if(bf)bf.classList.add('hit');const hp=$('#hp');if(hp)hp.style.width=((N-i-1)/N*100)+'%';if(o.boss){popEl($('#bf'),'💪 用力拉！')}}else{loseHeart();const bf=$('#bf');if(bf)bf.classList.add('atk')}},onDone:()=>{i++;next()}});
    $('#pc').onclick=()=>{if(!coil)return;if(h.remove2()){coil--;$('#pc').textContent='🛡️ 刪去 2 個×'+coil;if(!coil)$('#pc').disabled=true;sfx('pop')}};
    $('#ph').onclick=()=>{if(!hint)return;hint--;$('#ph').textContent='🔍 提示 ×'+hint;if(!hint)$('#ph').disabled=true;$('#th').innerHTML='💡 '+T(q.tip||'仔細讀題目，把每個選項讀一讀。');sfx('pop')}}
  next()}

const CL={teams:3,names:['第一組','第二組','第三組','第四組'],n:10,sec:0,types:{}};Object.keys(SK).forEach(k=>CL.types[k]=1);
const TCOL=['#e04848','#1f78e0','#22a653','#9b6bff'];
function classSetup(){
  const el=go(`${hudHTML({title:'🏃 全班運動會',back:true,pg:true})}<div class="page"><div class="wrap"><div class="card"><h3>分組</h3><div class="seg" id="tn">${[2,3,4].map(n=>`<button data-v="${n}" class="${CL.teams===n?'on':''}">${n} 組</button>`).join('')}</div><div class="teamcfg" style="margin-top:.6rem" id="tc"></div></div>

  <div class="hint" style="margin-bottom:.6rem">${T('玩法：各組輪流回答。答對的組別，選手就往前跑一格；先跑到終點、或題目結束時跑得最遠的組別獲勝！每題答完都會顯示解析，老師可以順便講解。可用鍵盤 1～4 或 A～D 選答案。答題不會計入個人學習紀錄。')}</div>
  <div class="row" style="justify-content:center"><button class="btn g big" id="st">🏃 開始比賽</button></div></div></div>`,'stage');
  bindBack(hub);
  const drawT=()=>{$('#tc',el).innerHTML=Array.from({length:CL.teams},(_,i)=>`<label class="tpill" style="background:${TCOL[i]}">🏃<input data-i="${i}" value="${esc(CL.names[i])}" maxlength="6" style="width:6rem;margin-left:.3rem"></label>`).join('');$$('#tc input',el).forEach(x=>x.oninput=()=>{CL.names[+x.dataset.i]=x.value.trim()||('第'+(+x.dataset.i+1)+'組')})};drawT();
  const seg=(id,key,cb)=>$$('#'+id+' button',el).forEach(b=>b.onclick=()=>{CL[key]=+b.dataset.v;$$('#'+id+' button',el).forEach(x=>x.classList.toggle('on',x===b));if(cb)cb()});
  seg('tn','teams',drawT);seg('qn','n');seg('qs','sec');
  $$('#ty button',el).forEach(b=>b.onclick=()=>{const k=b.dataset.k;const cnt=Object.values(CL.types).filter(Boolean).length;if(CL.types[k]&&cnt<=1){toast('至少要選一種題型');return}CL.types[k]=CL.types[k]?0:1;b.classList.toggle('on',!!CL.types[k])});
  $('#st').onclick=()=>{getAC();classPlay()}}
function classPlay(){
  const pool=shuffle([].concat(...Object.keys(CL.types).filter(k=>CL.types[k]).map(k=>ALLIDS[k]))).filter(id=>mcq(id));
  const ids=pool.slice(0,CL.n);
  const N=ids.length,T_=CL.teams,teams=Array.from({length:T_},(_,i)=>({n:CL.names[i],c:TCOL[i],s:0}));let i=0,tm=null;
  const el=go(`<div class="hud"><button class="ibtn" id="hBack">⬅️</button><div class="title-h">🏃 全班運動會</div><div class="grow"></div><span class="pill" id="prog">0/${N}</span></div><div class="stagebody" id="sb" style="font-size:1.15em"></div>`,'stage');
  bindBack(()=>confirmBox('結束比賽？','目前的比分不會保留。','結束',classSetup));const sb=$('#sb',el);
  function race(){return`<div class="race">${teams.map((t,k)=>`<div class="rtrack"><span class="tn" style="color:${t.c}">${esc(t.n)}</span><div class="lane2"><span class="bal" id="bal${k}" style="left:${4+t.s/N*88}%">🏃</span></div><b style="width:2.4rem">${t.s}</b></div>`).join('')}</div>`}
  function next(){if(i>=N)return finish();setProg(i,N);const t=teams[i%T_],q=mcq(ids[i]);q.say='輪到'+t.n+'。'+qSay(q);
    sb.innerHTML=race()+`<div style="text-align:center"><span class="tpill" style="background:${t.c}">🎯 輪到：${esc(t.n)}</span></div>${CL.sec?'<div class="timerbar"><i id="tb" style="width:100%"></i></div>':''}<div id="qh"></div>`;
    const h=renderMCQ($('#qh'),q,{norec:true,tag:true,noauto:false,onAnswer:ok=>{if(tm)tm();if(ok){t.s++;const b=$('#bal'+(i%T_));if(b)b.style.left=(4+t.s/N*88)+'%';sfx('win')}},onDone:()=>{i++;if(teams.some(x=>x.s>=N))i=N;next()}});
    if(CL.sec){let left=CL.sec;const tb=$('#tb');tm=loop(dt=>{left-=dt;tb.style.width=Math.max(0,left/CL.sec*100)+'%';tb.style.background=left<CL.sec*.25?'var(--coral)':left<CL.sec*.5?'var(--sun2)':'var(--green)';if(left<=0){tm();tm=null;h.timeout()}})}}
  function finish(){const rk=teams.slice().sort((a,b)=>b.s-a.s);const top=rk[0].s;S.cls++;saveNow();checkBadges();sfx('win');confetti(40);
    sb.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:3.4rem">🏆</div><h2>比賽結束！</h2>${rk.map((t,k)=>`<div class="tpill" style="background:${t.c};margin:.2rem;font-size:${1.6-k*.1}rem">${['🥇','🥈','🥉','4️⃣'][k]} ${esc(t.n)}　${t.s} 分${t.s===top?'　👑':''}</div><br>`).join('')}<div class="row" style="justify-content:center;margin-top:.6rem"><button class="btn w" id="mp">🗺️ 回運動場地圖</button><button class="btn g big" id="ag">🔁 再比一場</button><button class="btn b" id="cf">⚙️ 重新設定</button></div></div>`;

(function(){const cue=document.createElement('button');cue.className='scrollcue';cue.innerHTML='👇 還有喔，往下看';document.body.appendChild(cue);let sc=null;
